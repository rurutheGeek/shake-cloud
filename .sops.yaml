# SOPS の暗号化ルール。実際に使うときは .sops.yaml へコピーし、
# age の公開鍵（age1 で始まる文字列）へ置き換えます。
# この 1 ファイルだけは公開鍵しか含まないため、Git へコミットします。
#
#   age-keygen -o ~/.config/sops/age/keys.txt
#   grep 'public key' ~/.config/sops/age/keys.txt
#
# 秘密鍵 (~/.config/sops/age/keys.txt) はリポジトリの外に置き、
# 管理PCと外部コピーの2か所だけで保持します。
#
# 受信者は**カンマ区切りで複数**指定できます。特定の1人の鍵でしか復号できない
# 状態にしないため、少なくとも「利用者2人ぶん」と「自動実行用」を並べます。
#
#   age: age1AAA...,age1BBB...,age1CI...
#
# **受信者を足しただけでは既存ファイルは読めるようになりません。**
# 足したあと必ず再暗号化します。
#
#   sops updatekeys platform/sops/*.sops.yaml
#
# 忘れると「.sops.yaml には居るのに復号できない」状態になります。
# tests/test_sops_config.py が、暗号化済みファイルの受信者一覧と
# .sops.yaml の設定が一致するかを検査します。
creation_rules:
  - path_regex: platform[\\/]sops[\\/].*\.sops\.yaml$
    age: age1r6y7am38u759z2ktg2zhmn5j8vpvzseptvflaxa69l6wadxlraes806g2h
  # Flux が復号する秘密値。クラスタ内の sops-age Secret と同じ鍵で暗号化する。
  - path_regex: platform[\\/]flux[\\/].*\.sops\.yaml$
    age: age1r6y7am38u759z2ktg2zhmn5j8vpvzseptvflaxa69l6wadxlraes806g2h
