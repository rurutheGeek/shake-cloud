---
version: 3
images:
  base_image:
    name: quay.io/centos/centos:stream9
dependencies:
  ansible_core:
    package_pip: ansible-core==2.17.14
  ansible_runner:
    package_pip: ansible-runner==2.4.1
  python_interpreter:
    package_system: python3.11
    python_path: /usr/bin/python3.11
  galaxy: ../ansible/requirements.yml
  python:
    - pynetbox==7.5.0
    - requests==2.32.4
    - pytz==2026.3.post1
  system:
    - openssh-clients
    - git-core
