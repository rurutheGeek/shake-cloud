site_name: Shake Lab Docs
docs_dir: docs
site_dir: stacks/docs/site
use_directory_urls: true
theme:
  name: mkdocs
  locale: ja
nav:
  - ホーム: index.md
  - サービス図: service-map.md
  - ネットワーク図: network-map.md
  - ドキュメント地図: map.md
  - ドキュメントの書き方: contributing-docs.md
  - セキュリティ:
      - セキュリティ（信頼境界と対策）: architecture/security.md
      - 区画と区画間の通信（VLAN）: operations/vlan.md
      - Tailscale（宅外からの経路）: operations/net.md
      - 認証基盤（identity・Authentik）: operations/identity.md
      - 秘密値の管理: operations/secrets.md
      - Nextcloudのアクセス権限: operations/nextcloud-permissions.md
      - Vaultwardenの管理: operations/vaultwarden.md
      - 構成監査の未対応指摘: audits/config-audit-2026-09-16.md
  - 利用者向け:
      - 利用ガイドの入口: services/index.md
      - 全サービスの使い方: services/usage.md
      - 共通ログインの使い方: services/identity.md
      - Homarrハブ: services/homarr.md
      - 通信速度テスト（LibreSpeed）: services/librespeed.md
      - ポケモン翻訳: services/poke-translate.md
      - 日本語表示: services/language.md
      - Nextcloudの使い方: services/nextcloud-guide.md
      - Nextcloudファイルエージェント（AI用MCP）: services/nextcloud-agent.md
      - 音楽・取り込み・タグ: services/music.md
      - タグ管理（MP3）: services/tags.md
      - 共通RSSタイムライン: services/rss.md
      - リポジトリの保管庫: services/forgejo.md
      - Home Assistantと家電の使い方: services/home-assistant.md
      - Android VMの画面を使う（RDP）: services/android.md
      - プリンター（Canon TS8430）: services/printer.md
      - クラウドの使い方: services/cloud.md
      - AIエージェントからクラウドを見る（MCP）: services/mcp.md
      - 開発VMの使い方: services/devvm.md
  - 開発に参加する:
      - 開発参加ガイド: onboarding.md
      - 開発の進め方: development/index.md
  - 運用・構築:
      - 運用手順の入口: operations/index.md
      - 配備台帳（実機の状態とTODO）: operations/handover.md
      - 確認と、はまりどころ: operations/verify.md
      - 立ち上げる:
          - 初回セットアップの順番: operations/bootstrap.md
          - Proxmox導入後の進め方: operations/bring-up.md
          - Terraformの実行: operations/terraform.md
          - NetBoxの使い方: operations/netbox.md
          - サービスの置き場所とクラウドVM: operations/services.md
          - Kubernetes クラスタ: operations/kubernetes.md
      - クラウドAPI:
          - クラウドAPIの運用: operations/cloud.md
          - shakecloud CLI: operations/cli.md
          - shakecloud MCPサーバ（読み取り専用）: operations/mcp.md
          - shakecloud Terraform Provider: operations/terraform-provider.md
          - Windows 11 ProのVMを作る: operations/windows.md
      - 自動化:
          - AWXの使い方: operations/awx.md
          - Playbook の一覧: operations/playbooks.md
          - Flux にアプリを足す: operations/flux-apps.md
      - ネットワーク:
          - Flint 3（家庭内ルーター）: operations/flint3.md
          - DNS と広告遮断（AdGuard Home）: operations/adguard.md
          - HTTPSの入口を1台にまとめる: operations/edge.md
          - ルータがつながらないときの調べ方: operations/router-troubleshooting.md
      - ストレージとバックアップ:
          - Garage（S3互換ストレージ）: operations/garage.md
          - 共有バルクストレージ（6TB HDD）: operations/bulk-storage.md
          - ディスク増設: operations/disk.md
          - バックアップ（重要VM・セーブ）: operations/backup.md
          - クライアント端末のバックアップ（Windows・Android）: operations/client-backup.md
      - 監視と電源:
          - 監視（tarakoserver）: operations/monitoring.md
          - 電源とUPS: operations/power.md
      - サービス:
          - Nextcloudと追加アプリ: operations/nextcloud.md
          - Nextcloud MCPサーバ: operations/nextcloud-mcp.md
          - AIの会話履歴（aihist）: operations/aihist.md
          - ポケモン系のPostgreSQL（pkdb）: operations/pkdb.md
          - 公開サイト（Shake-Web / pkhack / Alexa / ayahuya）: operations/web.md
          - メール設定: operations/smtp.md
          - android-01（Waydroid）の環境: operations/android-01.md
      - Bot:
          - Botポータル: operations/bot-portal.md
          - Discord Bot（UBSLEEPY）: operations/ubsleepy.md
          - UBSLEEPY 本番切替の手順: operations/ubsleepy-next-switch.md
          - サークル認証Bot（CIRCLEAUTH）: operations/circleauth.md
  - 設計:
      - ホームラボの全体像: architecture/overview.md
      - 設計と決定の入口: architecture/index.md
      - 決定ログ: architecture/decisions.md
      - 構成の移り変わり: architecture/history.md
      - 障害モードと単一障害点: architecture/failure-modes.md
      - IaCの所有境界: architecture/iac.md
      - 配置と命名の再編: architecture/placement-naming.md
      - 最小クラウドとProvider: architecture/cloud.md
      - ネットワーク・SSO: architecture/network-auth.md
      - VPNの比較と併用: architecture/vpn.md
      - ゲーム・開発VM: architecture/gaming.md
      - 配備・Git・復旧: architecture/operations.md
  - リファレンス:
      - リファレンスの入口: reference/index.md
      - 接続先一覧（URL）: reference/urls.md
      - ポケモンDBの取扱説明書: reference/pokemondb.md
      - 用語集: reference/glossary.md
  - 記録:
      - 記録の入口: audits/index.md
      - Web GUI監査・改善案: audits/webgui-2026-09-12.md

# Mermaidをオフラインで描画する（docs/assets/js/README.md参照）。
extra_javascript:
  - assets/js/mermaid.min.js
  - assets/js/mermaid-init.js
  - assets/js/service-map-data.js
  - assets/js/service-map.js
extra_css:
  - assets/css/service-map.css
# トップページのカードで、HTML の中に Markdown のリンクを書く（リンク切れを
# mkdocs が検査できるようにするため）。
markdown_extensions:
  - md_in_html
