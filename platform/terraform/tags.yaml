---
# NetBox のタグと Ansible グループの対応。**このファイルが正本**。
# 10-platform がタグを作り、hosts.yaml がタグを付け、
# platform/ansible/inventory.netbox.yml がグループへ写す。
# 整合は tests/test_platform_inventory.py が検証する。
#
# media-stack は名前とグループ（media）を変えない。既存のPlaybookが
# `hosts: media` を対象にしているため。
#
# クラウドAPIが作るVMへは、cloud.yaml の ledger.tags_by_name がここのタグを
# 名前で割り当てる（VM自身のタグでは決めない）。
tags:
  media-stack:
    ansible_group: media
    description: メディア系サービス（Nextcloud・Kavita・Navidrome など）
  monitoring:
    ansible_group: monitoring
    description: 監視（Prometheus・Alertmanager・Grafana）
  services:
    ansible_group: services
    description: 台帳・共有サービスの置き場（NetBox・Homarr・Vaultwarden など）
  managed-by-terraform-admin:
    ansible_group: terraform_managed
    description: 管理者Terraformが作ったもの
  managed-by-cloud-api:
    ansible_group: null
    description: 自作クラウドAPIが作ったもの（採番したアドレスと、台帳へ登録したVM）
  lab:
    ansible_group: lab
    description: 検証・復元ドリル用の使い捨て
  devbox:
    ansible_group: devbox
    description: 開発VM
  identity:
    # グループ名はホスト名 identity と重ねない。同名だと Ansible が
    # 「グループを自分自身へ足す」例外でインベントリ全体の読み込みに失敗する。
    ansible_group: identity_provider
    description: Authentikと専用DB。Kubernetes外
  cloud-control:
    ansible_group: cloud_control
    description: 自作クラウドAPIとその管理DB。Kubernetes外
  k8s-cp:
    ansible_group: k8s_cp
    description: Kubernetes control plane
  k8s-worker:
    ansible_group: k8s_worker
    description: Kubernetes worker
  edge:
    ansible_group: edge
    description: 公開入口のCaddy
  vpn:
    ansible_group: vpn
    description: セルフホストVPN
  storage:
    ansible_group: storage
    description: Garage
