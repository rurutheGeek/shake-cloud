---
# IPの配り方。**このファイルが正本**。
#
# site.yaml が「実機がどうなっているか」（bridge名・prefix・gateway）なのに対し、
# ここは「その中をどう切って配るか」という決めごと。実測できないので生成もしない。
#
# **採番はPrefix全体ではなくRangeから行う。** Prefix から採番すると、
# ゲートウェイやルータのDHCPが配る帯まで対象になる。
#
# 管理用とクラウド用の範囲は**重ねない**。重ねると管理者Terraformとクラウドが
# 同じアドレスを別々に配りうる。
# ネットワーク機器・常時稼働の小型機器（AP・プリンタ・Pi・Proxmox ホスト）。
# **DHCP プール（.20〜.99）と管理/クラウド帯の外**に置く。実際の固定は
# OpenWrt の dnsmasq 予約（platform/openwrt/rootfs/etc/shakecloud/config/dhcp）
# で行い、ここは帯の宣言（正本）。管理VMの採番元（management）とは別物。
infrastructure:
  range_start: 192.168.10.2/24
  range_end: 192.168.10.19/24

# OpenWrt の dnsmasq が配る範囲。**UCI 側（platform/openwrt の dhcp ファイル）と
# 一致していることを tests/test_router.py が検査する。** NetBox の台帳レンジも
# この値から作り、リースは tools/netbox-dhcp-sync.py が写す。
dhcp:
  range_start: 192.168.10.20/24
  range_end: 192.168.10.99/24

management:
  # 基盤VMの静的割り当て。既存: .200 services-01（05-seed が静的に持つ）、
  # .201 probe-01、.202 dev-a、.203 dev-b。
  # 末尾 .240-.249 は MetalLB 用に切り出してある（下の metallb）。
  range_start: 192.168.10.201/24
  range_end: 192.168.10.239/24

metallb:
  # Kubernetes の LoadBalancer に配る IP（L2 モード）。management の末尾から
  # 切り出す。**ルータの DHCP 配布範囲と重ならないこと。** NetBox の管理レンジは
  # ここを含まないので、Terraform が誤って静的割り当てしない。
  range_start: 192.168.10.240/24
  range_end: 192.168.10.249/24

cloud:
  # 利用者VMが載るネットワーク。
  #
  # **VLAN分離が済むまでは null。** いまは管理系と同じ物理LAN（site.yaml の
  # network.prefix）の別レンジを使うので、NetBox に別のPrefixは要らない。
  # 同じCIDRで2つ作ると台帳が重複する。
  # VLANを切ったら、ここへその VLAN のサブネットを書く。
  prefix: null
  # 利用者VM。クラウドAPIが実行時に available-ips で採番する。
  # Terraform は範囲を作るだけで、個々のアドレスは state に入らない。
  range_start: 192.168.10.100/24
  range_end: 192.168.10.180/24

# VLAN。**切替はここを埋めるだけで行う。**
#
# 前提: 物理スイッチ/ルータでトランクを用意し、Proxmox の bridge を VLAN 対応
# （`bridge-vlan-aware yes`。site.yaml の `network.bridge_vlan_aware` が true）に
# すること。10-platform は、ここに vlan_id を書いたのに bridge が未対応なら
# **plan を止める**（半端な状態で作らないため）。
#
# `vlan_id: null` の間は、そのネットワークはタグなし（今までどおり管理LAN）。
# 切替手順は docs/operations/vlan.md。
vlan:
  management:
    # 基盤VM（platform / lab / dev プール）と Proxmox 本体が載る VLAN。
    vlan_id: null
  cloud:
    # 利用者VM（cloud プール）が載る VLAN。APIが作るVMはこのタグで接続する。
    # 切替時は cloud.prefix と cloud.range_* もこのVLANのサブネットへ変える。
    vlan_id: null
