---
# LAN の中の名前。**このファイルが正本**。
#
# 20-dns が Cloudflare へ A レコードを書き、tls_proxy ロールが各ホストの Caddy に
# 「受ける名前と中継先」を渡す。
#
# **インターネットには公開しない。** 値は内部IPなので、外から名前を引けても届かない。
# ドメインを持つのは、Let's Encrypt の証明書を DNS-01 で取るため
# （docs/operations/handover.md の「ドメイン」の決定）。
#
#   host     : アドレスの出どころ。10-platform の hosts 出力（NetBox の採番）か、
#              05-seed が静的に持つ services-01。ここへアドレスを書き写さない
#   address  : 台帳に居ない機器（Proxmox 本体）だけ直接書く
#   upstream : そのホストの Caddy が中継する先。サービス自身のポートは 127.0.0.1 に
#              閉じる。省くと Caddy を置かない（Proxmox は自分で証明書を持つ）
#
# 整合は tests/test_tls_proxy.py が検査する。
zone: apextox.dpdns.org
cloudflare_zone_id: 112734e967c919ddd9ec1fa5c4f2a320

records:
  auth:
    host: identity
    upstream: 127.0.0.1:9000
    description: Authentik（共通ログイン）
  cloud:
    host: cloud-01
    upstream: 127.0.0.1:8080
    description: クラウドのポータルとAPI
  # media-01 はクラウドVMで hosts.yaml の台帳に居ないため address を直接書く。
  # host は tls_proxy が受ける名前を選ぶのに使う（inventory の cloud_name）。
  nextcloud:
    host: media-01
    address: 192.168.10.101
    upstream: 127.0.0.1:8080
    description: Nextcloud（ファイル・カレンダー・タスク）
  kavita:
    host: media-01
    address: 192.168.10.101
    upstream: 127.0.0.1:5000
    description: Kavita（電子書籍リーダー）
  navidrome:
    host: media-01
    address: 192.168.10.101
    upstream: 127.0.0.1:4533
    description: Navidrome（音楽ストリーミング。Forward Auth）
    auth: true
    # アルバム確認HTMLをダウンロードせず表示する（/review/、同じSSO）。
    static_prefix: /review
    static_data: /data/review
  # Subsonicクライアント（Ultrasonic等）用の入口。SSOを通さず、Navidromeの
  # 自前認証（ユーザー名とパスワード）を使う。Web UIは上の名前（SSO）のまま。
  navidrome-api:
    host: media-01
    address: 192.168.10.101
    upstream: 127.0.0.1:4533
    description: Navidrome Subsonic API（アプリ用・SSOなし）
  metube:
    host: media-01
    address: 192.168.10.101
    upstream: 127.0.0.1:8081
    description: MeTube（動画ダウンローダー。Forward Auth）
    auth: true
  khinsider:
    host: media-01
    address: 192.168.10.101
    upstream: 127.0.0.1:5820
    description: KHInsider（アルバム一括ダウンローダー。Forward Auth）
    auth: true
  freshrss:
    host: media-01
    address: 192.168.10.101
    upstream: 127.0.0.1:8082
    description: FreshRSS（共通RSSタイムライン。OIDC）
  netbox:
    host: services-01
    upstream: 127.0.0.1:8000
    description: NetBox
  homarr:
    host: services-01
    upstream: 127.0.0.1:7575
    description: Homarr（サービスの入口。OIDC）
  # AdGuard Home の管理画面はルータ上。ルータの :3000 はファイアウォールで
  # services-01 だけに開けてあり、Caddy はその LAN アドレスへ中継する。
  adguard:
    host: services-01
    upstream: 192.168.10.1:3000
    description: AdGuard Home（DNS・広告遮断。Forward Auth）
    auth: true
  # monitor-01 はクラウドVMで hosts.yaml の台帳に居ないため address を直接書く。
  grafana:
    host: monitor-01
    address: 192.168.10.102
    upstream: 127.0.0.1:3000
    description: Grafana（監視ポータル。OIDC）
  peanut:
    host: monitor-01
    address: 192.168.10.102
    upstream: 127.0.0.1:8080
    description: PeaNUT（UPSのREST。HomarrのUPSウィジェット用）
  vault:
    host: services-01
    upstream: 127.0.0.1:8222
    description: Vaultwarden（パスワード管理・SSO）
  ha:
    host: services-01
    upstream: 127.0.0.1:8123
    description: Home Assistant（家電・自動化）
  docs:
    host: services-01
    upstream: 127.0.0.1:8090
    description: ドキュメントサイト
  # LocalSend の受信機はアプリ自身のTLSをそのまま使う（Caddyを通さない）ため
  # upstream は持たず、名前だけ引けるようにする。
  localsend:
    host: media-01
    address: 192.168.10.101
    description: LocalSend受信機（media-01・53317）
  cups:
    host: services-01
    # loopback でつなぐと CUPS は Host を localhost に限定して 400 を返す
    # （valid_host）。631 は印刷クライアントへ意図的に開けた中継なので、
    # Caddy は LAN 側アドレスへつなぎ、実Hostをそのまま渡す。
    upstream: 192.168.10.200:631
    description: CUPS（印刷状況。Forward Auth）
    auth: true
    # CUPS の /admin は localhost 限定。Caddy 経由だと接続元が 127.0.0.1 に
    # 見えてしまうため、入口で弾いて LAN/VPN から開けないままにする。
    block: ['/admin', '/admin/*']
  pve:
    address: 192.168.10.10
    description: Proxmoxの管理画面（ポート8006）
  awx:
    address: 192.168.10.241
    description: AWX（Kubernetes の Cilium Ingress。TLS は cert-manager）
  "*.functions.k8s":
    address: 192.168.10.240
    description: Knative の関数 URL（Kourier の LoadBalancer）
