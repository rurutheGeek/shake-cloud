---
# Proxmox のプールと VMID の分割。**このファイルが正本**。
# 00-bootstrap がプールを作り、10-platform が範囲の検査に使い、
# tests/test_platform_inventory.py が hosts.yaml との整合を検証する。
# 設計の説明は docs/architecture/iac.md。
pools:
  platform:
    vmid_from: 100
    vmid_to: 399
    comment: 管理者Terraform。恒久基盤。VMID 100-399
  dev:
    vmid_from: 400
    vmid_to: 499
    comment: 開発VM。利用者は電源とコンソールのみ。VMID 400-499
  lab:
    vmid_from: 900
    vmid_to: 999
    comment: 検証・復元ドリル。使い捨て。VMID 900-999
  cloud:
    vmid_from: 5000
    vmid_to: 5999
    comment: 自作クラウドAPI用の予約枠。現時点では空。VMID 5000-5999

# 自動化ユーザー terraform@pve へ権限を与えるプール。
# cloud は**含めない**。将来の cloudapi@pve だけが /pool/cloud を触れる。
automation_pools:
  - platform
  - dev
  - lab

# 台帳の外に居るVM。Terraform は作らないし触らないが、**VMIDを取り合わない**
# ために記録する。tests/test_platform_inventory.py が hosts.yaml との衝突を
# 検査する。
reserved_vmids:
  - vm_id: 100
    name: game1
    reason: >-
      ゲームサーバの開発中VM。手で作られており Terraform 管理外。
      将来はクラウドAPIの管理下へ移し、ゲームサーバ開発者のアカウントへ
      紐づける。移すときは cloud プールへ入れる（ACLは /pool/cloud に
      付いているので、VMIDが5000番台でなくても届く）。
      docs/architecture/operations.md は VMID 100 を public-edge と
      計画しているので、**public-edge には別のVMIDを割り当てる**。
