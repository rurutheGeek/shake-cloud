---
# Proxmox のプールと VMID の分割。**このファイルが正本**。
# 00-bootstrap がプールを作り、10-platform が範囲の検査に使い、
# tests/test_platform_inventory.py が hosts.yaml との整合を検証する。
# 設計の説明は docs/architecture/iac.md。
pools:
  platform:
    vmid_from: 100
    vmid_to: 399
    comment: 管理者Terraform。恒久基盤。VMID 100-399
  dev:
    vmid_from: 400
    vmid_to: 499
    comment: 開発VM。利用者は電源とコンソールのみ。VMID 400-499
  lab:
    vmid_from: 900
    vmid_to: 999
    comment: 検証・復元ドリル。使い捨て。VMID 900-999
  cloud:
    vmid_from: 5000
    vmid_to: 5999
    comment: 自作クラウドAPI用の予約枠。現時点では空。VMID 5000-5999

# 自動化ユーザー terraform@pve へ権限を与えるプール。
# cloud は**含めない**。将来の cloudapi@pve だけが /pool/cloud を触れる。
automation_pools:
  - platform
  - dev
  - lab
