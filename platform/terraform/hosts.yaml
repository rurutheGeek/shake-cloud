---
# 宣言的なホスト定義。**このファイルが正本**。
#
# vm_id は pools.yaml の範囲に収める。範囲外なら plan の precondition と
# tests/test_platform_inventory.py の両方で落ちる。
#   platform 100-399 / dev 400-499 / lab 900-999 / cloud 5000-5999
#
# flavor はサイズの既定。cpu_cores / memory_mib / memory_min_mib を書くと
# その台だけ上書きできる。**手で広げた基盤VMを台帳が縮めに行かないため**の
# 逃げ道で、利用者向けの語彙（flavor）は歪めない。
#
# started はVMの作成時にだけ使う。作成後の電源状態はTerraformが追跡しない
# （lifecycle.ignore_changes）。利用者の devvm start/stop と衝突しないため。
hosts:
  probe-01:
    vm_id: 900
    pool: lab
    flavor: small
    disk_gib: 32
    on_boot: false
    started: true
    tags: [lab, managed-by-terraform-admin]
    description: 復元ドリル用の検証VM。使い捨て。

  dev-a:
    vm_id: 400
    pool: dev
    flavor: small
    # I01（2026-09-12）の実測に合わせる。実機は6GiBで、次回起動時に反映される。
    memory_mib: 6144
    memory_min_mib: 2048
    disk_gib: 40
    on_boot: false
    started: true
    tags: [devbox, managed-by-terraform-admin]
    description: 開発VM（利用者A）。利用時のみ起動する。

  dev-b:
    vm_id: 401
    pool: dev
    flavor: small
    # I01（2026-09-12）の実測に合わせる。実機は6GiB。
    memory_mib: 6144
    memory_min_mib: 2048
    disk_gib: 40
    on_boot: false
    started: true
    tags: [devbox, managed-by-terraform-admin]
    description: 開発VM（利用者B）。利用時のみ起動する。

  identity:
    vm_id: 110
    pool: platform
    flavor: medium
    disk_gib: 32
    on_boot: true
    started: true
    tags: [identity, managed-by-terraform-admin]
    description: Authentikと専用DB。SSOの土台なので常時起動。

  cloud-01:
    vm_id: 140
    pool: platform
    flavor: small
    disk_gib: 40
    on_boot: true
    started: true
    tags: [cloud-control, managed-by-terraform-admin]
    description: 自作クラウドAPIと管理DB。利用者VMを作る側なのでcloudプールには置かない。

  storage-s3:
    vm_id: 130
    pool: platform
    # 当初計画の 1GiB に合わせる。flavor は保険で付け、数値で上書きする。
    flavor: small
    cpu_cores: 2
    memory_mib: 1024
    memory_min_mib: 512
    disk_gib: 16
    # Garage のメタデータとオブジェクトは OS と別ディスクに置く。
    data_disk_gib: 32
    on_boot: true
    started: true
    tags: [storage, managed-by-terraform-admin]
    description: Garage（S3互換オブジェクトストア）。OS16+データ32。利用開始後は常時起動。

  k8s-cp-01:
    vm_id: 200
    pool: platform
    # 常時起動の control plane。実行時は etcd と API が載る。
    flavor: small
    # k8s ノードはバルーニングしない（kubelet が上限を能力としてスケジューラへ
    # 広告するので、後からホストが回収すると Pod が追い出される）。
    memory_mib: 3072
    memory_min_mib: 3072
    disk_gib: 32
    # 使わないときは tools/k8s で止める。電源断のあとは「切れる前に動いていた
    # 組」を戻す shakecloud-guests が起動するので、onboot では起こさない。
    on_boot: false
    started: true
    tags: [k8s-cp, managed-by-terraform-admin]
    description: Kubernetes control plane と etcd。使うときだけ起動。

  k8s-worker-01:
    vm_id: 210
    pool: platform
    # メディア・DB・AI API を載せる想定。データは別ディスクへ。
    flavor: large
    # バルーニング無効（memory と同じ床）。
    memory_mib: 8192
    memory_min_mib: 8192
    disk_gib: 32
    data_disk_gib: 64
    # control plane と同じ理由で onboot は付けない（shakecloud-guests が戻す）。
    on_boot: false
    started: true
    tags: [k8s-worker, managed-by-terraform-admin]
    description: Kubernetes worker。OS32+データ64。使うときだけ起動。

  k8s-worker-02:
    vm_id: 211
    pool: platform
    # RAM が足りないので止めたまま作る。使うときは人が起動する
    # （lifecycle が started を追わないので Terraform では変えない）。
    flavor: large
    memory_mib: 8192
    memory_min_mib: 8192
    disk_gib: 32
    data_disk_gib: 48
    on_boot: false
    started: false
    tags: [k8s-worker, managed-by-terraform-admin]
    description: Kubernetes worker。OS32+データ48。RAM 確保まで停止。
