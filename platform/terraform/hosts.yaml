---
# 宣言的なホスト定義。**このファイルが正本**。
#
# vm_id は pools.yaml の範囲に収める。範囲外なら plan の precondition と
# tests/test_platform_inventory.py の両方で落ちる。
#   platform 100-399 / dev 400-499 / lab 900-999 / cloud 5000-5999
#
# flavor はサイズの既定。cpu_cores / memory_mib / memory_min_mib を書くと
# その台だけ上書きできる。**手で広げた基盤VMを台帳が縮めに行かないため**の
# 逃げ道で、利用者向けの語彙（flavor）は歪めない。
#
# started はVMの作成時にだけ使う。作成後の電源状態はTerraformが追跡しない
# （lifecycle.ignore_changes）。利用者の devvm start/stop と衝突しないため。
hosts:
  probe-01:
    vm_id: 900
    pool: lab
    flavor: small
    disk_gib: 32
    on_boot: false
    started: true
    tags: [lab, managed-by-terraform-admin]
    description: 復元ドリル用の検証VM。使い捨て。

  cloud-01:
    vm_id: 140
    pool: platform
    flavor: small
    # 常時起動のAPIと管理DB。2026-10-11: 14日間の実使用は最大約0.67GiBなので
    # 上限を 2GiB → 1GiB へ下げた。下限と同じ値＝固定割り当て（バルーニング無効）。
    memory_mib: 1024
    memory_min_mib: 1024
    disk_gib: 40
    # Garage（S3 の実体）もここに置く（2026-10-03。storage-s3 から合流）。
    # メタデータとオブジェクトは OS と別ディスクに置く。
    data_disk_gib: 32
    on_boot: true
    started: true
    tags: [cloud-control, storage, managed-by-terraform-admin]
    description: 自作クラウドAPIと管理DB。利用者VMを作る側なのでcloudプールには置かない。

  k8s-cp-01:
    vm_id: 200
    pool: platform
    # 1台構成（2026-10-22）。control plane・etcd に加え、AWX・database・function も
    # ここに載せる（taint を外す。k8s_control_plane の k8s_schedule_on_control_plane）。
    # 内訳の目安: k8s と Cilium 等 約1.5GiB、AWX 約2.5GiB、database・function の上限 1GiB。
    flavor: large
    # k8s ノードはバルーニングしない（kubelet が上限を能力としてスケジューラへ
    # 広告するので、後からホストが回収すると Pod が追い出される）。
    memory_mib: 6144
    memory_min_mib: 6144
    disk_gib: 32
    # local-path（AWX の DB・database の PVC）の置き場。
    data_disk_gib: 64
    # 電源断のあとは「切れる前に動いていた組」を戻す shakecloud-guests が起動する
    # ので、onboot では起こさない。
    on_boot: false
    started: true
    tags: [k8s-cp, managed-by-terraform-admin]
    description: Kubernetes の1台構成（control plane・etcd・AWX・database・function）。

  k8s-worker-01:
    vm_id: 210
    pool: platform
    # メディア・DB・AI API を載せる想定。データは別ディスクへ。
    flavor: large
    # バルーニング無効（memory と同じ床）。
    memory_mib: 8192
    memory_min_mib: 8192
    disk_gib: 32
    data_disk_gib: 64
    # control plane と同じ理由で onboot は付けない（shakecloud-guests が戻す）。
    on_boot: false
    # 1台構成にしたので止めておく予備（2026-10-22）。tools/k8s up --all で起動して join。
    started: false
    tags: [k8s-worker, managed-by-terraform-admin]
    description: Kubernetes worker（予備）。OS32+データ64。1台構成のため停止。

  k8s-worker-02:
    vm_id: 211
    pool: platform
    # RAM が足りないので止めたまま作る。使うときは人が起動する
    # （lifecycle が started を追わないので Terraform では変えない）。
    flavor: large
    memory_mib: 8192
    memory_min_mib: 8192
    disk_gib: 32
    data_disk_gib: 48
    on_boot: false
    started: false
    tags: [k8s-worker, managed-by-terraform-admin]
    description: Kubernetes worker。OS32+データ48。RAM 確保まで停止。
