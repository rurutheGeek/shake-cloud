---
# router-01 の DNS 窓口。**このファイルが正本**（Image Builder が焼く）。
#
# 役割: LAN 端末からの DNS を受け、広告・トラッカーを遮断し、上流は DoH で
# 暗号化する。ローカル名（*.lan）だけ dnsmasq（127.0.0.1:5353）へ転送する。
# DHCP は dnsmasq が担当する（AdGuard の DHCP は使わない）。
#
# **1語の名前（aterm など）はここを通らない。** AdGuard は末尾一致でしか
# 転送できないため、ローカル名は `aterm.lan` のように `.lan` を付けて引く。
# 設計と検証は docs/operations/router-config.md。
schema_version: 29
http:
  # 管理画面はルータの LAN アドレス。**ファイアウォールで core-01（HTTPS
  # 入口の Caddy）だけに開けてある**（LAN 全体には開けない。SSO を迂回される
  # ため）。入口は https://adguard.apextox.dpdns.org（Forward Auth）。
  # SSH トンネルでも開ける: ssh -L 3000:192.168.10.1:3000 root@192.168.10.1
  address: 192.168.10.1:3000
  session_ttl: 720h
# 管理者は初回に UI で作る（localhost のみなので露出しない）。
users: []
auth_attempts: 5
block_auth_min: 15
dns:
  bind_hosts:
    - 0.0.0.0
    - '::'
  port: 53
  # *.lan は dnsmasq（DHCP のリース名・固定名）へ。それ以外は DoH へ。
  upstream_dns:
    - '[/lan/]127.0.0.1:5353'
    - https://dns.cloudflare.com/dns-query
    - https://dns.google/dns-query
  # DoH サーバーの名前解決用。システムの DNS に依存しない。
  bootstrap_dns:
    - 1.1.1.1
    - 9.9.9.10
  # LAN の逆引き（PTR）も dnsmasq へ。
  local_ptr_upstreams:
    - 127.0.0.1:5353
  use_private_ptr_resolvers: true
  cache_size: 4194304
filters:
  # AdGuard DNS filter（広告・トラッカー）
  - enabled: true
    url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt
    name: AdGuard DNS filter
    id: 1
  # HaGeZi's Pro Blocklist（AdGuard DNS filter の補完。広告・トラッカー・
  # 計測・テレメトリ）。id は HostlistsRegistry のフィルタ番号に合わせる。
  - enabled: true
    url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_48.txt
    name: HaGeZi's Pro Blocklist
    id: 48
# Xbox Live の実績（Minecraft・Minecraft Dungeons など）は Microsoft の
# テレメトリ系ドメインを実績の記録・同期に使うため、フィルタで遮断されると
# 実績が解除されない（2026-10-02 に HaGeZi's Pro が該当を遮断していたのを
# 実測・除外）。フィルタ更新で再遮断されても効くよう、ここで明示的に許可する。
# 出典: https://github.com/hagezi/dns-blocklists/blob/main/share/microsoft.txt
user_rules:
  - '@@||v10.events.data.microsoft.com^'
  - '@@||v20.events.data.microsoft.com^'
  - '@@||win-global-asimov-leafs-events-data.trafficmanager.net^'
  - '@@||vortex.data.microsoft.com^'
  - '@@||vortex-win.data.microsoft.com^'
  - '@@||pipe.aria.microsoft.com^'
  # HaGeZi の Microsoft 一覧の残り（地域版・Defender・診断）。Windows/Xbox の
  # 実績・Game Pass が地域エンドポイントを使う場合に備えて許可する。
  - '@@||v10c.events.data.microsoft.com^'
  - '@@||au-v10.events.data.microsoft.com^'
  - '@@||eu-v10.events.data.microsoft.com^'
  - '@@||jp-v10.events.data.microsoft.com^'
  - '@@||us-v10.events.data.microsoft.com^'
  - '@@||au-v20.events.data.microsoft.com^'
  - '@@||eu-v20.events.data.microsoft.com^'
  - '@@||in-v20.events.data.microsoft.com^'
  - '@@||jp-v20.events.data.microsoft.com^'
  - '@@||uk-v20.events.data.microsoft.com^'
  - '@@||us-v20.events.data.microsoft.com^'
  - '@@||us4-v20.events.data.microsoft.com^'
  - '@@||us5-v20.events.data.microsoft.com^'
  - '@@||watson.events.data.microsoft.com^'
  - '@@||watson.telemetry.microsoft.com^'
querylog:
  # **ファイルへ書かない。** ルータの rootfs は 512MiB で、querylog.json が
  # 413MB まで育って 2026-10-01 にディスクを埋め、ログの書き込みと stats.db の
  # 更新が止まった。UI の直近ログはメモリ（size_memory）に残り、集計は
  # stats.db が持つ。
  enabled: true
  file_enabled: false
  interval: 2160h
statistics:
  enabled: true
  interval: 2160h
