# function（Knative）に渡すメモリの上限。database と合わせて 1GiB
# （databases/limits.yaml）。クラウドAPI はイメージしか指定しないので、
# 関数のコンテナと Knative の queue-proxy にはここの既定が付く。
# 呼ばれていない関数は 0 台まで縮むので、合計は同時に動いている分だけ数える。
apiVersion: v1
kind: LimitRange
metadata:
  name: memory
  namespace: functions
spec:
  limits:
    - type: Container
      # 1つの Pod は関数と queue-proxy の2コンテナなので、この倍を使う。
      # 128Mi では Pod が 256Mi になり、0台からの起動が止まりかけの Pod と
      # 重なると枠を超えて作れなかった（2026-10-22）。
      default:
        memory: 96Mi
      defaultRequest:
        memory: 32Mi
      max:
        memory: 256Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: memory
  namespace: functions
spec:
  hard:
    limits.memory: 384Mi
    requests.memory: 384Mi
