# Knative Serving 本体。Operator が CRD を入れた後に適用する。
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: knative-serving
  namespace: flux-system
spec:
  interval: 30m
  path: ./platform/flux/apps/knative-serving
  targetNamespace: knative-serving
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: knative-operator
