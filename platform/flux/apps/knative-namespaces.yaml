# Knative が使う名前空間。Kustomization の targetNamespace は名前空間を作らないので、
# ルートから先に作る。
apiVersion: v1
kind: Namespace
metadata:
  name: knative-operator
---
apiVersion: v1
kind: Namespace
metadata:
  name: knative-serving
---
# Operator は Serving 用の ClusterRole/ClusterRoleBinding を作るので、自分が
# 持っていない権限を委譲できず失敗する。release の集約ロール相当として
# cluster-admin を束ねる（Operator はクラスタ全体を管理する前提の部品）。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: knative-operator-cluster-admin
subjects:
  - kind: ServiceAccount
    name: knative-operator
    namespace: knative-operator
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
