# Knative Serving。ネットワークは Kourier（MetalLB が IP を配る）。
# 関数の URL は <name>.<namespace>.k8s.apextox.dpdns.org になる。
apiVersion: operator.knative.dev/v1beta1
kind: KnativeServing
metadata:
  name: knative-serving
  namespace: knative-serving
spec:
  version: "1.23.0"
  ingress:
    kourier:
      enabled: true
  config:
    network:
      # 完全名で指定する。net-kourier の controller はこの値で Ingress を
      # フィルタするので、短縮名 "kourier" だと一致せず無視される。
      ingress-class: kourier.ingress.networking.knative.dev
    kourier:
      # ゲートウェイは knative-serving に置かれる（kourier-system ではない）。
      namespace: knative-serving
      service: kourier
    domain:
      "k8s.apextox.dpdns.org": ""
