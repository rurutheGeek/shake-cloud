apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-dns
spec:
  acme:
    # Let's Encrypt が期限通知を送る先。運用用の連絡先に変えてよい。
    email: admin@apextox.dpdns.org
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-dns-account
    solvers:
      # DNS-01。既存の Caddy（tls_proxy）と同じ Cloudflare のトークンを使う。
      # 公開 IP が無くても、ワイルドカードでも取れる。
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
