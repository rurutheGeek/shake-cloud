# 固定IPは持たないが、名前だけ付けたい DHCP クライアント（いまは空）。
# 固定IPを持たせる場合は上の devices に書く（reserved として dnsmasq へ入る）。
clients: []

# 接続図（NetBox の Cables）。両端は上の devices で宣言した口。
# ラベルは端点から自動で作る。ケーブルを差し替えたらここを直して `ensure`。
cables:
  - a: {device: onu-1, interface: lan}
    b: {device: apextox, interface: nic0}
    type: cat6a
    description: ONU → Proxmox ホスト nic0（WAN）

  - a: {device: apextox, interface: nic1}
    b: {device: tl-sg605, interface: port1}
    type: cat6a
    description: Proxmox ホスト nic1 → スイッチ（LAN 幹線）

  - a: {device: tl-sg605, interface: port2}
    b: {device: aterm, interface: wan}
    type: cat6a
    description: スイッチ → Aterm WAN（AP モード）

  - a: {device: tl-sg605, interface: port3}
    b: {device: ouchithegeek, interface: eth0}
    type: cat6a
    description: スイッチ → デスクトップ（有線）

  - a: {device: tl-sg605, interface: port4}
    b: {device: shakeserver, interface: eth0}
    type: cat6a
    description: スイッチ → Raspberry Pi 5

  - a: {device: aterm, interface: lan}
    b: {device: tarakoserver, interface: eth0}
    type: cat6a
    description: Aterm LAN → Raspberry Pi 4

# 電源系統（UPS1 のバッテリー口。UPS2 は予備）。
  - a: {device: ups-1, power_outlet: battery1}
    b: {device: apextox, power_port: ac}
    type: power
    description: UPS1 バッテリー1 → ミニPC（K11）

  - a: {device: ups-1, power_outlet: battery2}
    b: {device: onu-1, power_port: ac}
    type: power
    description: UPS1 バッテリー2 → ONU

  - a: {device: ups-1, power_outlet: battery3}
    b: {device: aterm, power_port: ac}
    type: power
    description: UPS1 バッテリー3 → Aterm（AP モード）

  - a: {device: ups-1, power_outlet: battery4}
    b: {device: ouchithegeek, power_port: ac}
    type: power
    description: UPS1 バッテリー4 → デスクトップ

  - a: {device: ups-1, power_outlet: battery5}
    b: {device: shakeserver, power_port: ac}
    type: power
    description: UPS1 バッテリー5 → Raspberry Pi 5
