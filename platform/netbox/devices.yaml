    interface: {name: wlan0, type: ieee802.11ac, mac: 'a8:48:fa:ca:2a:09'}
    address: 192.168.10.99/24
    dns_name: switchbot-hubmini-ca2a09

# 固定IPは持たないが、名前だけ付けたい DHCP クライアント（いまは空）。
# 固定IPを持たせる場合は上の devices に書く（reserved として dnsmasq へ入る）。
clients: []
