---
awx_organization: Default
awx_project_name: Portable services
awx_scm_url: https://github.com/YOUR_ORG/media-stack.git
awx_scm_branch: main
# Build and push this image, then use its digest.
awx_ee_image: ghcr.io/YOUR_ORG/media-stack-ee:1
# Create this Machine credential in AWX with SSH key and become settings.
awx_machine_credential: Media hosts SSH
# Optional AWX Source Control credential for a private Git repository.
awx_scm_credential: ''
# Set true only after the cloud inventory declaration and read-only key are
# reviewed. The configure playbook then registers a separate media-01 job;
# it never starts that job.
awx_enable_cloud_inventory: true
awx_cloud_inventory_name: Cloud service hosts
awx_media_job_name: Deploy media-01
