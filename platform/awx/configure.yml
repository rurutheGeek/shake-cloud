---
- name: Configure new AWX controller
  hosts: localhost
  connection: local
  gather_facts: false
  # Connection: CONTROLLER_HOST, CONTROLLER_OAUTH_TOKEN, CONTROLLER_VERIFY_SSL.
  tasks:
    - name: Require caller-provided NetBox connection
      ansible.builtin.assert:
        that:
          - lookup('env', 'NETBOX_API') | length > 0
          - lookup('env', 'NETBOX_TOKEN') | length > 0
      no_log: true
    - name: Register execution environment
      awx.awx.execution_environment:
        name: Media stack EE
        image: '{{ awx_ee_image }}'
        pull: missing
    - name: Register Git project
      awx.awx.project:
        name: '{{ awx_project_name }}'
        organization: '{{ awx_organization }}'
        scm_type: git
        scm_url: '{{ awx_scm_url }}'
        scm_branch: '{{ awx_scm_branch }}'
        credential: '{{ awx_scm_credential | default(omit, true) }}'
        scm_update_on_launch: true
        default_environment: Media stack EE
        wait: true
    - name: Create NetBox credential type
      awx.awx.credential_type:
        name: NetBox inventory API
        kind: cloud
        inputs:
          fields:
            - {id: netbox_api, type: string, label: NetBox URL}
            - {id: netbox_token, type: string, label: API token, secret: true}
          required: [netbox_api, netbox_token]
        injectors:
          env:
            NETBOX_API: "{{ '{{ netbox_api }}' }}"
            NETBOX_TOKEN: "{{ '{{ netbox_token }}' }}"
    - name: Store NetBox read credential
      awx.awx.credential:
        name: NetBox read only
        organization: '{{ awx_organization }}'
        credential_type: NetBox inventory API
        inputs:
          netbox_api: "{{ lookup('env', 'NETBOX_API') }}"
          netbox_token: "{{ lookup('env', 'NETBOX_TOKEN') }}"
      no_log: true
    - name: Create inventory
      awx.awx.inventory:
        name: Media hosts from NetBox
        organization: '{{ awx_organization }}'
    - name: Add SCM inventory source
      awx.awx.inventory_source:
        name: NetBox media-stack
        inventory: Media hosts from NetBox
        source: scm
        source_project: '{{ awx_project_name }}'
        source_path: ansible/inventory.netbox.yml
        credential: NetBox read only
        execution_environment: Media stack EE
        overwrite: true
        overwrite_vars: true
        update_on_launch: true
        update_cache_timeout: 0
    - name: Synchronize NetBox inventory
      awx.awx.inventory_source_update:
        name: NetBox media-stack
        inventory: Media hosts from NetBox
        wait: true
    - name: Register deployment job
      awx.awx.job_template:
        name: Deploy portable services
        organization: '{{ awx_organization }}'
        inventory: Media hosts from NetBox
        project: '{{ awx_project_name }}'
        playbook: ansible/deploy.yml
        execution_environment: Media stack EE
        credentials: ['{{ awx_machine_credential }}']
        become_enabled: true
        ask_limit_on_launch: true
        ask_variables_on_launch: true
        allow_simultaneous: false

    # The cloud inventory is deliberately opt-in.  Existing controllers can
    # continue to use the NetBox project until the read-only cloud credential
    # and the explicit instance declaration have been reviewed.
    - name: Require cloud inventory credentials when enabled
      ansible.builtin.assert:
        that:
          - lookup('env', 'SHAKECLOUD_ACCESS_KEY') | length > 0
          - lookup('env', 'SHAKECLOUD_ENDPOINT') | length > 0
      no_log: true
      when: awx_enable_cloud_inventory | default(false) | bool

    - name: Register shake-cloud inventory credential type
      awx.awx.credential_type:
        name: Shake-cloud inventory API
        kind: cloud
        inputs:
          fields:
            - {id: endpoint, type: string, label: API endpoint}
            - {id: access_key, type: string, label: Access key, secret: true}
          required: [endpoint, access_key]
        injectors:
          env:
            SHAKECLOUD_ENDPOINT: "{{ '{{ endpoint }}' }}"
            SHAKECLOUD_ACCESS_KEY: "{{ '{{ access_key }}' }}"
      when: awx_enable_cloud_inventory | default(false) | bool

    - name: Store shake-cloud inventory credential
      awx.awx.credential:
        name: Shake-cloud inventory read
        organization: '{{ awx_organization }}'
        credential_type: Shake-cloud inventory API
        inputs:
          endpoint: "{{ lookup('env', 'SHAKECLOUD_ENDPOINT') }}"
          access_key: "{{ lookup('env', 'SHAKECLOUD_ACCESS_KEY') }}"
      no_log: true
      when: awx_enable_cloud_inventory | default(false) | bool

    - name: Create cloud service inventory
      awx.awx.inventory:
        name: '{{ awx_cloud_inventory_name | default("Cloud service hosts") }}'
        organization: '{{ awx_organization }}'
      when: awx_enable_cloud_inventory | default(false) | bool

    - name: Add the read-only cloud inventory source
      awx.awx.inventory_source:
        name: Cloud service instances
        inventory: '{{ awx_cloud_inventory_name | default("Cloud service hosts") }}'
        source: scm
        source_project: '{{ awx_project_name }}'
        source_path: ansible/inventory.cloud.py
        credential: Shake-cloud inventory read
        execution_environment: Media stack EE
        overwrite: true
        overwrite_vars: true
        update_on_launch: true
        update_cache_timeout: 0
      when: awx_enable_cloud_inventory | default(false) | bool

    - name: Synchronize cloud service inventory
      awx.awx.inventory_source_update:
        name: Cloud service instances
        inventory: '{{ awx_cloud_inventory_name | default("Cloud service hosts") }}'
        wait: true
      when: awx_enable_cloud_inventory | default(false) | bool

    - name: Register the isolated media deployment job
      awx.awx.job_template:
        name: '{{ awx_media_job_name | default("Deploy media-01") }}'
        organization: '{{ awx_organization }}'
        inventory: '{{ awx_cloud_inventory_name | default("Cloud service hosts") }}'
        project: '{{ awx_project_name }}'
        playbook: ansible/media.yml
        execution_environment: Media stack EE
        credentials: ['{{ awx_machine_credential }}']
        become_enabled: true
        ask_limit_on_launch: true
        ask_variables_on_launch: true
        allow_simultaneous: false
      when: awx_enable_cloud_inventory | default(false) | bool
