---
# Kavita のネイティブ OIDC を identity VM の Authentik に合わせる。
#
#   ansible-playbook -i platform/ansible/inventory.cloud.py platform/ansible/media-kavita-sso.yml
#
# 実行には media-01 と identity の両方が解決できる inventory が要る。
# NetBox のインベントリ（inventory.netbox.yml）と併用するときは、media グループに
# 基盤ホストが混ざり得るため --limit で media-01 を明示する。
#
#   ansible-playbook -i platform/ansible/inventory.netbox.yml \
#     -i platform/ansible/inventory.cloud.py --limit media-01 \
#     platform/ansible/media-kavita-sso.yml
#
# 前提: 先に media-kavita.yml を実行し、Kavita が起動して bootstrap.py が
# 管理者（secrets/accounts.json）と Books ライブラリを作っていること。
# client id/secret は identity VM の secrets/oidc-media.json から読み、
# 標準出力・ログには出さない。
- name: Configure Kavita native OIDC
  hosts: media
  become: true
  vars:
    source_dir: '{{ playbook_dir }}/../../stacks'
  tasks:
    - name: Require the Kavita deployment to exist
      ansible.builtin.stat:
        path: '{{ project_dir }}/media/kavita/{{ item }}'
      loop: [.env, secrets/accounts.json]
      register: media_sso_kavita_files
    - name: Stop when the unit has not been deployed and bootstrapped
      ansible.builtin.assert:
        that: media_sso_kavita_files.results | map(attribute='stat.exists') | select | list | length == 2
        fail_msg: >-
          {{ project_dir }}/media/kavita に .env か secrets/accounts.json がない。
          media-kavita.yml を先に実行する。
        quiet: true

    - name: Read the media OIDC client credentials on the identity VM
      ansible.builtin.slurp:
        src: /opt/identity-stack/secrets/oidc-media.json
      delegate_to: '{{ media_sso_identity_host | default("identity") }}'
      register: media_sso_oidc
      no_log: true
    - name: Check the Kavita client credentials
      ansible.builtin.assert:
        that:
          - (media_sso_oidc.content | b64decode | from_json).kavita.client_id | length > 0
          - (media_sso_oidc.content | b64decode | from_json).kavita.client_secret | length > 0
        fail_msg: >-
          identity VM の /opt/identity-stack/secrets/oidc-media.json に
          kavita の client_id / client_secret がない。identity 側を先に配備する。
        quiet: true
      no_log: true

    - name: Copy the Kavita OIDC configuration script
      ansible.builtin.copy:
        src: '{{ source_dir }}/media/kavita/configure-oidc.py'
        dest: '{{ project_dir }}/media/kavita/configure-oidc.py'
        mode: '0644'

    - name: Configure the Kavita OIDC client
      ansible.builtin.command:
        argv: [python3, '{{ project_dir }}/media/kavita/configure-oidc.py']
        chdir: '{{ project_dir }}/media/kavita'
      environment:
        KAVITA_OIDC_CLIENT_ID: '{{ (media_sso_oidc.content | b64decode | from_json).kavita.client_id }}'
        KAVITA_OIDC_CLIENT_SECRET: '{{ (media_sso_oidc.content | b64decode | from_json).kavita.client_secret }}'
      register: media_sso_kavita_oidc
      changed_when: "'CHANGED:' in media_sso_kavita_oidc.stdout"
      no_log: true
