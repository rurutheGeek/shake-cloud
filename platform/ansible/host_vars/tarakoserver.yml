---
# Pi 4。タッチパネルに監視を表示するので、画面は残す（キオスクは別に入れる）。
pi_base_headless: false
# NetBox のインベントリでは機器の名前で入る。鍵は Raspberry Pi 用。
# AWX では資格情報が鍵を渡すので、ここでパスを固定しない（固定すると AWX の
# /runner/.ssh/... を指して届かなくなる）。手元から流すときは
# ANSIBLE_PRIVATE_KEY_FILE=~/.ssh/id_ed25519_shake を付ける（playbook の先頭の例）。
ansible_user: ansible_admin
# 起動は USB メモリ／SD カード。書き込みの多いものは HDD（LABEL=tarako-data、/srv）へ置く。
docker_data_root: /srv/docker
pi_base_data_label: tarako-data
# ログはメモリの上だけ。残したいものは Alloy が Loki（HDD）へ送る。
pi_base_journal_storage: volatile
# HDD（WD Blue 1TB）の UGREEN のケース。表に無く、SMART が読めなかった（2026-10-15）。
pi_base_smart_usb_bridges:
  - {usb: '0x0bda:0x9201', name: 'UGREEN; Realtek RTL9201', type: sat}
