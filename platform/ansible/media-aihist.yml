---
# media-01 の aihist（systemd）を片付ける。本体はクラウドの service
# （platform/terraform/services/aihist）へ移した。
#
# 会話の原本（/srv/media-bulk/aihist）は消さない。service のディスクの
# バックアップができるまで、移した時点の写しとして残す。
#   tools/awx-run media-aihist.yml --run
- name: Retire aihist on media-01
  hosts: media
  become: true
  tasks:
    - name: Stop and disable aihist
      ansible.builtin.systemd:
        name: aihist
        state: stopped
        enabled: false
      failed_when: false
    - name: Remove the aihist unit
      ansible.builtin.file:
        path: /etc/systemd/system/aihist.service
        state: absent
      register: aihist_unit
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
      when: aihist_unit.changed
    # 実行ファイルと、トークンを書いた環境ファイル。
    - name: Remove the aihist program
      ansible.builtin.file:
        path: /opt/aihist
        state: absent
