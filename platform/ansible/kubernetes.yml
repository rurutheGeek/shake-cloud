---
# Kubernetes クラスタを用意する。
#   1. ノード準備（swap・カーネル・containerd・kubeadm）
#   2. control plane で kubeadm init と Cilium 導入
#   3. worker を join
#
# 停止中の worker（k8s-worker-02）は到達できないので --limit で外す:
#   ... kubernetes.yml --limit k8s-cp-01,k8s-worker-01
# 起動後にそのホストだけ流し直す:
#   ... kubernetes.yml --limit k8s-worker-02
- name: Prepare the Kubernetes nodes
  hosts: k8s_cp:k8s_worker
  become: true
  vars_files: [k8s-vars.yml]
  roles:
    - common
    - k8s_node

- name: Create the cluster on the control plane
  hosts: k8s_cp
  become: true
  vars_files: [k8s-vars.yml]
  roles:
    - k8s_control_plane

- name: Join the workers
  hosts: k8s_worker
  become: true
  vars_files: [k8s-vars.yml]
  roles:
    - k8s_join
