---
# Proxmox VE ホストの棚卸し。読み取りだけを行い、ホストへ一切書き込まない。
# 出力は管理端末のローカルファイルへ保存し、Git へは入れない。
#
#   cp platform/ansible/pve.ini.example platform/ansible/pve.ini
#   ansible-playbook -i platform/ansible/pve.ini platform/ansible/survey-pve.yml
#
# 収集結果には LAN 構成・識別情報が含まれるため、非公開の作業台帳へ転記する。
# ここで確定した値がないと Terraform のストレージ名・bridge 名・IP 枠を書けない。
- name: Collect a read-only baseline from the Proxmox VE host
  hosts: pve
  become: true
  gather_facts: true
  vars:
    survey_dir: '{{ playbook_dir }}/../../.survey'
    survey_commands:
      - key: pveversion
        title: Proxmox VE と関連パッケージの版
        cmd: pveversion -v
      - key: memory
        title: メモリ
        cmd: free -h
      - key: block_devices
        title: ブロックデバイス
        cmd: lsblk -o NAME,SIZE,TYPE,FSTYPE,MOUNTPOINTS
      - key: storage_status
        title: ストレージの使用状況
        cmd: pvesm status
      - key: storage_json
        title: ストレージ定義（content 種別を含む）
        cmd: pvesh get /storage --output-format json
      - key: nodes_json
        title: ノード一覧
        cmd: pvesh get /nodes --output-format json
      - key: vm_resources_json
        title: 既存のVM/LXCとVMID
        cmd: pvesh get /cluster/resources --type vm --output-format json
      - key: addresses
        title: IPアドレスとリンク状態
        cmd: ip -br address
      - key: routes
        title: 経路表
        cmd: ip route
      - key: interfaces_file
        title: ネットワーク定義（bridge名・vlan-aware）
        cmd: cat /etc/network/interfaces
      - key: resolv_conf
        title: 名前解決
        cmd: cat /etc/resolv.conf
      - key: time_sync
        title: 時刻同期
        cmd: timedatectl status
      - key: kernel_cmdline
        title: カーネル引数（IOMMU設定の確認）
        cmd: cat /proc/cmdline
      - key: iommu_groups
        title: IOMMUグループ
        cmd: find /sys/kernel/iommu_groups/ -type l
      - key: pci_devices
        title: PCIデバイスとカーネルドライバ
        cmd: lspci -nnk
  pre_tasks:
    - name: Look for the Proxmox VE configuration filesystem
      ansible.builtin.stat:
        path: /etc/pve
      register: pve_marker
      check_mode: false
    - name: Fail when the target is not Proxmox VE
      ansible.builtin.assert:
        that: pve_marker.stat.isdir | default(false)
        fail_msg: /etc/pve is missing; this playbook only surveys Proxmox VE hosts.
  tasks:
    - name: Read host, storage, network and hardware state
      ansible.builtin.command: '{{ item.cmd }}'
      loop: '{{ survey_commands }}'
      loop_control:
        label: '{{ item.key }}'
      register: survey
      changed_when: false
      failed_when: false
      check_mode: false
      no_log: true
    - name: Create the local survey directory
      ansible.builtin.file:
        path: '{{ survey_dir }}'
        state: directory
        mode: '0700'
      become: false
      delegate_to: localhost
    - name: Write the baseline report to the control machine
      ansible.builtin.template:
        src: pve-survey.md.j2
        dest: '{{ survey_dir }}/{{ inventory_hostname }}.md'
        mode: '0600'
      become: false
      delegate_to: localhost
    - name: Report where the baseline was written
      ansible.builtin.debug:
        msg: >-
          Wrote {{ survey_dir }}/{{ inventory_hostname }}.md on the control machine.
          Copy the values into the private ledger. Do not commit this file.
