---
# media-01（クラウドVM）の配備入口。ユニットごとに独立した playbook を
# Nextcloud → Kavita → Navidrome → music-tools の順で実行し、最後に
# media-verify.yml で running/healthy と HTTP 応答を確認してから、
# media-tls.yml で HTTPS の入口を張る。
#
#   sops exec-env platform/sops/netbox-inventory.sops.yaml \
#     '.venv/bin/ansible-playbook -i platform/ansible/inventory.netbox.yml platform/ansible/media.yml'
#
# 段階実行: import_playbook は when を持てないため、このファイルから特定の
# ユニットだけを選んで実行することはできない。`--start-at-task` で途中から
# 再開するのでもなく、配備したいユニットの playbook を直接実行する。
#   ansible-playbook -i <inventory> platform/ansible/media-nextcloud.yml
#   ansible-playbook -i <inventory> platform/ansible/media-kavita.yml
#   ansible-playbook -i <inventory> platform/ansible/media-navidrome.yml
#   ansible-playbook -i <inventory> platform/ansible/media-freshrss.yml
#   ansible-playbook -i <inventory> platform/ansible/music-tools.yml
#   ansible-playbook -i <inventory> platform/ansible/media-urbackup.yml
# 確認は media-verify.yml の media_units で対象を絞る。`key=["a"]` 形式は
# Ansible が文字列として扱うため、リストは JSON で渡す:
#   ansible-playbook -i <inventory> platform/ansible/media-verify.yml \
#     -e '{"media_units": ["kavita"]}'
# music-tools の一部だけを配備する場合は playbook 自身の変数を使い、
# 確認側も同じ変数を JSON で渡す:
#   ansible-playbook -i <inventory> platform/ansible/music-tools.yml \
#     -e '{"music_tools_services": ["picard"]}'
#   ansible-playbook -i <inventory> platform/ansible/media-verify.yml \
#     -e '{"music_tools_services": ["picard"]}'
#
# 配備先は NetBox の動的インベントリ（inventory.netbox.yml）の `media` グループ
# （media-stack タグ。実体は media-01 だけ）。ホスト名はインスタンスID（i-...）
# なので、対象を絞るときは `--limit media` のようにグループ名を使う。
#
# RomM（W07）は game1 側のユニットなので、ここには含めない。
- import_playbook: media-base.yml
- import_playbook: media-nextcloud.yml
- import_playbook: media-kavita.yml
- import_playbook: media-localsend.yml
- import_playbook: media-navidrome.yml
- import_playbook: media-freshrss.yml
- import_playbook: music-tools.yml
- import_playbook: media-urbackup.yml
- import_playbook: media-verify.yml
# 最後にHTTPS入口（DNSは20-dnsが先。受け持つ名前は dns.yaml の host: media-01）。
- import_playbook: media-tls.yml
