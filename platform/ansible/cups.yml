---
# Canon TS8430シリーズへのプリント中継（CUPS）を apps-01 へ入れる。
# 端末は LAN/VPN からキュー `ts8430` を使う。印刷状況のWeb UIは
# https://cups.apextox.dpdns.org（Caddy＋Authentik）で、/admin は入口で閉じる。
#
#   sops exec-env platform/sops/netbox-inventory.sops.yaml \
#     '.venv/bin/ansible-playbook -i platform/ansible/inventory.netbox.yml platform/ansible/cups.yml'
- name: Deploy the CUPS print relay
  hosts: apps
  become: true
  roles:
    - cups
    # cups.<zone> のTLSとForward Auth。dns.yaml の cups レコードが正本。
    - tls_proxy
