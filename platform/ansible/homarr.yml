---
# Homarr（サービスの入口）を apps-01 へ配備する。
#   sops exec-env platform/sops/netbox-inventory.sops.yaml \
#     '.venv/bin/ansible-playbook -i platform/ansible/inventory.netbox.yml platform/ansible/homarr.yml'
# OIDC クライアントの秘密値を identity VM から読むので、identity.yml の後に流す。
- name: Deploy Homarr
  hosts: apps
  become: true
  roles:
    - docker
    # 先に HTTPS の入口を作る。configure は公開名（Secure Cookie）で Homarr へ入る。
    - tls_proxy
    - homarr
