---
# Homarr（サービスの入口）を services-01 へ配備する。
#   ANSIBLE_PRIVATE_KEY_FILE=~/.ssh/id_ed25519_pve \
#     .venv/bin/ansible-playbook -i platform/ansible/seed.ini platform/ansible/homarr.yml
# OIDC クライアントの秘密値を identity VM から読むので、identity.yml の後に流す。
- name: Deploy Homarr
  hosts: netbox_bootstrap
  become: true
  roles:
    - docker
    # 先に HTTPS の入口を作る。configure は公開名（Secure Cookie）で Homarr へ入る。
    - tls_proxy
    - homarr
