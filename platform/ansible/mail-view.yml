---
# メールビューア（Gmail 読み取り専用）を apps-01 へ配備する。
#   sops exec-env platform/sops/netbox-inventory.sops.yaml \
#     '.venv/bin/ansible-playbook -i platform/ansible/inventory.netbox.yml platform/ansible/mail-view.yml'
# Forward Auth のプロバイダとアプリは identity の configure.py が作るので、
# 先に identity.yml を流す。
- name: Deploy the Gmail viewer
  hosts: apps
  become: true
  roles:
    - docker
    # 先に HTTPS の入口を作る。最後の確認は公開名の SSO リダイレクトを見る。
    - tls_proxy
    - mail_view
