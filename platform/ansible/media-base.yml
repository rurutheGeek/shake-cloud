---
# media-01（クラウドVM）の土台。アプリの前に一度だけ通す。
#
# 現在のLANは IPv6 の default route を RA で配るが、インターネットへの IPv6 が
# 通っていない。Docker は AAAA を先に引いてそのままタイムアウトし、docker pull が
# 失敗する（2026-09-12、media-01 の tls-proxy ビルドで実測）。ルータのIPv6が
# 直るまでの間、ゲスト側で IPv6 を無効にして getaddrinfo と Docker を IPv4 に
# 揃える。DNS・SG・サービスはもともと IPv4 前提。
#
# 共有ライブラリ・Nextcloud のデータディレクトリ・クライアントバックアップは、
# クラウドの HDD ボリューム（services/media の shakecloud_volume.bulk）に置く。
# ここでそのボリュームを載せ、各アプリの場所へ bind する。マウントが済むまで
# Docker を起動しない（未マウントのまま原本領域へ書かせない）。
# 手順は docs/operations/bulk-storage.md。
#
#   sops exec-env platform/sops/netbox-inventory.sops.yaml \
#     '.venv/bin/ansible-playbook -i platform/ansible/inventory.netbox.yml platform/ansible/media-base.yml'
- name: Prepare the media-01 base (IPv4 egress and the shared storage)
  hosts: media
  become: true
  tasks:
    - name: Prefer IPv4 so Docker does not pin an unreachable AAAA address
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-media-no-ipv6.conf
        content: |
          # The router advertises an IPv6 default route that does not reach the
          # internet, and Docker then times out on AAAA. DNS and the security
          # groups are IPv4-only today; revisit when the LAN actually routes IPv6.
          net.ipv6.conf.all.disable_ipv6 = 1
          net.ipv6.conf.default.disable_ipv6 = 1
        mode: '0644'
      register: media_base_ipv6

    - name: Apply the sysctl drop-in
      ansible.builtin.command: sysctl --system
      when: media_base_ipv6 is changed
      changed_when: media_base_ipv6 is changed

    # HDD ボリュームの初期化（mkfs）は、デバイスを明示したときだけ行う。中身の
    # あるデバイスは消さない。デバイスは Terraform の出力 bulk_device_path。
    #   -e media_bulk_initialize_device=/dev/disk/by-id/virtio-vol...
    - name: Look at the device that is about to be formatted
      ansible.builtin.command:
        argv: [blkid, -o, value, -s, TYPE, '{{ media_bulk_initialize_device }}']
      register: media_bulk_existing
      failed_when: media_bulk_existing.rc not in [0, 2]
      changed_when: false
      when: media_bulk_initialize_device is defined

    - name: Refuse to format a device that already has a filesystem
      ansible.builtin.assert:
        that: media_bulk_existing.stdout == ''
        fail_msg: '{{ media_bulk_initialize_device }} already holds {{ media_bulk_existing.stdout }}'
      when: media_bulk_initialize_device is defined

    - name: Format the bulk volume
      ansible.builtin.command:
        argv: [mkfs.ext4, -L, '{{ media_bulk_label }}', -m, '0', '{{ media_bulk_initialize_device }}']
      changed_when: true
      when: media_bulk_initialize_device is defined

    # アプリの playbook が作るディレクトリ（library 配下など）もあるが、
    # マウントポイント自体はここで必ず用意する。無いと mount が rc=32 で
    # 止まり、Docker も起動しない。
    - name: Create the bulk volume mount point
      ansible.builtin.file:
        path: '{{ media_bulk_mount }}'
        state: directory
        mode: '0755'

    # ラベルで指すので、ボリュームを付け直してデバイス名が変わっても同じ。
    - name: Mount the bulk volume at boot
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '^LABEL={{ media_bulk_label }}\s'
        line: 'LABEL={{ media_bulk_label }} {{ media_bulk_mount }} ext4 {{ media_bulk_mount_opts }} 0 2'
        state: present

    - name: Check whether the bulk volume is mounted
      ansible.builtin.command:
        argv: [mountpoint, -q, '{{ media_bulk_mount }}']
      register: media_bulk_mountpoint
      failed_when: false
      changed_when: false

    - name: Mount the bulk volume now
      ansible.builtin.command:
        argv: [mount, '{{ media_bulk_mount }}']
      when: media_bulk_mountpoint.rc != 0
      changed_when: true

    # 所有権は中身を使うコンテナのもの（www-data 33、UrBackup 101）。既にある
    # ディレクトリの所有権・mode は変えない。
    - name: Create the directories on the bulk volume
      ansible.builtin.file:
        path: '{{ media_bulk_mount }}/{{ item.source }}'
        state: directory
        owner: '{{ item.uid }}'
        group: '{{ item.uid }}'
        mode: '0755'
      loop: '{{ media_bulk_binds }}'
      loop_control:
        label: '{{ item.source }}'

    - name: Create the mount points the applications use
      ansible.builtin.file:
        path: '{{ item.target }}'
        state: directory
      loop: '{{ media_bulk_binds }}'
      loop_control:
        label: '{{ item.target }}'

    # 以前はホストの HDD を NFS で直接載せていた（2026-10-03 にボリュームへ移行）。
    - name: Drop the NFS mounts the bulk volume replaced
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '^\S+:\S+\s+{{ item.target | regex_escape }}\s+nfs4?\s'
        state: absent
      loop: '{{ media_bulk_binds }}'
      loop_control:
        label: '{{ item.target }}'

    - name: Bind the bulk volume directories at boot
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '^{{ (media_bulk_mount ~ "/" ~ item.source) | regex_escape }}\s'
        line: >-
          {{ media_bulk_mount }}/{{ item.source }} {{ item.target }}
          none bind,nofail,x-systemd.requires-mounts-for={{ media_bulk_mount }} 0 0
        state: present
      loop: '{{ media_bulk_binds }}'
      loop_control:
        label: '{{ item.target }}'

    - name: Check which application mount points are mounted
      ansible.builtin.command:
        argv: [mountpoint, -q, '{{ item.target }}']
      register: media_bulk_bind_mountpoints
      failed_when: false
      changed_when: false
      loop: '{{ media_bulk_binds }}'
      loop_control:
        label: '{{ item.target }}'

    - name: Bind the bulk volume directories now
      ansible.builtin.command:
        argv: [mount, '{{ item.item.target }}']
      when: item.rc != 0
      changed_when: true
      loop: '{{ media_bulk_bind_mountpoints.results }}'
      loop_control:
        label: '{{ item.item.target }}'
      notify: Restart Docker to pick up the shared library

    - name: Require the shared storage before Docker starts
      ansible.builtin.copy:
        dest: /etc/systemd/system/docker.service.d/20-media-library.conf
        content: |
          [Unit]
          # 共有ライブラリ・Nextcloud データ・クライアントバックアップの
          # マウントが済むまで Docker を起動しない。未マウントのまま
          # 書き込ませない。
          RequiresMountsFor={{ library_root }} {{ nextcloud_data_dir }} {{ client_backup_root }}
        mode: '0644'
      register: media_library_docker

    - name: Apply the Docker dependency when it changed
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: media_library_docker is changed

  handlers:
    - name: Restart Docker to pick up the shared library
      ansible.builtin.systemd_service:
        name: docker
        state: restarted
        daemon_reload: true
