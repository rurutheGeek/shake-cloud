---
- name: Deploy Nextcloud Kavita Navidrome and Vaultwarden
  hosts: media
  become: true
  serial: 1
  vars:
    source_dir: '{{ playbook_dir }}/../../stacks'
  pre_tasks:
    - name: Require explicit paths and supported host OS
      ansible.builtin.assert:
        that:
          - ansible_distribution in ['Ubuntu', 'Debian']
          - project_dir.startswith('/')
          - storage_root.startswith('/')
          - library_root.startswith('/')
          - storage_root != library_root
        fail_msg: Use Debian or Ubuntu and separate absolute paths.
    - name: Install Docker Engine and Compose
      ansible.builtin.include_tasks: tasks/docker.yml
      when: install_docker | bool
  tasks:
    - name: Check Docker Compose
      ansible.builtin.command: docker compose version
      changed_when: false
    - name: Create deployment directory
      ansible.builtin.file:
        path: '{{ project_dir }}'
        state: directory
        mode: '0750'
    - name: Copy application definitions
      ansible.builtin.copy:
        src: '{{ source_dir }}/{{ item }}'
        dest: '{{ project_dir }}/'
        mode: preserve
      loop: [compose.yaml, scripts, .env.example, Caddyfile]
    - name: Render environment from checked-in defaults and AWX variables
      ansible.builtin.template:
        src: stack.env.j2
        dest: '{{ project_dir }}/.env'
        mode: '0600'
      no_log: true
    - name: Enable HTTPS overlay
      ansible.builtin.copy:
        src: '{{ source_dir }}/compose.https.example.yaml'
        dest: '{{ project_dir }}/compose.https.yaml'
        mode: '0640'
      when: enable_https | bool
    - name: Remove HTTPS overlay when disabled
      ansible.builtin.file:
        path: '{{ project_dir }}/compose.https.yaml'
        state: absent
      when: not (enable_https | bool)
    - name: Prepare storage and generate missing secrets on target
      ansible.builtin.command:
        argv: [python3, scripts/stack.py, init]
        chdir: '{{ project_dir }}'
      register: initialization
      changed_when: "'CHANGED' in initialization.stdout"
    - name: Copy reviewed image lock if included in project
      ansible.builtin.copy:
        src: '{{ item }}'
        dest: '{{ project_dir }}/compose.lock.yaml'
        mode: '0644'
      with_fileglob: ['{{ source_dir }}/compose.lock.yaml']
    - name: Pin missing images while preserving existing digests
      ansible.builtin.command:
        argv: [python3, scripts/stack.py, lock]
        chdir: '{{ project_dir }}'
      register: image_lock
      changed_when: "'CHANGED' in image_lock.stdout"
    - name: Reconcile services and Nextcloud mounts
      ansible.builtin.command:
        argv: [python3, scripts/stack.py, up]
        chdir: '{{ project_dir }}'
      changed_when: true
    - name: Install and enable configured Nextcloud apps
      ansible.builtin.command:
        argv:
          - python3
          - scripts/stack.py
          - apps
          - --apps
          - '{{ nextcloud_apps | join(",") }}'
        chdir: '{{ project_dir }}'
      register: nextcloud_apps_result
      changed_when: "'CHANGED:' in nextcloud_apps_result.stdout"
      when: nextcloud_apps | length > 0
    - name: Install HTTP client for account bootstrap
      ansible.builtin.apt:
        name: python3-requests
        state: present
    - name: Initialize or verify media accounts using APIs
      ansible.builtin.command:
        argv: [python3, scripts/bootstrap-accounts.py]
        chdir: '{{ project_dir }}'
      register: media_accounts
      changed_when: "'CHANGED:' in media_accounts.stdout"
