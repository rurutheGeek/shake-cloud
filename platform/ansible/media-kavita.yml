---
# Kavita を media-01 の独立 Compose プロジェクトとして配備する。
#   ansible-playbook -i <inventory> platform/ansible/media-kavita.yml
- name: Deploy Kavita
  hosts: media
  become: true
  vars:
    source_dir: '{{ playbook_dir }}/../../stacks'
  tasks:
    - name: Deploy the Kavita stack
      ansible.builtin.include_role:
        name: compose_stack
      vars:
        compose_stack_source_dir: '{{ source_dir }}/media/kavita'
        compose_stack_project_dir: '{{ project_dir }}/media/kavita'
        compose_stack_files: [compose.yaml, compose.lock.yaml, manage.py, .env.example, bootstrap.py]
        compose_stack_env: |
          STORAGE_ROOT={{ storage_root }}
          LIBRARY_ROOT={{ library_root }}
          TZ={{ tz | default('Asia/Tokyo') }}
          KAVITA_PORT={{ kavita_port | default(5000) }}
    # bootstrap.py は requests を使う。古い deploy.yml と同じく、配備先へ
    # python3-requests を入れてから API を叩く。
    - name: Install the HTTP client for the Kavita bootstrap
      ansible.builtin.apt:
        name: python3-requests
        state: present
        update_cache: true
        cache_valid_time: 3600
    # 初回は管理者の登録と Books ライブラリの作成、以降は現状確認だけ。
    # 秘密値は secrets/accounts.json に 0600 で残り、標準出力には出ない。
    - name: Initialize the Kavita admin and Books library
      ansible.builtin.command:
        argv: [python3, '{{ project_dir }}/media/kavita/bootstrap.py']
        chdir: '{{ project_dir }}/media/kavita'
      register: kavita_bootstrap
      changed_when: "'CHANGED:' in kavita_bootstrap.stdout"
    # Kavita はライブラリ直下のファイルを無視し、フォルダをシリーズとして扱う。
    # books 直下へ置けるように、1時間ごとに本を同名フォルダへ移す
    # （手動整理とぶつかりやすいので、毎分から頻度を下げた。2026-09-16）。
    - name: Create the Kavita scripts directory
      ansible.builtin.file:
        path: '{{ project_dir }}/scripts'
        state: directory
        mode: '0750'
    - name: Copy the loose-book shelver
      ansible.builtin.copy:
        src: '{{ source_dir }}/media/kavita/shelve-loose-books.py'
        dest: '{{ project_dir }}/scripts/shelve-loose-books.py'
        mode: '0755'
    - name: Install the loose-book shelver service
      ansible.builtin.template:
        src: '{{ source_dir }}/media/kavita/media-stack-kavita-shelve.service.j2'
        dest: /etc/systemd/system/media-stack-kavita-shelve.service
        mode: '0644'
    - name: Install the loose-book shelver timer
      ansible.builtin.copy:
        src: '{{ source_dir }}/media/kavita/media-stack-kavita-shelve.timer'
        dest: /etc/systemd/system/media-stack-kavita-shelve.timer
        mode: '0644'
    - name: Enable the loose-book shelver
      ansible.builtin.systemd:
        name: media-stack-kavita-shelve.timer
        enabled: true
        state: started
        daemon_reload: true
    - name: Shelve loose books now
      ansible.builtin.command:
        argv: [python3, '{{ project_dir }}/scripts/shelve-loose-books.py',
               '--books', '{{ library_root }}/books']
      register: kavita_shelve
      changed_when: "'CHANGED:' in kavita_shelve.stdout"
