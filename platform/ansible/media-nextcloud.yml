---
# Nextcloud・Calendar・Tasks を media-01 の独立 Compose プロジェクトとして配備する。
#   ansible-playbook -i <inventory> platform/ansible/media-nextcloud.yml
- name: Deploy Nextcloud Calendar and Tasks
  hosts: media
  become: true
  vars:
    source_dir: '{{ playbook_dir }}/../../stacks'
  tasks:
    # 自作アプリを入れてから起動するので、ここでは init までにする（up は下）。
    - name: Prepare the Nextcloud stack
      ansible.builtin.include_role:
        name: compose_stack
      vars:
        compose_stack_source_dir: '{{ source_dir }}/media/nextcloud'
        compose_stack_project_dir: '{{ project_dir }}/media/nextcloud'
        compose_stack_files: [compose.yaml, compose.lock.yaml, manage.py, .env.example, deck.json]
        compose_stack_actions: [init]
        compose_stack_env: |
          STORAGE_ROOT={{ storage_root }}
          LIBRARY_ROOT={{ library_root }}
          TZ={{ tz | default('Asia/Tokyo') }}
          BIND_ADDRESS={{ bind_address | default('127.0.0.1') }}
          NEXTCLOUD_PORT={{ nextcloud_port | default(8080) }}
          NEXTCLOUD_ADMIN_USER={{ nextcloud_admin_user | default('admin') }}
          NEXTCLOUD_TRUSTED_DOMAINS={{ nextcloud_trusted_domains | default('localhost 127.0.0.1') }}
          OCR_SERVICE_VERSION={{ nextcloud_ocr_search.version }}
    # 自作アプリはそれぞれの公開リポジトリのGitHub Releaseから入れる。
    # バージョンは group_vars の nextcloud_custom_apps が正本で、上げると更新される。
    - name: Install or update the custom Nextcloud apps
      ansible.builtin.command:
        argv:
          - python3
          - '{{ project_dir }}/media/nextcloud/manage.py'
          - custom-apps
          - --apps
          - "{{ nextcloud_custom_apps | map(attribute='name') | join(',') }}"
          - --repos
          - "{{ nextcloud_custom_apps | map(attribute='repo') | join(',') }}"
          - --versions
          - "{{ nextcloud_custom_apps | map(attribute='version') | join(',') }}"
      register: nextcloud_custom_apps_result
      changed_when: "'CHANGED:' in nextcloud_custom_apps_result.stdout"
    - name: Remove the retired custom Nextcloud apps
      when: nextcloud_retired_apps | default([]) | length > 0
      ansible.builtin.command:
        argv: [python3, '{{ project_dir }}/media/nextcloud/manage.py', remove-apps,
               --apps, "{{ nextcloud_retired_apps | join(',') }}"]
      register: nextcloud_retired_apps_result
      changed_when: "'CHANGED:' in nextcloud_retired_apps_result.stdout"
    - name: Create the tag editor app directory
      ansible.builtin.file:
        path: '{{ storage_root }}/nextcloud/html/custom_apps/shake_tags'
        state: directory
        owner: '33'
        group: '33'
        mode: '0755'
    - name: Copy the tag editor app
      ansible.builtin.copy:
        src: '{{ source_dir }}/media/nextcloud/apps/shake_tags/{{ item }}/'
        dest: '{{ storage_root }}/nextcloud/html/custom_apps/shake_tags/{{ item }}/'
        owner: '33'
        group: '33'
        mode: preserve
      loop: [appinfo, lib, js]
    - name: Drop build-only files from the deployed tag editor app
      ansible.builtin.file:
        path: '{{ storage_root }}/nextcloud/html/custom_apps/shake_tags/{{ item }}'
        state: absent
      loop: [node_modules, node_modules.bak, src, package.json, package-lock.json, .gitignore]
    # 画像OCR検索の認識サービス。up がこのソースからイメージをビルドする。
    - name: Fetch the OCR service source
      ansible.builtin.command:
        argv: [python3, '{{ project_dir }}/media/nextcloud/manage.py', ocr-service,
               --repos, '{{ nextcloud_ocr_search.repo }}',
               --versions, '{{ nextcloud_ocr_search.version }}']
      register: nextcloud_ocr_service
      changed_when: "'CHANGED:' in nextcloud_ocr_service.stdout"
    - name: Deploy Nextcloud
      ansible.builtin.command:
        argv: [python3, '{{ project_dir }}/media/nextcloud/manage.py', up]
      register: nextcloud_up
      changed_when: >-
        'CHANGED' in nextcloud_up.stdout
        or 'Created' in nextcloud_up.stderr
        or 'Recreated' in nextcloud_up.stderr
        or 'Started' in nextcloud_up.stderr
    # アプリのバージョンを上げた配備では occ が「upgrade required」で止まる。
    - name: Apply pending Nextcloud upgrades
      ansible.builtin.command:
        argv: [python3, '{{ project_dir }}/media/nextcloud/manage.py', upgrade]
      register: nextcloud_upgrade
      changed_when: "'CHANGED:' in nextcloud_upgrade.stdout"
    - name: Enable Nextcloud cron and shared external storage
      ansible.builtin.command:
        argv: [python3, '{{ project_dir }}/media/nextcloud/manage.py', setup]
      register: nextcloud_setup
      changed_when: "'CHANGED:' in nextcloud_setup.stdout"
    - name: Install and enable configured Nextcloud apps
      ansible.builtin.command:
        argv:
          - python3
          - '{{ project_dir }}/media/nextcloud/manage.py'
          - apps
          - --apps
          - "{{ (nextcloud_apps | default([]) + ['cups_print', 'localsend_share', 'shake_tags', 'ocr_search']) | join(',') }}"
      register: nextcloud_apps_result
      changed_when: "'CHANGED:' in nextcloud_apps_result.stdout"
    # 作業待ちのボード（ホームラボ）。定義は stacks/media/nextcloud/deck.json。
    - name: Reconcile the shared work board
      ansible.builtin.command:
        argv: [python3, '{{ project_dir }}/media/nextcloud/manage.py', config-deck]
      register: nextcloud_deck_config
      changed_when: "'CHANGED:' in nextcloud_deck_config.stdout"
    - name: Default Notes to the plain Markdown editor
      ansible.builtin.command:
        argv: [python3, '{{ project_dir }}/media/nextcloud/manage.py', config-notes]
      register: nextcloud_notes_config
      changed_when: "'CHANGED:' in nextcloud_notes_config.stdout"
    - name: Read the print API token
      delegate_to: localhost
      become: false
      ansible.builtin.command:
        argv: [sops, --decrypt, --extract, '["PRINT_API_TOKEN"]',
               '{{ playbook_dir }}/../sops/print-api.sops.yaml']
      register: nextcloud_print_token
      changed_when: false
      # 秘密値を読むだけ。--check でも後続のタスクが値を使えるよう実行する。
      check_mode: false
      no_log: true
    - name: Point the cups_print app at the print relay
      ansible.builtin.command:
        argv: [python3, '{{ project_dir }}/media/nextcloud/manage.py', config-print]
      environment:
        PRINT_API_URL: '{{ nextcloud_print_api_url }}'
        PRINT_API_TOKEN: '{{ nextcloud_print_token.stdout }}'
      register: nextcloud_print_config
      changed_when: "'CHANGED:' in nextcloud_print_config.stdout"
      no_log: true
    - name: Read the LocalSend send credentials
      delegate_to: localhost
      become: false
      ansible.builtin.command:
        argv: [sops, --decrypt, --output-type, json,
               '{{ playbook_dir }}/../sops/localsend-send.sops.yaml']
      register: nextcloud_localsend_secrets
      changed_when: false
      # 秘密値を読むだけ。--check でも後続のタスクが値を使えるよう実行する。
      check_mode: false
      no_log: true
    - name: Point the localsend_share app at the media-01 relay
      ansible.builtin.command:
        argv: [python3, '{{ project_dir }}/media/nextcloud/manage.py', config-localsend]
      environment:
        SEND_API_URL: '{{ nextcloud_localsend_api_url }}'
        SEND_API_TOKEN: '{{ (nextcloud_localsend_secrets.stdout | from_json).LOCALSEND_SEND_TOKEN }}'
      register: nextcloud_localsend_config
      changed_when: "'CHANGED:' in nextcloud_localsend_config.stdout"
      no_log: true
    - name: Read the music tag API token
      delegate_to: localhost
      become: false
      ansible.builtin.command:
        argv: [sops, --decrypt, --output-type, json,
               '{{ playbook_dir }}/../sops/music-tags.sops.yaml']
      register: nextcloud_tags_secrets
      changed_when: false
      # 秘密値を読むだけ。--check でも後続のタスクが値を使えるよう実行する。
      check_mode: false
      no_log: true
    - name: Point the tag editor app at the music-tools tag API
      ansible.builtin.command:
        argv: [python3, '{{ project_dir }}/media/nextcloud/manage.py', config-tags]
      environment:
        TAGS_API_URL: '{{ nextcloud_tags_api_url }}'
        TAGS_API_TOKEN: '{{ (nextcloud_tags_secrets.stdout | from_json).TAG_API_TOKEN }}'
      register: nextcloud_tags_config
      changed_when: "'CHANGED:' in nextcloud_tags_config.stdout"
      no_log: true
    # トークンは manage.py init が media-01 上で生成したもの（secrets/ocr_token）。
    - name: Point the ocr_search app at the OCR service
      ansible.builtin.command:
        argv: [python3, '{{ project_dir }}/media/nextcloud/manage.py', config-ocr]
      register: nextcloud_ocr_config
      changed_when: "'CHANGED:' in nextcloud_ocr_config.stdout"
      no_log: true
    - name: Install the nightly OCR index units
      ansible.builtin.template:
        src: '{{ source_dir }}/media/nextcloud/media-stack-ocr-index.{{ item }}.j2'
        dest: '/etc/systemd/system/media-stack-ocr-index.{{ item }}'
        mode: '0644'
      loop: [service, timer]
    - name: Enable the nightly OCR index
      ansible.builtin.systemd:
        name: media-stack-ocr-index.timer
        enabled: true
        state: started
        daemon_reload: true
