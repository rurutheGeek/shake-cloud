---
# ポケモン用語対応翻訳の翻訳サイト（静的ファイルと拡張機能のzip）を services-01 へ配備する。
#   ANSIBLE_PRIVATE_KEY_FILE=~/.ssh/id_ed25519_pve \
#     .venv/bin/ansible-playbook -i platform/ansible/seed.ini platform/ansible/poke-translate.yml
- name: Deploy the Pokémon-aware translator site
  hosts: netbox_bootstrap
  become: true
  roles:
    - docker
    # 先に HTTPS の入口を作る。最後の確認は公開名で 200 を見る。
    - tls_proxy
    - poke_translate
