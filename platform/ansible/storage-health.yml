---
# ストレージの寿命対策（journald上限・/のnoatime・Dockerログ上限）を
# ホストとゲストへまとめて当てる。設計は docs/operations/disk.md。
#
# Proxmox ホストは pve.ini、ゲスト（core-01・cloud-01・monitor-01・media-01）は
# NetBox の動的インベントリで流す。対象は hosts 行のグループで決まる:
#   ANSIBLE_PRIVATE_KEY_FILE=~/.ssh/id_ed25519_pve \
#     .venv/bin/ansible-playbook -i platform/ansible/pve.ini platform/ansible/storage-health.yml
#   sops exec-env platform/sops/netbox-inventory.sops.yaml \
#     'ANSIBLE_PRIVATE_KEY_FILE=~/.ssh/id_ed25519_pve .venv/bin/ansible-playbook -i platform/ansible/inventory.netbox.yml platform/ansible/storage-health.yml'
#
# サービスVMのDockerを止めたくないときは -e storage_health_restart_docker=false。
- name: Storage lifespan settings
  hosts: pve:monitoring:media:identity_provider:cloud_control:storage
  become: true
  roles:
    - storage_health
