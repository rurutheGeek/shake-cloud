---
ansible_python_interpreter: /usr/bin/python3
project_dir: /opt/media-stack
storage_root: /srv/media-stack/storage
library_root: /srv/media-stack/library
# 大容量データ用の HDD ボリューム（クラウドのボリューム。Terraform は
# platform/terraform/services/media の shakecloud_volume.bulk）。media-base.yml が
# ラベルで載せ、下の各ディレクトリをアプリの場所へ bind する。
media_bulk_label: media-bulk
media_bulk_mount: /srv/media-bulk
media_bulk_mount_opts: nofail,noatime,x-systemd.device-timeout=30
# SSD のデータディスク（/srv/media-stack）を載せるユニット。cloud-init が入れる
# （platform/terraform/services/media/cloud-init.yaml）。bind はこの後に行う。
media_data_mount_unit: media-data-mount.service
# Nextcloud のデータディレクトリ（ユーザーホーム・appdata）。
nextcloud_data_dir: /srv/media-stack/storage/nextcloud/data
# クライアント端末（Windows等）のバックアップ置き場。UrBackup のイメージは
# 重複排除にハードリンクを使うため、1つのディレクトリにまとめる。
client_backup_root: /srv/media-stack/client-backups
# uid は中身を読み書きするコンテナのもの（www-data 33、UrBackup 101、Forgejo の git 1000）。
media_bulk_binds:
  - {source: library, target: '{{ library_root }}', uid: 33}
  - {source: nextcloud-data, target: '{{ nextcloud_data_dir }}', uid: 33}
  - {source: client-backups, target: '{{ client_backup_root }}', uid: 101}
  # Forgejo のリポジトリ・LFS・SQLite。
  - {source: forgejo, target: '{{ storage_root }}/forgejo', uid: 1000}
# Each tagged host runs an independent complete stack; this is not a DB cluster.
# Override with AWX inventory host variables when needed.
install_docker: true
enable_https: false
stack_env: {}
# Installed and enabled after the stack is healthy. Override per host if needed.
nextcloud_apps:
  - calendar
  - deck
  - notes
  - tasks
  - text
  - user_oidc
# 自作アプリはそれぞれの公開リポジトリのGitHub Releaseから配る。バージョンを
# 上げると再配備で更新される（manage.py custom-apps が .version で冪等に管理）。
nextcloud_custom_apps:
  - name: cups_print
    repo: rurutheGeek/nextcloud-cups-print
    version: 1.0.2
  - name: localsend_share
    repo: rurutheGeek/nextcloud-localsend
    version: 1.0.2
# Nextcloud MCPサーバ（公開リポジトリのGitHub Releaseが正本。bumpで更新）。
nextcloud_mcp_version: 1.1.0
nextcloud_mcp_sha256: 39d6a1e1358e649e0f41c04ab48f7da935b68ac1410136f0a631e1551bb74be6
# aihist（非公開リポジトリの GitHub Release が正本）。
aihist_version: 0.22.0
# ファイルごとの sha256（リリースの SHA256SUMS の写し）。linux-amd64 が本体、ほかは各マシンへ配る。
aihist_sha256s:
  aihist-darwin-arm64: 3d7091c063caef16281ebf577ea5107b2784b03e03ce0e05131a683394ebc95d
  aihist-linux-amd64: 191b2c14f4d58b4ef8fd8d7734fa599032cb4ed23dc3eca002591ac0620db4e9
  aihist-linux-arm64: c0de23bc1b0c258b38779a42e1d52b4f00345b45142ac28d2e5b4cf440ab2f95
  aihist-windows-amd64.exe: 1344842fdec4b08b9bb719ef3c0575e43b7b3b599e8f6f76aa8ca4ccce7607f1
# 撤去済みの自作アプリ。manage.py remove-apps が occ と custom_apps から消す。
# 片付けが済んだら空リストにしてよい。
nextcloud_retired_apps:
  - shake_print
  - shake_localsend
# 自作アプリの送り先。アプリ本体は media-nextcloud.yml が一緒に配る
# （旧スタックの deploy.yml は store から入れる前提なので触らない）。
nextcloud_print_api_url: 'http://192.168.10.105:6320'
nextcloud_localsend_api_url: 'http://192.168.10.101:53200'
nextcloud_tags_api_url: 'http://192.168.10.101:5810'
