---
# LibreSpeed（端末 ↔ apps-01 の実効速度）を apps-01 へ配備する。
#   sops exec-env platform/sops/netbox-inventory.sops.yaml \
#     '.venv/bin/ansible-playbook -i platform/ansible/inventory.netbox.yml platform/ansible/librespeed.yml'
- name: Deploy LibreSpeed
  hosts: apps
  become: true
  roles:
    - docker
    # 先に HTTPS の入口を作る。最後の確認は公開名で 200 を見る。
    - tls_proxy
    - librespeed
