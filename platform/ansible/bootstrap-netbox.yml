---
- name: Bootstrap the inventory service without depending on NetBox
  hosts: netbox_bootstrap
  become: true
  vars:
    netbox_project_dir: /opt/netbox-stack
    netbox_storage_root: /srv/netbox-stack/storage
    netbox_allowed_hosts: localhost 127.0.0.1
    install_docker: true
    source_dir: '{{ playbook_dir }}/../../stacks'
  pre_tasks:
    - name: Install Docker
      ansible.builtin.include_tasks: tasks/docker.yml
      when: install_docker | bool
  tasks:
    - name: Create independent NetBox deployment directory
      ansible.builtin.file:
        path: '{{ netbox_project_dir }}'
        state: directory
        mode: '0750'
    - name: Copy NetBox configuration only
      ansible.builtin.copy:
        src: '{{ source_dir }}/netbox/{{ item }}'
        dest: '{{ netbox_project_dir }}/'
        mode: preserve
      loop: [compose.yaml, configuration, manage.py, seed_inventory.py, seed_terraform_identity.py, .env.example]
    - name: Render initial NetBox environment without replacing existing configuration
      ansible.builtin.copy:
        content: "{{ lookup('file', source_dir + '/netbox/.env.example') | regex_replace('(?m)^STORAGE_ROOT=.*$', 'STORAGE_ROOT=' + netbox_storage_root) | regex_replace('(?m)^ALLOWED_HOSTS=.*$', 'ALLOWED_HOSTS=' + netbox_allowed_hosts) }}\n"
        dest: '{{ netbox_project_dir }}/.env'
        mode: '0600'
        force: false
    - name: Initialize NetBox state and secrets
      ansible.builtin.command:
        argv: [python3, manage.py, init]
        chdir: '{{ netbox_project_dir }}'
      register: initialized
      changed_when: "'CHANGED' in initialized.stdout"
    - name: Pin NetBox images
      ansible.builtin.command:
        argv: [python3, manage.py, lock]
        chdir: '{{ netbox_project_dir }}'
      register: pinned
      changed_when: "'CHANGED' in pinned.stdout"
    - name: Start NetBox and wait for readiness
      ansible.builtin.command:
        argv: [python3, manage.py, up]
        chdir: '{{ netbox_project_dir }}'
      changed_when: true
