# ミニPC（Proxmox）の外にある物理機。tailnet 経由で入る。
# 使う人: 外からの監視（public-monitor.yml）、公開の中継（public-relay.yml）、
#         宅内サーバの外向きガード（home-egress.yml）。
[outpost]
tarakoserver ansible_host=100.123.163.119 ansible_user=ansible_admin

# 学内の公開中継。Cloudflare → ここ → web-01（tailnet）。
[relay]
negitoroserver ansible_host=100.92.253.28 ansible_user=ansible_admin

# 自宅LANの物理サーバ（Raspberry Pi 5）。LAN からも tailnet からも入れる。
[home]
shakeserver ansible_host=100.116.167.59 ansible_user=ansible_admin
