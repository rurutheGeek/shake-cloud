# ミニPC（Proxmox）の外にある物理機。tailnet 経由で入る（鍵は ~/.ssh/id_ed25519_shake）。
# 使う人: 外からの監視（public-monitor.yml）、Raspberry Pi の土台（raspberry-pi.yml）。
# 外から見る監視は、家の外にある negitoroserver で動かす（2026-10-14 に tarakoserver から移した）。
[outpost]
negitoroserver ansible_host=100.92.253.28 ansible_user=ansible_admin

[raspberry_pi]
shakeserver ansible_host=100.116.167.59 ansible_user=ansible_admin
tarakoserver ansible_host=100.123.163.119 ansible_user=ansible_admin
negitoroserver ansible_host=100.92.253.28 ansible_user=ansible_admin
