---
# NetBox（台帳）を構築する。10-platform が動くための前提。
#   ansible-playbook -i platform/ansible/seed.ini platform/ansible/netbox.yml
- name: Deploy the NetBox ledger
  hosts: netbox_bootstrap
  become: true
  roles:
    - docker
    - netbox
    # NetBox が新しい名前を許可してから入口を確かめる。docs-site.yml も同じホストに
    # 同じ入口を置くので、どちらを流しても両方の名前が残る。
    - tls_proxy
