---
- name: Create the pkdb deployment directory
  ansible.builtin.file:
    path: '{{ pkdb_project_dir }}'
    state: directory
    mode: '0750'

- name: Copy the pkdb stack
  ansible.builtin.copy:
    src: '{{ pkdb_source_dir }}/{{ item }}'
    dest: '{{ pkdb_project_dir }}/'
    mode: preserve
  loop:
    - compose.yaml
    - compose.lock.yaml
    - manage.py
    - .env.example

# 登録画面はイメージをこのソースから組む（Dockerfile・requirements・app）。
# Docker が読めればよいので、誰でも読める権限で置く。
- name: Copy the entry page sources
  ansible.builtin.copy:
    src: '{{ pkdb_source_dir }}/entry/'
    dest: '{{ pkdb_project_dir }}/entry/'
    mode: '0644'
    directory_mode: '0755'

# 旧版のPHP1ファイルが残っていても使われないが、紛らわしいので消す。
- name: Drop the old single-file entry page
  ansible.builtin.file:
    path: '{{ pkdb_project_dir }}/entry/index.php'
    state: absent

# .env は宣言値だけを role が描画する（秘密値は secrets/ へ）。
- name: Render the deployment environment
  ansible.builtin.template:
    src: env.j2
    dest: '{{ pkdb_project_dir }}/.env'
    mode: '0600'

- name: Initialize storage and the superuser password
  ansible.builtin.command:
    argv: [python3, manage.py, init]
    chdir: '{{ pkdb_project_dir }}'
  register: pkdb_init
  changed_when: "'CHANGED' in pkdb_init.stdout"

- name: Pin images
  ansible.builtin.command:
    argv: [python3, manage.py, lock]
    chdir: '{{ pkdb_project_dir }}'
  register: pkdb_pinned
  changed_when: "'CHANGED' in pkdb_pinned.stdout"

- name: Start PostgreSQL and wait for health
  ansible.builtin.command:
    argv: [python3, manage.py, up]
    chdir: '{{ pkdb_project_dir }}'
  register: pkdb_up
  changed_when: "'Recreate' in pkdb_up.stderr or 'Created' in pkdb_up.stderr"

- name: Wait for PostgreSQL on its port
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: '{{ pkdb_port }}'
    timeout: 60

- name: Copy the SQL scripts
  ansible.builtin.copy:
    src: '{{ pkdb_source_dir }}/sql/'
    dest: '{{ pkdb_project_dir }}/sql/'
    mode: '0644'
    directory_mode: '0750'

- name: Apply the SQL scripts
  ansible.builtin.command:
    argv: [python3, manage.py, apply, --database, '{{ item.database }}', 'sql/{{ item.file }}']
    chdir: '{{ pkdb_project_dir }}'
  loop: '{{ pkdb_sql }}'
  register: pkdb_applied
  changed_when: "'CHANGED' in pkdb_applied.stdout"

# 登録画面のロール（pkdb_entry）は entry.sql が作る。パスワードはこのホストの
# secrets/entry_password だけにあり、既存のロールのパスワードには触らない。
- name: Let the entry page log in with its own role
  ansible.builtin.command:
    argv: [python3, manage.py, entry-password]
    chdir: '{{ pkdb_project_dir }}'
  register: pkdb_entry_password
  changed_when: "'CHANGED' in pkdb_entry_password.stdout"

# 入口（Caddy）を通さないので Remote-User が無い。公開の /healthz で確かめる。
- name: Wait for the entry page on loopback
  ansible.builtin.uri:
    url: 'http://127.0.0.1:{{ pkdb_entry_port }}/healthz'
    return_content: true
  register: pkdb_entry
  retries: 20
  delay: 3
  until: pkdb_entry.status == 200 and 'true' in pkdb_entry.content

- name: Wait for the entry page entry point
  ansible.builtin.uri:
    url: '{{ pkdb_entry_url }}/'
    follow_redirects: none
    status_code: [200, 302]
    validate_certs: true
  register: pkdb_entry_public
  retries: 20
  delay: 3
  until: pkdb_entry_public.status in [200, 302]

- name: Wait for Adminer on loopback
  ansible.builtin.uri:
    url: 'http://127.0.0.1:{{ pkdb_adminer_port }}/'
  register: pkdb_adminer
  retries: 20
  delay: 3
  until: pkdb_adminer.status == 200

# tls_proxy が先に入口を作る。SSO へのリダイレクトまで届くことを確かめる。
- name: Wait for the Adminer entry point
  ansible.builtin.uri:
    url: '{{ pkdb_adminer_url }}/'
    follow_redirects: none
    status_code: [200, 302]
    validate_certs: true
  register: pkdb_adminer_entry
  retries: 20
  delay: 3
  until: pkdb_adminer_entry.status in [200, 302]

- name: Install the backup service
  ansible.builtin.template:
    src: pkdb-backup.service.j2
    dest: /etc/systemd/system/pkdb-backup.service
    owner: root
    group: root
    mode: '0644'

- name: Install the backup timer
  ansible.builtin.template:
    src: pkdb-backup.timer.j2
    dest: /etc/systemd/system/pkdb-backup.timer
    owner: root
    group: root
    mode: '0644'

- name: Enable and start the backup timer
  ansible.builtin.systemd:
    name: pkdb-backup.timer
    enabled: true
    state: started
    daemon_reload: true
