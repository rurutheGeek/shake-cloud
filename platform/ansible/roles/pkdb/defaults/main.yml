---
# ポケモン系のPostgreSQL（sleepy_pkdb・shakeweb・pkhack）を apps-01 に単独で置く。
pkdb_project_dir: /opt/pkdb
pkdb_storage_root: /srv/pkdb
pkdb_source_dir: '{{ playbook_dir }}/../../stacks/pkdb'
# 旧ホストに残るBotなどが LAN 越しにつなぐので全アドレスで待ち受ける。送信元は
# セキュリティグループ（platform/terraform/services/apps）が LAN に絞る。
pkdb_bind_address: 0.0.0.0
pkdb_port: 5432
# Adminer。入口は同じホストの Caddy（tls_proxy ロール）が https://adminer.<ゾーン> で受ける。
pkdb_adminer_port: 8330
pkdb_dns: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../terraform/dns.yaml') | from_yaml }}"
pkdb_adminer_url: 'https://adminer.{{ pkdb_dns.zone }}'
# ポケモンの登録画面。入口は https://pkdb-entry.<ゾーン>（Forward Auth）。
pkdb_entry_port: 8331
pkdb_entry_url: 'https://pkdb-entry.{{ pkdb_dns.zone }}'
# 配備のたびに流す冪等なSQL。DBがまだ無い（復元前の）ときは何もしない。
# ubsleepy.sql がDBを作り、次の ubsleepy_tables.sql がそのDBへ流れる。
pkdb_sql:
  - database: sleepy_pkdb
    file: lowercase.sql
  - database: sleepy_pkdb
    file: data_fixes.sql
  # 登録画面の書き込みAPI（関数）。entry.sql が基盤とポケモン、続きがドメインごと。
  - database: sleepy_pkdb
    file: entry.sql
  - database: sleepy_pkdb
    file: entry_pokedex.sql
  - database: sleepy_pkdb
    file: entry_moves.sql
  - database: sleepy_pkdb
    file: entry_learnsets.sql
  - database: sleepy_pkdb
    file: entry_evolution.sql
  - database: sleepy_pkdb
    file: entry_rankings.sql
  # アプリ用の表（app_<アプリ名>_）。イントロクイズの対応リスト。
  - database: sleepy_pkdb
    file: app_intro.sql
  - database: postgres
    file: ubsleepy.sql
  - database: ubsleepy
    file: ubsleepy_tables.sql
  - database: ubsleepy_test
    file: ubsleepy_tables.sql
# 日次の論理ダンプ。データと同じディスクなので、VMごとの保全は週次 vzdump が持つ。
pkdb_backup_dir: '{{ pkdb_storage_root }}/backups'
pkdb_backup_keep: 14
pkdb_backup_calendar: '*-*-* 04:20:00'
