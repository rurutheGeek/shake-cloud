---
# 6TB USB HDD（WD60EZAX）をホストで ext4 にして、バックアップ領域とクラウド領域
# （クラウドAPIの HDD ティア）の2つに分ける。game1 へは ROM とセーブを NFS で出す。
# media-01 のデータは 2026-10-03 にクラウドの HDD ボリュームへ移した。正本はこのロール。設計は docs/operations/bulk-storage.md。
#
# 初期化（wipefs/sgdisk/mkfs）は明示されたときだけ行う。既存の
# ファイルシステムは消さない。消してよいと確認できたときだけ
#   -e pve_bulk_storage_initialize=true
# を付けて実行する。
pve_bulk_storage_initialize: false

# デバイス名（sda 等）ではなく、ディスク自身のATA識別子に固定する。
# USBの挿し位置・別のenclosureへ移しても同じパスになる。
pve_bulk_storage_device: /dev/disk/by-id/ata-WDC_WD60EZAX-00C8VB0_WD-WX32D94PX6R8
pve_bulk_storage_partition: '{{ pve_bulk_storage_device }}-part1'
pve_bulk_storage_label: bulk6tb
pve_bulk_storage_mount: /srv/bulk

# nofail: ディスクが無くてもホストのブートを止めない。
# noatime: 5400rpmのHDDへの読み取り時書き込みを減らす。
pve_bulk_storage_fstab_opts: defaults,nofail,noatime,x-systemd.device-timeout=30

# ROM共有。game1（Bazzite）の利用者がそのままコピーできるよう uid 1000 に
# 寄せる。RomM コンテナは compose 側で `:ro` を付けて原本を守る。
pve_bulk_storage_roms_dir: '{{ pve_bulk_storage_mount }}/roms'
pve_bulk_storage_roms_uid: 1000
pve_bulk_storage_roms_gid: 1000

# クラウドAPIのHDDティア（disk_tier: hdd）のVMディスク置き場。利用者が選ぶと
# ここへ qcow2 で置かれる。vzdump（bulk-backup）と同じHDDだが、ディレクトリも
# Proxmoxストレージも分け、バックアップの世代削除に巻き込まれないようにする。
# **単一ディスクなので冗長性は無い。** 注意は docs/operations/bulk-storage.md。
pve_bulk_storage_disks_id: bulk-disks
pve_bulk_storage_disks_dir: '{{ pve_bulk_storage_mount }}/disks'

# バックアップ。vzdump の保存先（Proxmox の dir ストレージ。pve_backup ロールが
# 登録する）と、game1 のセーブを受け取る共有。メディア共有とは分ける。
# このディスク自身が壊れるとバックアップも失う点は docs/operations/backup.md。
pve_bulk_storage_backup_dir: '{{ pve_bulk_storage_mount }}/backups'
pve_bulk_storage_game1_saves_dir: '{{ pve_bulk_storage_backup_dir }}/game1-saves'

# ゲストはIPv4の固定IPだけ。all_squash でゲスト側の uid に関係なく
# anonuid で読み書きする。root_squash だけだと root で動くコンテナ
# （Kavita など）が 2750 のディレクトリを読めない。
pve_bulk_storage_exports:
  - path: '{{ pve_bulk_storage_roms_dir }}'
    clients: 192.168.10.127
    options: 'rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=1000'
  # game1 のセーブ置き場。roms と同じ uid に寄せる。
  - path: '{{ pve_bulk_storage_game1_saves_dir }}'
    clients: 192.168.10.127
    options: 'rw,sync,no_subtree_check,all_squash,anonuid=1000,anongid=1000'

# 領域ごとの上限（ext4 のプロジェクトクォータ）。パーティションは切り直さず、
# ディレクトリごとに上限を持たせる。片方が膨らんでも、もう片方の空きを食わない。
# 上限に達した領域への書き込みは「ディスクが満杯」と同じ失敗になる。
pve_bulk_storage_quotas:
  - name: backup
    id: 1
    path: '{{ pve_bulk_storage_backup_dir }}'
    hard_gib: 2000
  - name: cloud
    id: 2
    path: '{{ pve_bulk_storage_disks_dir }}'
    hard_gib: 3400

# クォータの機能をファイルシステムへ入れるには、一度アンマウントが要る
# （HDD を使うVMを止めてから）。入っていないときは、明示されたときだけ行う。
#   -e pve_bulk_storage_enable_quota_offline=true
pve_bulk_storage_enable_quota_offline: false

# 領域ごとの使用量を監視へ出す（node_exporter の textfile。置き場は
# pve_node_exporter ロールと同じ）。アラートは stacks/monitoring/prometheus/alerts.yml。
pve_bulk_storage_textfile_dir: /var/lib/prometheus/node-exporter
