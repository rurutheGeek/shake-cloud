---
# kubeadm が必要とする下地。swap を止め、カーネルモジュールと sysctl を入れる。
# kubelet は /var/lib/kubelet が未設定だと再起動を繰り返すが、kubeadm init/join
# が設定するので、このスライスでは「起動しても設定待ちで止まっている」が正しい。
- name: Install the Kubernetes prerequisites
  ansible.builtin.apt:
    name: '{{ k8s_prerequisite_packages }}'
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Disable swap for this boot
  ansible.builtin.command: swapoff -a
  changed_when: false

- name: Remove swap from fstab so it stays off
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s+.*)$'
    replace: '# \1'
  register: k8s_fstab

- name: Reload systemd after editing fstab
  ansible.builtin.systemd:
    daemon_reload: true
  when: k8s_fstab.changed

- name: Load the overlay and br_netfilter modules at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/kubernetes.conf
    content: |
      overlay
      br_netfilter
    mode: '0644'

- name: Load the modules now
  ansible.builtin.command:
    argv: [modprobe, '{{ item }}']
  loop: [overlay, br_netfilter]
  changed_when: false

- name: Configure the Kubernetes sysctls
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-kubernetes.conf
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward = 1
    mode: '0644'
  register: k8s_sysctl

- name: Apply the sysctls
  ansible.builtin.command: sysctl --system
  when: k8s_sysctl.changed
  changed_when: true

# containerd。Docker のリポジトリを借りて版を固定する。k8s ノードに Docker 本体
# （docker-ce）は入れない。動かすのは containerd だけでよい。
- name: Create the apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Fetch the Docker repository signing key
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Configure the Docker repository for containerd
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}
      {{ ansible_facts['distribution_release'] }} stable
    filename: docker
    state: present

- name: Install containerd
  ansible.builtin.apt:
    name: '{{ k8s_containerd_package }}'
    state: present
    update_cache: true

- name: Hold containerd so an upgrade does not move it under Kubernetes
  ansible.builtin.dpkg_selections:
    name: containerd.io
    selection: hold

- name: Generate the default containerd configuration
  ansible.builtin.command: containerd config default
  register: k8s_containerd_default
  changed_when: false

# kubelet は systemd を cgroup ドライバとして使う（kubeadm の既定）。
- name: Enable the systemd cgroup driver
  ansible.builtin.copy:
    content: "{{ k8s_containerd_default.stdout | replace('SystemdCgroup = false', 'SystemdCgroup = true') }}"
    dest: /etc/containerd/config.toml
    mode: '0644'
  notify: Restart containerd

- name: Enable containerd
  ansible.builtin.systemd:
    name: containerd
    enabled: true
    state: started

# kubeadm / kubelet / kubectl。版を固定し、自動更新で片方だけ上がらないよう hold。
- name: Fetch the Kubernetes repository signing key
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/v{{ k8s_minor }}/deb/Release.key"
    dest: /tmp/kubernetes-release.asc
    mode: '0644'
  register: k8s_release_key
  changed_when: false

- name: Install the Kubernetes repository signing key
  ansible.builtin.command:
    argv: [gpg, --dearmor, --yes, --output, '{{ k8s_keyring }}', /tmp/kubernetes-release.asc]
    creates: '{{ k8s_keyring }}'

- name: Configure the Kubernetes repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by={{ k8s_keyring }}]
      https://pkgs.k8s.io/core:/stable:/v{{ k8s_minor }}/deb/ /
    filename: kubernetes
    state: present

- name: Install kubelet, kubeadm and kubectl
  ansible.builtin.apt:
    name:
      - "kubelet={{ k8s_version }}-{{ k8s_package_revision }}"
      - "kubeadm={{ k8s_version }}-{{ k8s_package_revision }}"
      - "kubectl={{ k8s_version }}-{{ k8s_package_revision }}"
    state: present
    update_cache: true

- name: Hold the Kubernetes packages
  ansible.builtin.dpkg_selections:
    name: '{{ item }}'
    selection: hold
  loop: [kubelet, kubeadm, kubectl]

- name: Enable kubelet
  ansible.builtin.systemd:
    name: kubelet
    enabled: true

# worker のデータディスク（OS とは別の /dev/vdb）を local-path 用に用意する。
# cp にはこのディスクが無いので、stat で存在を確認してから進める。
- name: Look for a data disk
  ansible.builtin.stat:
    path: /dev/vdb
  register: k8s_data_disk

- name: Read the data disk filesystem type
  ansible.builtin.command: blkid -s TYPE -o value /dev/vdb
  register: k8s_data_fs
  failed_when: false
  changed_when: false
  when: k8s_data_disk.stat.exists

- name: Create the filesystem on the data disk
  ansible.builtin.command: mkfs.ext4 -q -L k8s-data /dev/vdb
  when:
    - k8s_data_disk.stat.exists
    - k8s_data_fs.stdout | trim == ''
  changed_when: true

- name: Create the mount point
  ansible.builtin.file:
    path: /srv/k8s
    state: directory
    mode: '0755'
  when: k8s_data_disk.stat.exists

- name: Add the data disk to fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^/dev/vdb\s'
    line: '/dev/vdb /srv/k8s ext4 defaults 0 2'
    state: present
  when: k8s_data_disk.stat.exists

- name: Check whether the data disk is mounted
  ansible.builtin.command: mountpoint -q /srv/k8s
  register: k8s_mountpoint
  changed_when: false
  failed_when: false
  when: k8s_data_disk.stat.exists

- name: Mount the data disk
  ansible.builtin.command: mount /srv/k8s
  when:
    - k8s_data_disk.stat.exists
    - k8s_mountpoint.rc != 0
  changed_when: true
