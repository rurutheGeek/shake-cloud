---
- name: Create the systemd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system.conf.d
    state: directory
    mode: '0755'

# 固まったときに抜き差しに行かなくて済むように、最初に入れる。
- name: Reboot automatically when the system hangs
  ansible.builtin.copy:
    content: |
      # Ansible（pi_base）が置く。応答が無くなったらハードウェアのウォッチドッグが再起動する。
      [Manager]
      RuntimeWatchdogSec={{ pi_base_watchdog_sec }}
      RebootWatchdogSec={{ pi_base_reboot_watchdog_sec }}
    dest: /etc/systemd/system.conf.d/50-watchdog.conf
    mode: '0644'
  register: pi_base_watchdog

- name: Let systemd pick up the watchdog
  ansible.builtin.systemd:
    daemon_reexec: true
  when: pi_base_watchdog is changed

- name: Create the journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: '0755'

- name: Limit the journal
  ansible.builtin.template:
    src: journald.conf.j2
    dest: /etc/systemd/journald.conf.d/50-pi-base.conf
    mode: '0644'
  notify: Restart journald

- name: Mount the data disk
  ansible.posix.mount:
    path: '{{ pi_base_data_mount }}'
    src: 'LABEL={{ pi_base_data_label }}'
    fstype: ext4
    opts: defaults,noatime,nofail,x-systemd.device-timeout=10s
    passno: '2'
    state: mounted
  when: pi_base_data_label | length > 0

- name: Boot without the desktop
  ansible.builtin.command:
    argv: [systemctl, set-default, multi-user.target]
  register: pi_base_target
  changed_when: "'Created symlink' in pi_base_target.stderr or 'Removed' in pi_base_target.stderr"
  when: pi_base_headless

- name: Stop services that are not used
  ansible.builtin.systemd:
    name: '{{ item }}'
    state: stopped
    enabled: false
  loop: '{{ pi_base_disabled_services }}'
  failed_when: false

- name: Remove retired containers (their volumes stay)
  ansible.builtin.command:
    argv: [docker, rm, '{{ item }}']
  loop: '{{ pi_base_retired_containers }}'
  register: pi_base_rm
  changed_when: pi_base_rm.rc == 0
  failed_when: pi_base_rm.rc != 0 and 'No such container' not in pi_base_rm.stderr

# system prune は停止中のコンテナ（Minecraft など）まで消すので使わない。
- name: Prune images no container uses, and the build cache
  ansible.builtin.command:
    argv: '{{ item }}'
  loop:
    - [docker, image, prune, --all, --force]
    - [docker, builder, prune, --all, --force]
  register: pi_base_prune
  changed_when: "'Total reclaimed space: 0B' not in pi_base_prune.stdout"
  when: pi_base_prune_docker

- name: Stop retired services
  ansible.builtin.systemd:
    name: '{{ item }}'
    state: stopped
    enabled: false
  loop: '{{ pi_base_retired_services }}'
  failed_when: false

- name: Remove retired service definitions
  ansible.builtin.file:
    path: '/etc/systemd/system/{{ item }}.service'
    state: absent
  loop: '{{ pi_base_retired_services }}'
  register: pi_base_units

- name: Reload systemd after removing units
  ansible.builtin.systemd:
    daemon_reload: true
  when: pi_base_units is changed

- name: Remove retired cron lines
  ansible.builtin.shell:
    cmd: |
      set -eu
      current=$(crontab -l -u {{ item.user | quote }} 2>/dev/null || true)
      kept=$(printf '%s\n' "$current" | grep -vF -- {{ item.match | quote }} || true)
      if [ "$current" = "$kept" ]; then echo same; exit 0; fi
      printf '%s\n' "$kept" | crontab -u {{ item.user | quote }} -
      echo changed
  loop: '{{ pi_base_retired_cron }}'
  register: pi_base_cron
  changed_when: "'changed' in pi_base_cron.stdout"

- name: Remove retired files
  ansible.builtin.file:
    path: '{{ item }}'
    state: absent
  loop: '{{ pi_base_retired_paths }}'

- name: Prune volumes no container uses
  ansible.builtin.command:
    argv: [docker, volume, prune, --all, --force]
  register: pi_base_volumes
  changed_when: "'Total reclaimed space: 0B' not in pi_base_volumes.stdout"
  when: pi_base_prune_volumes
