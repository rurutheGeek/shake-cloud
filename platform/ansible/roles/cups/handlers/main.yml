---
- name: Restart cups socket
  # listen の変更はソケットの再作成が要る。cups.service は Requires= なので
  # ソケット再起動に追従する。
  ansible.builtin.systemd:
    name: cups.socket
    state: restarted
    daemon_reload: true

- name: Restart cups
  ansible.builtin.systemd:
    name: cups
    state: restarted
    daemon_reload: true

- name: Restart print api
  ansible.builtin.systemd:
    name: print-api
    state: restarted
    daemon_reload: true
