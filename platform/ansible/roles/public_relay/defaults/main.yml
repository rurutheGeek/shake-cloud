---
# 公開の中継（negitoroserver、学内の Raspberry Pi Zero 2 W）。
# Cloudflare から受けた 80/443 を tailnet の web-01 へ渡す。設定の対応は
# docs/operations/web.md、移した経緯は docs/operations/handover.md。
public_relay_web_upstream: 100.75.249.112  # web-01 の tailnet IP
public_relay_http_port: 80
public_relay_https_port: 443
public_relay_ssh_interface: tailscale0
# 学内の DNS/NTP。このノードは tailnet DNS（AdGuard）を使わない。
public_relay_dns_servers:
  - 133.80.128.5
  - 133.80.153.2
public_relay_ntp_servers: '133.80.128.5 133.80.153.2'

# 443 を開ける相手は Cloudflare だけ。直結されると PROXY protocol の
# クライアントIPを偽装できるため、公開IPレンジ以外は受け付けない。
# 出典: https://www.cloudflare.com/ips-v4 と ips-v6。配備時に実リストと
# 比べ、変わっていたら失敗する（黙って古いリストを使わない）。
public_relay_cloudflare_ipv4:
  - 173.245.48.0/20
  - 103.21.244.0/22
  - 103.22.200.0/22
  - 103.31.4.0/22
  - 141.101.64.0/18
  - 108.162.192.0/18
  - 190.93.240.0/20
  - 188.114.96.0/20
  - 197.234.240.0/22
  - 198.41.128.0/17
  - 162.158.0.0/15
  - 104.16.0.0/13
  - 104.24.0.0/14
  - 172.64.0.0/13
  - 131.0.72.0/22
public_relay_cloudflare_ipv6:
  - 2400:cb00::/32
  - 2606:4700::/32
  - 2803:f800::/32
  - 2405:b500::/32
  - 2405:8100::/32
  - 2a06:98c0::/29
  - 2c0f:f248::/32
public_relay_cloudflare_ranges: >-
  {{ public_relay_cloudflare_ipv4 + public_relay_cloudflare_ipv6 }}
