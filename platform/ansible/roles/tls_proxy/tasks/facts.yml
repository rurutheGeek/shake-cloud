---
# このホストが受ける名前と、入口（dns.yaml の edge）との関係を決める。何も変更しない。
# クラウドVMの inventory はホスト名をインスタンスIDにし、表示名を cloud_name で
# 渡す。dns.yaml の host は表示名なので、両方を候補にする。
# set_fact は同じタスク内の新しい変数を見ないため、2つに分ける。
- name: List the names this host answers to
  ansible.builtin.set_fact:
    tls_proxy_names: "{{ [inventory_hostname] + ([cloud_name] if cloud_name is defined and cloud_name else []) }}"

- name: Work out the names this host serves
  ansible.builtin.set_fact:
    tls_proxy_sites: >-
      {{ tls_proxy_dns.records | dict2items
         | selectattr('value.host', 'defined')
         | selectattr('value.host', 'in', tls_proxy_names)
         | selectattr('value.upstream', 'defined')
         | list }}

- name: Refuse a host that has nothing to serve
  ansible.builtin.assert:
    that: tls_proxy_sites | length > 0
    fail_msg: platform/terraform/dns.yaml has no record with host in {{ tls_proxy_names }} and an upstream
    quiet: true

# 入口（dns.yaml の edge）との関係。入口の後ろのホストは公開の証明書を取らず、
# 入口は後ろのホストの名前も受けて中継する。backends が空なら全ホストが従来どおり。
- name: Work out this host's place relative to the edge
  ansible.builtin.set_fact:
    tls_proxy_is_edge: "{{ (tls_proxy_edge.host | default('')) in tls_proxy_names }}"
    tls_proxy_behind_edge: "{{ (tls_proxy_names | intersect(tls_proxy_edge.backends | default([]))) | length > 0 }}"
    tls_proxy_ledger_name: "{{ tls_proxy_sites[0].value.host }}"
    # dns.yaml の host（表示名）→ アドレス。インベントリに居るホストだけが引ける。
    tls_proxy_addresses: >-
      {%- set out = {} -%}
      {%- for name in groups['all'] -%}
      {%-   set address = hostvars[name].ansible_host | default('') -%}
      {%-   if address -%}
      {%-     set _ = out.update({name: address}) -%}
      {%-     if hostvars[name].cloud_name | default('') -%}
      {%-       set _ = out.update({hostvars[name].cloud_name: address}) -%}
      {%-     endif -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ out }}

- name: Refuse a backend deployment that cannot see the edge
  ansible.builtin.assert:
    that: tls_proxy_edge.host in tls_proxy_addresses
    fail_msg: >-
      {{ tls_proxy_ledger_name }} is behind the edge ({{ tls_proxy_edge.host }}), but the edge is
      not in this inventory, so its address is unknown. Use
      platform/ansible/inventory.netbox.yml.
    quiet: true
  when: tls_proxy_behind_edge

- name: Remember the edge's address
  ansible.builtin.set_fact:
    tls_proxy_edge_address: '{{ tls_proxy_addresses[tls_proxy_edge.host] }}'
  when: tls_proxy_behind_edge

- name: Refuse an edge deployment that cannot see a backend or its CA
  ansible.builtin.assert:
    that:
      - item in tls_proxy_addresses
      - lookup('ansible.builtin.fileglob', tls_proxy_backend_ca_dir ~ '/' ~ item ~ '.crt', wantlist=True) | length == 1
    fail_msg: >-
      {{ item }} is listed in dns.yaml edge.backends, but it is not in this inventory or
      {{ tls_proxy_backend_ca_dir }}/{{ item }}.crt is missing. Deploy {{ item }} first (its
      play fetches the CA) with platform/ansible/inventory.netbox.yml. See docs/operations/edge.md.
    quiet: true
  loop: '{{ tls_proxy_edge.backends | default([]) }}'
  when: tls_proxy_is_edge

- name: Work out the names the edge relays
  ansible.builtin.set_fact:
    tls_proxy_passthrough_sites: >-
      {%- set out = [] -%}
      {%- for name, record in tls_proxy_dns.records.items() -%}
      {%-   if record.upstream is defined and record.host | default('') in (tls_proxy_edge.backends | default([])) -%}
      {%-     set _ = out.append({'key': name, 'value': record, 'address': tls_proxy_addresses[record.host]}) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ out }}
  when: tls_proxy_is_edge

# Forward Auth の問い合わせ先（auth の名前）は、identity が入口の後ろへ移ると入口自身を
# 指す。入口は identity の Caddy へ直接つなぎ、輪にならないようにする。
- name: Point the edge's own Forward Auth at identity directly
  ansible.builtin.set_fact:
    tls_proxy_auth_backend:
      host: '{{ tls_proxy_dns.records[tls_proxy_auth_record].host }}'
      address: '{{ tls_proxy_addresses[tls_proxy_dns.records[tls_proxy_auth_record].host] }}'
      name: '{{ tls_proxy_auth_record }}.{{ tls_proxy_dns.zone }}'
    tls_proxy_authentik_url: 'https://{{ tls_proxy_addresses[tls_proxy_dns.records[tls_proxy_auth_record].host] }}'
  when:
    - tls_proxy_is_edge
    - tls_proxy_dns.records[tls_proxy_auth_record].host in (tls_proxy_edge.backends | default([]))
