---
- name: Create the identity deployment directory
  ansible.builtin.file:
    path: '{{ identity_project_dir }}'
    state: directory
    mode: '0750'

- name: Copy the identity stack
  ansible.builtin.copy:
    src: '{{ identity_source_dir }}/{{ item }}'
    dest: '{{ identity_project_dir }}/'
    mode: preserve
  loop:
    - compose.yaml
    - manage.py
    - configure.py
    - invitations.py
    - .env.example

- name: Copy the reviewed image lock when the repository has one
  ansible.builtin.copy:
    src: '{{ item }}'
    dest: '{{ identity_project_dir }}/compose.lock.yaml'
    mode: '0644'
  with_fileglob: ['{{ identity_source_dir }}/compose.lock.yaml']

- name: Render the initial environment without replacing an existing one
  ansible.builtin.copy:
    src: '{{ identity_source_dir }}/.env.example'
    dest: '{{ identity_project_dir }}/.env'
    mode: '0600'
    force: false

# init は既存の .env を上書きしないので、配備ごとに決まる行だけを揃える。
- name: Converge deployment-specific settings
  ansible.builtin.lineinfile:
    path: '{{ identity_project_dir }}/.env'
    regexp: '^{{ item.key }}='
    line: '{{ item.key }}={{ item.value }}'
    mode: '0600'
  loop:
    - {key: STORAGE_ROOT, value: '{{ identity_storage_root }}'}
    - {key: BIND_ADDRESS, value: '{{ identity_bind_address }}'}
    - {key: CLOUD_PORTAL_URL, value: '{{ identity_cloud_portal_url | trim }}'}
    - {key: NETBOX_URL, value: '{{ identity_netbox_url | trim }}'}

# SMTP は任意。platform/sops/smtp.sops.yaml があるときだけ .env へ写す。
# 事業者が未定の間はファイルが無く、招待リンクはファイル保存だけになる。
- name: Look for SMTP credentials
  ansible.builtin.stat:
    path: '{{ identity_smtp_sops_file }}'
  delegate_to: localhost
  become: false
  register: identity_smtp

- name: Read the SMTP credentials
  ansible.builtin.command:
    argv: [sops, --decrypt, --output-type, json, '{{ identity_smtp_sops_file }}']
  delegate_to: localhost
  become: false
  register: identity_smtp_values
  changed_when: false
  no_log: true
  when: identity_smtp.stat.exists

- name: Converge the SMTP settings
  ansible.builtin.lineinfile:
    path: '{{ identity_project_dir }}/.env'
    regexp: '^{{ item }}='
    line: '{{ item }}={{ (identity_smtp_values.stdout | from_json)[item] | default("") }}'
    mode: '0600'
  loop: '{{ identity_smtp_keys }}'
  no_log: true
  when: identity_smtp.stat.exists

# NetBox の OIDC クライアント秘密は SOPS が正本。configure.py が
# NETBOX_OIDC_CLIENT_SECRET を読んでプロバイダを作る。
- name: Read the NetBox OIDC client secret
  ansible.builtin.command:
    argv: [sops, --decrypt, --output-type, json, '{{ identity_netbox_sops_file }}']
  delegate_to: localhost
  become: false
  register: identity_netbox_values
  changed_when: false
  no_log: true

- name: Converge the NetBox OIDC client secret
  ansible.builtin.lineinfile:
    path: '{{ identity_project_dir }}/.env'
    regexp: '^NETBOX_OIDC_CLIENT_SECRET='
    line: 'NETBOX_OIDC_CLIENT_SECRET={{ (identity_netbox_values.stdout | from_json)["NETBOX_OIDC_CLIENT_SECRET"] | default("") }}'
    mode: '0600'
  no_log: true

- name: Initialize storage and generated secrets
  ansible.builtin.command:
    argv: [python3, manage.py, init]
    chdir: '{{ identity_project_dir }}'
  register: identity_storage
  changed_when: "'CHANGED' in identity_storage.stdout"

- name: Pin images
  ansible.builtin.command:
    argv: [python3, manage.py, lock]
    chdir: '{{ identity_project_dir }}'
  register: identity_pinned
  changed_when: "'CHANGED' in identity_pinned.stdout"

- name: Start Authentik and wait for health
  ansible.builtin.command:
    argv: [python3, manage.py, up]
    chdir: '{{ identity_project_dir }}'
  register: identity_up
  changed_when: "'Recreate' in identity_up.stderr or 'Created' in identity_up.stderr"

- name: Reconcile groups and the cloud portal OIDC client
  ansible.builtin.command:
    argv: [python3, manage.py, configure]
    chdir: '{{ identity_project_dir }}'
  register: identity_configured
  changed_when: "'CHANGED' in identity_configured.stdout"
