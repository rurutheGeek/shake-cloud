---
- name: Install the sync service
  ansible.builtin.template:
    src: netbox-dhcp-sync.service.j2
    dest: /etc/systemd/system/netbox-dhcp-sync.service
    owner: root
    group: root
    mode: '0644'

- name: Install the sync timer
  ansible.builtin.template:
    src: netbox-dhcp-sync.timer.j2
    dest: /etc/systemd/system/netbox-dhcp-sync.timer
    owner: root
    group: root
    mode: '0644'

- name: Enable and start the sync timer
  ansible.builtin.systemd:
    name: netbox-dhcp-sync.timer
    enabled: true
    state: started
    daemon_reload: true
