---
# 家の外の入口（negitoroserver）。Cloudflare から来た 80・443 を tailnet 越しに家の中へ流す。
# 宛先は tailnet のアドレス。Tailscale のポリシー（tag:relay）で届く先を絞っている。
# 公開サイトは DMZ の shakeserver（Pi 5）。2026-10-16 に web-01（100.75.249.112）から移した。
relay_https_upstream: 100.116.167.59:443
relay_http_upstream: 100.116.167.59:80
# 80 番に来た HTTP 以外の通信（Minecraft など）の行き先。空なら受けない。
relay_other_upstream: ''
# 受けるのは Cloudflare からの 80・443 と、tailnet からの SSH だけ（ufw）。
# 一覧の正本は https://www.cloudflare.com/ips-v4/ と ips-v6/（2026-10-22 に確認）。
# 80 番も Cloudflare に絞る（直に来る走査を受けない）。sslh の --anyprot を使うときは
# 相手が Cloudflare ではないので、ここに口を足す。
relay_cloudflare_ranges:
  - 173.245.48.0/20
  - 103.21.244.0/22
  - 103.22.200.0/22
  - 103.31.4.0/22
  - 141.101.64.0/18
  - 108.162.192.0/18
  - 190.93.240.0/20
  - 188.114.96.0/20
  - 197.234.240.0/22
  - 198.41.128.0/17
  - 162.158.0.0/15
  - 104.16.0.0/13
  - 104.24.0.0/14
  - 172.64.0.0/13
  - 131.0.72.0/22
  - 2400:cb00::/32
  - 2606:4700::/32
  - 2803:f800::/32
  - 2405:b500::/32
  - 2405:8100::/32
  - 2a06:98c0::/29
  - 2c0f:f248::/32
