---
- name: Require Debian
  ansible.builtin.assert:
    that: ansible_facts['distribution'] == 'Debian'
    fail_msg: This role targets the Debian home server.

# リモートデスクトップは使わない（画面は VNC で見る）。LAN への入口を減らす。
- name: Stop and disable xrdp
  ansible.builtin.systemd:
    name: '{{ item }}'
    enabled: false
    state: stopped
  loop: ['xrdp', 'xrdp-sesman']

# LAN の IPv6 プレフィックスはルータ広告で決まる。現在の /64 を読んで、
# IPv4 と同じく LAN 宛だけを落とす（変更されたら次回の配備で追従する）。
- name: Find the on-link IPv6 prefix
  ansible.builtin.command: ip -6 route show dev {{ home_egress_interface }} proto ra
  register: home_egress_ra
  changed_when: false
  check_mode: false

- name: Parse the IPv6 prefix
  ansible.builtin.set_fact:
    home_egress_ipv6_prefix: >-
      {{ home_egress_ra.stdout_lines
         | map('regex_replace', '^([0-9a-fA-F:]+/\d+).*$', '\1')
         | select('search', '^[0-9a-fA-F:]+/\d+$')
         | list | first | default('') }}

- name: Install the egress guard
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    mode: '0644'
  notify: Reload nftables

- name: Enable the egress guard
  ansible.builtin.systemd:
    name: nftables
    enabled: true
    state: started
