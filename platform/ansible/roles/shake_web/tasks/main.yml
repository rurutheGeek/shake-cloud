---
# Shake-Web の公開サイト。Podman（root 以外のユーザー shakeweb）と Kubernetes の YAML
# （stacks/shake-web/kube/）で動かす。手順は tasks/podman.yml。

- name: Create the storage directories
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    owner: root
    group: root
    # Podman（shakeweb）のコンテナがログの置き場（log・alexa/logs）まで通れるよう、
    # 中を一覧できないまま通り抜けだけを許す
    mode: '0751'
  loop:
    - '{{ shake_web_storage_root }}'
    - '{{ shake_web_storage_root }}/alexa'

# 秘密値は SOPS から一度だけ読む（暗号化された正本は platform/sops/）。
- name: Read the Shake-Web secrets
  ansible.builtin.command:
    argv: [sops, --decrypt, --output-type, json, '{{ shake_web_sops_file }}']
  delegate_to: localhost
  become: false
  register: shake_web_secrets
  changed_when: false
  check_mode: false
  no_log: true

# 2026-10-17 まで動かしていた Docker Compose の構成を片付ける（入口の 80/443 を空ける）
- name: Retire the Docker Compose deployment
  ansible.builtin.import_tasks: retire-docker.yml

- name: Run the sites with Podman
  ansible.builtin.import_tasks: podman.yml
