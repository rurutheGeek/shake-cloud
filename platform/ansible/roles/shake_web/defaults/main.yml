---
# Shake-Web の公開サイト。2026-10-05 に shakeserver から web-01 へ移し、2026-10-16 に
# DMZ の shakeserver（Pi 5）へ戻す。
# クラウドの VM か。false（Raspberry Pi）ではセキュリティグループ・Tailscale の参加・
# LAN の 80/443 の守りを飛ばす（Pi は pi_base の homeguard と Flint 3 の DMZ が守る）。
shake_web_cloud_vm: true
shake_web_project_dir: /opt/shake-web
shake_web_storage_root: /srv/shake-web
shake_web_source_dir: '{{ playbook_dir }}/../../stacks/shake-web'
# ポケモン系 PostgreSQL（apps-01）。旧ホストでは host.docker.internal だった。
shake_web_db_host: pkdb.apextox.dpdns.org
shake_web_sops_file: '{{ playbook_dir }}/../sops/shake-web.sops.yaml'
# 外向き（egress）の確認に使う。クラウドAPI のアクセスキーは services.sops.yaml。
shake_web_cloud_api: https://cloud.apextox.dpdns.org
shake_web_services_sops: '{{ playbook_dir }}/../sops/services.sops.yaml'
shake_web_cloud_group_name: web-01
# 公開の中継（negitoroserver）は tailnet 経由でこの VM へ届く。
shake_web_tailscale_sops: '{{ playbook_dir }}/../sops/tailscale.sops.yaml'
shake_web_tailscale_hostname: web-01
# 追う ref。検証中は pkhack だけブランチを指す（main に戻すのは切替時）。
shake_web_shake_ref: main
shake_web_pkhack_ref: main
shake_web_alexa_ref: main
shake_web_ayahuya_ref: main
