---
# Shake-Web の公開サイト。DMZ の shakeserver（Pi 5）に置く（2026-10-05〜16 は web-01。消した）。
# 守りは pi_base の homeguard と Flint 3 の DMZ。
shake_web_project_dir: /opt/shake-web
shake_web_storage_root: /srv/shake-web
shake_web_source_dir: '{{ playbook_dir }}/../../stacks/shake-web'
# ポケモン系 PostgreSQL（apps-01）。旧ホストでは host.docker.internal だった。
shake_web_db_host: pkdb.apextox.dpdns.org
shake_web_sops_file: '{{ playbook_dir }}/../sops/shake-web.sops.yaml'
# アプリと静的物は各リポジトリの CI がビルドしたイメージ（GHCR）を使う。
# 戻すときはタグをコミット SHA にする。
shake_web_app_image: ghcr.io/ruruthegeek/shake-web:main
shake_web_pkhack_image: ghcr.io/ruruthegeek/pkhack:main
shake_web_alexa_image: ghcr.io/ruruthegeek/pokebs-alexaskill:main
shake_web_ayahuya_image: ghcr.io/ruruthegeek/ayahuya:main
shake_web_shake_static_image: ghcr.io/ruruthegeek/shake-web-static:main
shake_web_pkhack_static_image: ghcr.io/ruruthegeek/pkhack-static:main
