---
# 重要VMの週次vzdump。流れ: 保存先のマウント確認 → dirストレージ登録 →
# バックアップジョブの作成／更新。判断基準は docs/operations/backup.md。
- name: Find the filesystem that holds the backup path
  ansible.builtin.command:
    argv: [findmnt, -n, -o, TARGET, --target, '{{ pve_backup_storage_path }}']
  register: pve_backup_mount
  failed_when: false
  changed_when: false

- name: Require the bulk disk to be mounted
  ansible.builtin.assert:
    that:
      - pve_backup_mount.rc == 0
      - pve_backup_mount.stdout | trim != '/'
    fail_msg: >-
      {{ pve_backup_storage_path }} が独立したディスク上にありません。
      pve-bulk-storage.yml を先に実行し、/srv/bulk のマウントを確認してください。
      未マウントのまま進めるとバックアップで root を埋めます。

- name: Read the Proxmox storages
  ansible.builtin.command:
    argv: [pvesh, get, /storage, --output-format, json]
  register: pve_backup_storages_raw
  changed_when: false

- name: Find the bulk backup storage
  ansible.builtin.set_fact:
    pve_backup_storage: >-
      {{ (pve_backup_storages_raw.stdout | from_json)
         | selectattr('storage', 'equalto', pve_backup_storage_id)
         | list | first | default({}) }}

- name: Register the backup directory as Proxmox storage
  ansible.builtin.command:
    argv:
      - pvesm
      - add
      - dir
      - '{{ pve_backup_storage_id }}'
      - --path
      - '{{ pve_backup_storage_path }}'
      - --content
      - backup
  when: pve_backup_storage.storage is not defined
  changed_when: true

- name: Read the backup jobs
  ansible.builtin.command:
    argv: [pvesh, get, /cluster/backup, --output-format, json]
  register: pve_backup_jobs_raw
  changed_when: false

- name: Find the tier1 backup job
  ansible.builtin.set_fact:
    pve_backup_job: >-
      {{ (pve_backup_jobs_raw.stdout | from_json)
         | selectattr('comment', 'defined')
         | selectattr('comment', 'equalto', pve_backup_comment)
         | list | first | default({}) }}

- name: Create the weekly backup job
  ansible.builtin.command:
    argv:
      - pvesh
      - create
      - /cluster/backup
      - --storage
      - '{{ pve_backup_storage_id }}'
      - --vmid
      - '{{ pve_backup_vmid_arg }}'
      - --mode
      - '{{ pve_backup_mode }}'
      - --compress
      - '{{ pve_backup_compress }}'
      - --schedule
      - '{{ pve_backup_schedule }}'
      - --prune-backups
      - '{{ pve_backup_prune_arg }}'
      - --comment
      - '{{ pve_backup_comment }}'
      - --enabled
      - '1'
  when: pve_backup_job.id is not defined
  changed_when: true

- name: Update the weekly backup job when the declaration changed
  ansible.builtin.command:
    argv:
      - pvesh
      - set
      - /cluster/backup/{{ pve_backup_job.id }}
      - --storage
      - '{{ pve_backup_storage_id }}'
      - --vmid
      - '{{ pve_backup_vmid_arg }}'
      - --mode
      - '{{ pve_backup_mode }}'
      - --compress
      - '{{ pve_backup_compress }}'
      - --schedule
      - '{{ pve_backup_schedule }}'
      - --prune-backups
      - '{{ pve_backup_prune_arg }}'
      - --enabled
      - '1'
  when:
    - pve_backup_job.id is defined
    # pvesh は prune-backups を {"keep-last":"4"} の辞書で返す。
    # 引数用の文字列（pve_backup_prune_arg）とは形が違うので別に比べる。
    - >-
      pve_backup_job.storage != pve_backup_storage_id
      or (pve_backup_job.vmid | default('')) != pve_backup_vmid_arg
      or pve_backup_job.schedule != pve_backup_schedule
      or pve_backup_job.compress != pve_backup_compress
      or pve_backup_job.mode != pve_backup_mode
      or (pve_backup_job['prune-backups'] | default({}))
         != {'keep-last': pve_backup_keep_last | string}
  changed_when: true
