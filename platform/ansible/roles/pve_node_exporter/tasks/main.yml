---
# ホストのnode_exporterと、SMART/NVMeのtextfile collectorを有効にする。
# メトリクスはPrometheusの node ジョブが 9100 から読む。
- name: Install the host exporters
  ansible.builtin.apt:
    name: '{{ pve_node_exporter_packages }}'
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable and start node_exporter
  ansible.builtin.systemd:
    name: prometheus-node-exporter
    enabled: true
    state: started

- name: Disable openipmi
  ansible.builtin.import_tasks: "{{ playbook_dir }}/tasks/disable-openipmi.yml"

- name: Enable the textfile collector timers
  ansible.builtin.systemd:
    name: '{{ item }}'
    enabled: true
    state: started
  loop: '{{ pve_node_exporter_timers }}'

# 次のtimerまで待つと初回の15分間メトリクスが無い。無いときだけ1回走らせる。
- name: Look for the SMART textfile
  ansible.builtin.stat:
    path: '{{ pve_node_exporter_textfile_dir }}/smartmon.prom'
  register: pve_node_exporter_smartmon

- name: Collect SMART once when the textfile is missing
  ansible.builtin.systemd:
    name: prometheus-node-exporter-smartmon.service
    state: started
  when: not pve_node_exporter_smartmon.stat.exists

- name: Look for the NVMe textfile
  ansible.builtin.stat:
    path: '{{ pve_node_exporter_textfile_dir }}/nvme.prom'
  register: pve_node_exporter_nvme

- name: Collect NVMe once when the textfile is missing
  ansible.builtin.systemd:
    name: prometheus-node-exporter-nvme.service
    state: started
  when: not pve_node_exporter_nvme.stat.exists

# バックアップの最後の成功時刻を出す（タッチパネルと BackupLate 警告が読む）。
- name: Install the backup status collector
  ansible.builtin.copy:
    src: backup-status.py
    dest: /usr/local/lib/shakecloud-backup-status.py
    mode: '0755'

- name: Install the backup status units
  ansible.builtin.copy:
    content: '{{ item.content }}'
    dest: /etc/systemd/system/{{ item.name }}
    mode: '0644'
  loop:
    - name: shakecloud-backup-status.service
      content: |
        # Ansible（pve_node_exporter）が置く。
        [Unit]
        Description=Publish the newest backup times for node_exporter

        [Service]
        Type=oneshot
        ExecStart=/usr/local/lib/shakecloud-backup-status.py {{ pve_node_exporter_textfile_dir }}
    - name: shakecloud-backup-status.timer
      content: |
        # Ansible（pve_node_exporter）が置く。
        [Unit]
        Description=Publish the newest backup times every 15 minutes

        [Timer]
        OnBootSec=2min
        OnUnitActiveSec=15min

        [Install]
        WantedBy=timers.target
  loop_control:
    label: '{{ item.name }}'

- name: Enable the backup status timer
  ansible.builtin.systemd:
    name: shakecloud-backup-status.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Publish the backup status now
  ansible.builtin.systemd:
    name: shakecloud-backup-status.service
    state: started
  changed_when: false

# 回線の速さを 1 日 1 回、測る時刻を毎日 1 時間ずつずらして測る（files/speedtest.py）。
- name: Install the line speed test
  ansible.builtin.copy:
    src: speedtest.py
    dest: /usr/local/lib/shakecloud-speedtest.py
    mode: '0755'

- name: Install the line speed test units
  ansible.builtin.copy:
    content: '{{ item.content }}'
    dest: /etc/systemd/system/{{ item.name }}
    mode: '0644'
  loop:
    - name: shakecloud-speedtest.service
      content: |
        # Ansible（pve_node_exporter）が置く。
        [Unit]
        Description=Measure the line speed once a day, one hour later each day
        After=network-online.target
        Wants=network-online.target

        [Service]
        Type=oneshot
        ExecStart=/usr/local/lib/shakecloud-speedtest.py {{ pve_node_exporter_textfile_dir }}
    - name: shakecloud-speedtest.timer
      content: |
        # Ansible（pve_node_exporter）が置く。毎時起動し、測るかどうかはスクリプトが決める。
        [Unit]
        Description=Check every hour whether the line speed test is due

        [Timer]
        OnCalendar=*-*-* *:17:00

        [Install]
        WantedBy=timers.target
  loop_control:
    label: '{{ item.name }}'

- name: Enable the line speed test timer
  ansible.builtin.systemd:
    name: shakecloud-speedtest.timer
    enabled: true
    state: started
    daemon_reload: true
