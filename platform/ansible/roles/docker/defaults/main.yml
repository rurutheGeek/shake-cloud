---
# Docker のデータの置き場所。空なら既定（/var/lib/docker）。
# SD カード・USB メモリから起動する Raspberry Pi は、HDD の上へ置く。
docker_data_root: ''
# Docker 29 はイメージを containerd の置き場所（既定 /var/lib/containerd）にしまう。
# docker_data_root を変えるなら、こちらも同じディスクへ置く。
docker_containerd_root: "{{ (docker_data_root | dirname) ~ '/containerd' if docker_data_root | length > 0 else '' }}"
