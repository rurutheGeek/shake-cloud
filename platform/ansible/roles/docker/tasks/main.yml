---
- name: Install repository prerequisites
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg, python3]
    state: present
    update_cache: true
- name: Create apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
- name: Fetch Docker repository signing key
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
- name: Configure signed Docker repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }} {{ ansible_facts['distribution_release'] }} stable"
    filename: docker
    state: present
- name: Create the Docker configuration directory
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    mode: '0755'
  when: docker_data_root | length > 0

# 起動前に置く。後から変えると、それまでのイメージとコンテナが見えなくなる。
- name: Put Docker's data on the declared disk
  ansible.builtin.copy:
    content: '{{ {"data-root": docker_data_root} | to_nice_json }}'
    dest: /etc/docker/daemon.json
    mode: '0644'
  when: docker_data_root | length > 0

- name: Create the drop-in directories
  ansible.builtin.file:
    path: '/etc/systemd/system/{{ item }}.service.d'
    state: directory
    mode: '0755'
  loop: [docker, containerd]
  when: docker_data_root | length > 0

# ディスクがつながっていないときは Docker を起動しない（起動ディスクへ書き始めない）。
- name: Start Docker only when its disk is mounted
  ansible.builtin.copy:
    content: |
      [Unit]
      RequiresMountsFor={{ docker_data_root }}
    dest: /etc/systemd/system/docker.service.d/50-data-root.conf
    mode: '0644'
  when: docker_data_root | length > 0
  register: docker_dropin

- name: Put containerd's images on the same disk
  ansible.builtin.lineinfile:
    path: /etc/containerd/config.toml
    regexp: '^root\s*='
    line: 'root = "{{ docker_containerd_root }}"'
    insertbefore: BOF
    create: true
    mode: '0644'
  when: docker_containerd_root | length > 0
  register: docker_containerd_config

- name: Start containerd only when its disk is mounted
  ansible.builtin.copy:
    content: |
      [Unit]
      RequiresMountsFor={{ docker_containerd_root }}
    dest: /etc/systemd/system/containerd.service.d/50-root.conf
    mode: '0644'
  when: docker_containerd_root | length > 0

- name: Install container runtime
  ansible.builtin.apt:
    name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
    state: present
    update_cache: true
- name: Enable Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

# 置き場所を変えたときだけ。中身は移さない（変える前のイメージは取り直す）。
- name: Restart containerd and Docker after moving containerd
  ansible.builtin.systemd:
    name: '{{ item }}'
    state: restarted
    daemon_reload: true
  loop: [containerd, docker]
  when: docker_containerd_config is changed
