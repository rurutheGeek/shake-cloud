---
# NetBox 本体。台帳なので、他のサービスとは独立した配備先に置く。
netbox_project_dir: /opt/netbox-stack
netbox_storage_root: /srv/netbox-stack/storage
# LAN へ公開する。クラウドAPI（cloud-01）や将来の AWX がトンネル無しで台帳へ届くため。
# 2026-09-10 までは 127.0.0.1 に閉じ、SSH ポート転送で到達していた。
netbox_bind_address: 0.0.0.0
netbox_port: 8000
netbox_dns: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../terraform/dns.yaml') | from_yaml }}"
# Host ヘッダの許可。IP で叩く利用者（Terraform・Ansible・クラウドAPI）がまだいるので、
# 配備先のアドレスと HTTPS の名前の両方を含める。
netbox_allowed_hosts: 'localhost 127.0.0.1 {{ ansible_host }} {{ inventory_hostname }} netbox.{{ netbox_dns.zone }}'
netbox_csrf_trusted_origins: 'https://netbox.{{ netbox_dns.zone }}'
netbox_source_dir: '{{ playbook_dir }}/../../stacks/netbox'
# SSO（OIDC）。identity ロールが作る netbox クライアントと対で使う。
# クライアント秘密の正本は SOPS で、identity ロールも同じ値を読む。
netbox_sso_enabled: true
netbox_oidc_key: netbox
# 末尾スラッシュを付けない。social-auth が `{endpoint}/.well-known/...` を
# 組み立てるので、付けると二重スラッシュになって 404 になる。
netbox_oidc_endpoint: 'https://auth.{{ netbox_dns.zone }}/application/o/netbox'
netbox_sops_file: '{{ playbook_dir }}/../sops/netbox.sops.yaml'
