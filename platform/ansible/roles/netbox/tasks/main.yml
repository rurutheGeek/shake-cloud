---
- name: Create independent NetBox deployment directory
  ansible.builtin.file:
    path: '{{ netbox_project_dir }}'
    state: directory
    mode: '0750'

- name: Copy NetBox configuration only
  ansible.builtin.copy:
    src: '{{ netbox_source_dir }}/{{ item }}'
    dest: '{{ netbox_project_dir }}/'
    mode: preserve
  loop:
    - compose.yaml
    - configuration
    - manage.py
    - seed_inventory.py
    - seed_terraform_identity.py
    - seed_cloudapi_identity.py
    - .env.example

- name: Render initial NetBox environment without replacing existing configuration
  ansible.builtin.copy:
    content: >-
      {{ lookup('file', netbox_source_dir + '/.env.example')
         | regex_replace('(?m)^STORAGE_ROOT=.*$', 'STORAGE_ROOT=' + netbox_storage_root)
         | regex_replace('(?m)^ALLOWED_HOSTS=.*$', 'ALLOWED_HOSTS=' + netbox_allowed_hosts) }}
    dest: '{{ netbox_project_dir }}/.env'
    mode: '0600'
    force: false

# 上の雛形は既存の .env を上書きしないので、公開範囲に関わる行だけは毎回揃える。
# これが無いと、初回に 127.0.0.1 で作ったホストは defaults を変えても閉じたまま。
- name: Converge the NetBox listen address and allowed hosts
  ansible.builtin.lineinfile:
    path: '{{ netbox_project_dir }}/.env'
    regexp: '^{{ item.key }}='
    line: '{{ item.key }}={{ item.value }}'
    mode: '0600'
  loop:
    - {key: BIND_ADDRESS, value: '{{ netbox_bind_address }}'}
    - {key: NETBOX_PORT, value: '{{ netbox_port }}'}
    - {key: ALLOWED_HOSTS, value: '{{ netbox_allowed_hosts }}'}
    - {key: CSRF_TRUSTED_ORIGINS, value: '{{ netbox_csrf_trusted_origins }}'}

- name: Initialize NetBox state and secrets
  ansible.builtin.command:
    argv: [python3, manage.py, init]
    chdir: '{{ netbox_project_dir }}'
  register: initialized
  changed_when: "'CHANGED' in initialized.stdout"

- name: Pin NetBox images
  ansible.builtin.command:
    argv: [python3, manage.py, lock]
    chdir: '{{ netbox_project_dir }}'
  register: pinned
  changed_when: "'CHANGED' in pinned.stdout"

- name: Start NetBox and wait for readiness
  ansible.builtin.command:
    argv: [python3, manage.py, up]
    chdir: '{{ netbox_project_dir }}'
  changed_when: true

# Terraform が台帳を書くための書き込み用アイデンティティ。
# Ansible 動的インベントリが使う読み取り専用トークンとは別にする。
- name: Register the write identity Terraform uses
  ansible.builtin.command:
    argv: [python3, manage.py, seed-terraform]
    chdir: '{{ netbox_project_dir }}'
  register: seeded
  changed_when: "'CHANGED' in seeded.stdout"

# クラウドAPIが利用者VMの台帳とIP採番を書くためのアイデンティティ。
# Terraform 用よりも狭く、dcim と tenancy へは書けない。
- name: Register the write identity the cloud API uses
  ansible.builtin.command:
    argv: [python3, manage.py, seed-cloudapi]
    chdir: '{{ netbox_project_dir }}'
  register: cloud_seeded
  changed_when: "'CHANGED' in cloud_seeded.stdout"
