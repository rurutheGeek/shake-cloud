---
# 開発VM。RAM 2GiB を前提に軽く保つ。重いものは足さない。
# 想定は gaming.md「軽量な開発VM」: GUIなし、SSHとVS Code Remote SSHで使う。
devbox_packages:
  - git
  - jq
  - unzip
  - rsync
  - age
  - python3-venv
  - vim
# Terraform を入れるか。版はリポジトリ直下の .terraform-version と揃える
# （CI も同じファイルを読む）。apt の最新版は版が動くので、配布バイナリを版指定で置く。
devbox_install_terraform: true
devbox_terraform_version: "1.15.8"
# Terraform の配布名は ansible の architecture と一部違う。
devbox_terraform_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}.get(ansible_facts['architecture'], ansible_facts['architecture']) }}"
# 自作クラウドAPIの Provider をここから実行する。state は各自のホーム。
devbox_state_dir: tf

# ログインパスワード。tools/ensure-secrets.py が生成する。
# 構成管理者の手元にだけ置く平文で、Git へは入れない（.gitignore の .local/）。
# 利用者へは口頭など普通の手段で伝える。既存の値は作り直さない。
devbox_password_file: .local/devvm-passwords.yml
