---
- name: Install developer packages
  ansible.builtin.apt:
    name: '{{ devbox_packages }}'
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Configure the HashiCorp repository and install Terraform
  when: devbox_install_terraform | bool
  block:
    # tasks/docker.yml と同じ形。鍵は keyring へ置き、signed-by で縛る。
    - name: Create apt keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Fetch the HashiCorp repository signing key
      ansible.builtin.get_url:
        url: https://apt.releases.hashicorp.com/gpg
        dest: /etc/apt/keyrings/hashicorp.asc
        mode: '0644'

    - name: Configure the signed HashiCorp repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [signed-by=/etc/apt/keyrings/hashicorp.asc]
          https://apt.releases.hashicorp.com {{ devbox_hashicorp_release }} main
        filename: hashicorp
        state: present

    - name: Install Terraform
      ansible.builtin.apt:
        name: terraform
        state: present
        update_cache: true

# 各自の state とAPIキーは分けて持つ。gaming.md「SSH鍵、ホームディレクトリ、
# APIキー、Terraform state は個別に保持します」。
- name: Create the per-user Terraform state directory
  ansible.builtin.file:
    path: '{{ devbox_user_home }}/{{ devbox_state_dir }}'
    state: directory
    owner: '{{ devbox_user }}'
    group: '{{ devbox_user }}'
    mode: '0700'
  when: devbox_user is defined and devbox_user_home is defined

- name: Allow the developer to use Docker without sudo
  ansible.builtin.user:
    name: '{{ devbox_user }}'
    groups: docker
    append: true
  when: devbox_user is defined

# 鍵を持っていない人でも入れるようにする。鍵の登録と terraform apply を
# 使う側に要求しないため。値は SOPS で暗号化したまま保持する。
- name: Ensure a generated login password exists for every developer VM
  ansible.builtin.command:
    argv: >-
      {{
        ['python3', 'tools/ensure-secrets.py', '--plaintext', '--file', devbox_password_file]
        + (ansible_play_hosts | map('regex_replace', '^', '--key=') | list)
      }}
    chdir: '{{ playbook_dir }}/../..'
  become: false
  delegate_to: localhost
  run_once: true
  register: devbox_generated
  changed_when: "'CHANGED' in devbox_generated.stdout"

- name: Read the login passwords back
  ansible.builtin.slurp:
    src: '{{ playbook_dir }}/../../{{ devbox_password_file }}'
  become: false
  delegate_to: localhost
  run_once: true
  register: devbox_passwords
  no_log: true

# stdin で渡すので、パスワードがプロセス一覧やログへ出ない。
# 毎回同じ値を設定し直すため、ホスト側で変えられても元へ戻る。
- name: Set the login password
  ansible.builtin.command:
    argv: [/usr/sbin/chpasswd]
    stdin: "{{ devbox_user }}:{{ (devbox_passwords.content | b64decode | from_yaml)[inventory_hostname] }}"
  changed_when: false
  no_log: true
