---
- name: Install developer packages
  ansible.builtin.apt:
    name: '{{ devbox_packages }}'
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install the pinned Terraform
  when: devbox_install_terraform | bool
  block:
    # 版はリポジトリ直下の .terraform-version と揃える（CI も同じファイルを読む）。
    # apt の最新版は版が動いてしまうので、配布バイナリを版指定で置く。
    - name: Remove a distribution Terraform if one is present
      ansible.builtin.apt:
        name: terraform
        state: absent

    - name: Download the Terraform release
      ansible.builtin.get_url:
        url: >-
          https://releases.hashicorp.com/terraform/{{ devbox_terraform_version }}/
          terraform_{{ devbox_terraform_version }}_linux_{{ devbox_terraform_arch }}.zip
        dest: /tmp/terraform_{{ devbox_terraform_version }}_linux_{{ devbox_terraform_arch }}.zip
        mode: '0644'

    - name: Download the Terraform checksums
      ansible.builtin.get_url:
        url: >-
          https://releases.hashicorp.com/terraform/{{ devbox_terraform_version }}/
          terraform_{{ devbox_terraform_version }}_SHA256SUMS
        dest: /tmp/terraform_{{ devbox_terraform_version }}_SHA256SUMS
        mode: '0644'

    - name: Verify the Terraform archive
      ansible.builtin.command:
        argv:
          - sha256sum
          - --check
          - --ignore-missing
          - /tmp/terraform_{{ devbox_terraform_version }}_SHA256SUMS
        chdir: /tmp
      changed_when: false

    - name: Install the Terraform binary
      ansible.builtin.unarchive:
        src: /tmp/terraform_{{ devbox_terraform_version }}_linux_{{ devbox_terraform_arch }}.zip
        dest: /usr/local/bin
        remote_src: true
        mode: '0755'
        owner: root
        group: root

# 各自の state とAPIキーは分けて持つ。gaming.md「SSH鍵、ホームディレクトリ、
# APIキー、Terraform state は個別に保持します」。
- name: Create the per-user Terraform state directory
  ansible.builtin.file:
    path: '{{ devbox_user_home }}/{{ devbox_state_dir }}'
    state: directory
    owner: '{{ devbox_user }}'
    group: '{{ devbox_user }}'
    mode: '0700'
  when: devbox_user is defined and devbox_user_home is defined

- name: Allow the developer to use Docker without sudo
  ansible.builtin.user:
    name: '{{ devbox_user }}'
    groups: docker
    append: true
  when: devbox_user is defined

# 鍵を持っていない人でも入れるようにする。鍵の登録と terraform apply を
# 使う側に要求しないため。値は SOPS で暗号化したまま保持する。
- name: Ensure a generated login password exists for every developer VM
  ansible.builtin.command:
    argv: >-
      {{
        ['python3', 'tools/ensure-secrets.py', '--plaintext', '--file', devbox_password_file]
        + (ansible_play_hosts | map('regex_replace', '^', '--key=') | list)
      }}
    chdir: '{{ playbook_dir }}/../..'
  become: false
  delegate_to: localhost
  run_once: true
  register: devbox_generated
  changed_when: "'CHANGED' in devbox_generated.stdout"

- name: Read the login passwords back
  ansible.builtin.slurp:
    src: '{{ playbook_dir }}/../../{{ devbox_password_file }}'
  become: false
  delegate_to: localhost
  run_once: true
  register: devbox_passwords
  no_log: true

# stdin で渡すので、パスワードがプロセス一覧やログへ出ない。
# 毎回同じ値を設定し直すため、ホスト側で変えられても元へ戻る。
- name: Set the login password
  ansible.builtin.command:
    argv: [/usr/sbin/chpasswd]
    stdin: "{{ devbox_user }}:{{ (devbox_passwords.content | b64decode | from_yaml)[inventory_hostname] }}"
  changed_when: false
  no_log: true
