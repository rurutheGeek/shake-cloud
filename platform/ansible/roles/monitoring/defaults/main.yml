---
# 監視スタック（Prometheus・Alertmanager・Grafana・exporter）を monitor-01 に置く。
monitoring_project_dir: /opt/monitoring-stack
monitoring_storage_root: /srv/monitoring
monitoring_source_dir: '{{ playbook_dir }}/../../stacks/monitoring'
monitoring_bind_address: 127.0.0.1
monitoring_dns: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../terraform/dns.yaml') | from_yaml }}"
monitoring_public_url: 'https://grafana.{{ monitoring_dns.zone }}'
# OIDC クライアントの秘密値の正本は identity VM。配備のたびにここから写す。
monitoring_identity_host: "{{ (groups.get('identity_provider') or ['identity'])[0] }}"
monitoring_oidc_credentials_path: /opt/identity-stack/secrets/oidc-grafana.json
# Proxmox の読み取り専用トークンと NUT のパスワード。
monitoring_sops_file: '{{ playbook_dir }}/../sops/monitoring.sops.yaml'
monitoring_discord_sops_file: '{{ playbook_dir }}/../sops/public-monitor.sops.yaml'
# UPS の upsd（ups_server ロール）。UPS の USB は tarakoserver。
monitoring_nut_server: 192.168.10.11
# Prometheus の記録を残す期間。記録は HDD（/srv/monitoring）にあり、1 日あたり約 55MB。
# 1 年分あれば月ごとの電気代や前の年との比較が出せる。
monitoring_prometheus_retention: 400d
