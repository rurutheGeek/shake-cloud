---
# Discord Bot「UBSLEEPY」を apps-01 に単独で置く。
ubsleepy_project_dir: /opt/ubsleepy
ubsleepy_storage_root: /srv/ubsleepy
ubsleepy_source_dir: '{{ playbook_dir }}/../../stacks/ubsleepy'
ubsleepy_repository: https://github.com/rurutheGeek/UBSLEEPY.git
ubsleepy_branch: main
# Discord のトークン（DISCORD_TOKEN）。
ubsleepy_sops_file: '{{ playbook_dir }}/../sops/ubsleepy.sops.yaml'
# main の更新を apps-01 が自分で取りに行く間隔。
ubsleepy_update_calendar: '*:0/5'
# セーブデータの日次アーカイブ。データと同じディスクなので、VMごとの保全は
# 週次 vzdump が持つ。
ubsleepy_backup_dir: '{{ ubsleepy_storage_root }}/backups'
ubsleepy_backup_keep: 14
ubsleepy_backup_calendar: '*-*-* 19:10:00'
