---
- name: Install git
  ansible.builtin.apt:
    name: git
    state: present

- name: Create the UBSLEEPY deployment directory
  ansible.builtin.file:
    path: '{{ ubsleepy_project_dir }}'
    state: directory
    mode: '0750'

- name: Copy the UBSLEEPY stack
  ansible.builtin.copy:
    src: '{{ ubsleepy_source_dir }}/{{ item }}'
    dest: '{{ ubsleepy_project_dir }}/'
    mode: preserve
  loop:
    - compose.yaml
    - compose.lock.yaml
    - manage.py
    - .env.example

# .env は宣言値だけを role が描画する（トークンは secrets/ へ）。
- name: Render the deployment environment
  ansible.builtin.template:
    src: env.j2
    dest: '{{ ubsleepy_project_dir }}/.env'
    mode: '0600'

- name: Initialize the deployment
  ansible.builtin.command:
    argv: [python3, manage.py, init]
    chdir: '{{ ubsleepy_project_dir }}'
  register: ubsleepy_init
  changed_when: "'CHANGED' in ubsleepy_init.stdout"

- name: Read the Discord token
  ansible.builtin.command:
    argv: [sops, --decrypt, --output-type, json, '{{ ubsleepy_sops_file }}']
  delegate_to: localhost
  become: false
  register: ubsleepy_credentials
  changed_when: false
  # 秘密値を読むだけ。--check でも後続のタスクが値を使えるよう実行する。
  check_mode: false
  no_log: true

# 改行を足さない（mail_view と同じ理由）。manage.py が読むときに strip する。
- name: Install the Discord token
  ansible.builtin.copy:
    content: '{{ (ubsleepy_credentials.stdout | from_json).DISCORD_TOKEN }}'
    dest: '{{ ubsleepy_project_dir }}/secrets/discord_token'
    mode: '0400'
  register: ubsleepy_token
  no_log: true

- name: Pin images
  ansible.builtin.command:
    argv: [python3, manage.py, lock]
    chdir: '{{ ubsleepy_project_dir }}'
  register: ubsleepy_pinned
  changed_when: "'CHANGED' in ubsleepy_pinned.stdout"

- name: Fetch the source
  ansible.builtin.command:
    argv: [python3, manage.py, update]
    chdir: '{{ ubsleepy_project_dir }}'
  register: ubsleepy_updated
  changed_when: "'CHANGED' in ubsleepy_updated.stdout"

# セーブデータは旧ホストから manage.py import で運ぶ（docs/operations/ubsleepy.md）。
# 運ぶ前は Bot を起動しない。空のデータで動き始めると記録が最初からになる。
- name: Look for the save data
  ansible.builtin.stat:
    path: '{{ ubsleepy_storage_root }}/state/config.json'
  register: ubsleepy_state

- name: Start the bot
  ansible.builtin.command:
    argv: [python3, manage.py, up]
    chdir: '{{ ubsleepy_project_dir }}'
  register: ubsleepy_up
  changed_when: "'Recreate' in ubsleepy_up.stderr or 'Created' in ubsleepy_up.stderr or 'Started' in ubsleepy_up.stderr"
  when: ubsleepy_state.stat.exists

- name: Install the update and backup units
  ansible.builtin.template:
    src: '{{ item }}.j2'
    dest: '/etc/systemd/system/{{ item }}'
    owner: root
    group: root
    mode: '0644'
  loop:
    - ubsleepy-update.service
    - ubsleepy-update.timer
    - ubsleepy-backup.service
    - ubsleepy-backup.timer

- name: Enable and start the timers
  ansible.builtin.systemd:
    name: '{{ item }}'
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - ubsleepy-update.timer
    - ubsleepy-backup.timer
