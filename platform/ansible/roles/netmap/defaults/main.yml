---
# ネットワーク図（stacks/netmap）を monitor-01 に置く。
netmap_project_dir: /opt/netmap
netmap_source_dir: '{{ playbook_dir }}/../../stacks/netmap'
# Mermaid はドキュメントサイトと同じ同梱版を使う（オフラインで描画する）。
netmap_mermaid_file: '{{ playbook_dir }}/../../docs/assets/js/mermaid.min.js'
# tls-proxy の Caddy が 127.0.0.1:8096 へ中継する（dns.yaml の netmap）。
netmap_port: 8096
netmap_uid: 10001
netmap_flint_host: 192.168.10.1
netmap_monitoring_sops_file: '{{ playbook_dir }}/../sops/monitoring.sops.yaml'
netmap_netbox_sops_file: '{{ playbook_dir }}/../sops/netbox.sops.yaml'
netmap_tailscale_sops_file: '{{ playbook_dir }}/../sops/tailscale.sops.yaml'
# Flint 3 へ鍵を登録するときに手元から使う鍵（Flint 3 の root）。
netmap_flint_admin_key: '~/.ssh/id_ed25519_pve'
