---
# media-01（クラウドVM）の Caddy を配備する。受ける名前は
# platform/terraform/dns.yaml の host: media-01 で、NetBox のインベントリが
# tags.Name を cloud_name として渡すため一致するようになっている。
# 公開証明書を取るのは入口の core-01 だけ（edge.yml）で、ここは内部CAの
# 証明書で core-01 からの中継を受ける。サービス自身のポートは 127.0.0.1 のまま、
# Caddy が Forward Auth を担う。
#
#   sops exec-env platform/sops/netbox-inventory.sops.yaml \
#     '.venv/bin/ansible-playbook -i platform/ansible/inventory.netbox.yml platform/ansible/media-tls.yml'
- name: Put the HTTPS entry in front of the media services
  hosts: media
  become: true
  roles:
    - tls_proxy
