---
# FreshRSS のネイティブ OIDC を core-01（Authentik）に接続する。
#
#   sops exec-env platform/sops/netbox-inventory.sops.yaml \
#     '.venv/bin/ansible-playbook -i platform/ansible/inventory.netbox.yml platform/ansible/media-freshrss-sso.yml'
#
# 実行には media-01 と core-01 の両方が解決できる inventory が要る（NetBox の
# インベントリの `media` と `identity_provider`）。ホスト名はインスタンスIDなので、
# 対象を絞るときは `--limit media` のようにグループ名を使う。前提: Authentik が
# configure.py でクライアントを作り、media-freshrss.yml がユニットを配備していること。
#
# client_id/secret は core-01 の secrets/oidc-media.json から読み、標準出力・
# ログには出さない（no_log）。配った後 manage.py up で OIDC を有効にして再起動する。
- name: Configure FreshRSS native OIDC
  hosts: media
  become: true
  tasks:
    - name: Require the FreshRSS deployment to exist
      ansible.builtin.stat:
        path: '{{ project_dir }}/media/freshrss/{{ item }}'
      loop: [.env, manage.py]
      register: media_freshrss_files
    - name: Stop when the unit has not been deployed
      ansible.builtin.assert:
        that: media_freshrss_files.results | map(attribute='stat.exists') | select | list | length == 2
        fail_msg: >-
          {{ project_dir }}/media/freshrss に .env か manage.py がない。
          media-freshrss.yml を先に実行する。
        quiet: true

    - name: Read the media OIDC client credentials on the identity VM
      ansible.builtin.slurp:
        src: /opt/identity-stack/secrets/oidc-media.json
      delegate_to: "{{ media_sso_identity_host | default((groups.get('identity_provider') or ['identity'])[0]) }}"
      register: media_freshrss_oidc
      no_log: true
    - name: Check the FreshRSS client credentials
      ansible.builtin.assert:
        that:
          - (media_freshrss_oidc.content | b64decode | from_json).freshrss.client_id | length > 0
          - (media_freshrss_oidc.content | b64decode | from_json).freshrss.client_secret | length > 0
        fail_msg: >-
          identity VM の /opt/identity-stack/secrets/oidc-media.json に freshrss の
          client_id / client_secret がない。identity 側を先に配備する。
        quiet: true
      no_log: true

    - name: Install the FreshRSS OIDC client secret
      ansible.builtin.copy:
        content: >-
          {{ {'client_id': (media_freshrss_oidc.content | b64decode | from_json).freshrss.client_id,
              'client_secret': (media_freshrss_oidc.content | b64decode | from_json).freshrss.client_secret} | to_json }}
        dest: '{{ project_dir }}/media/freshrss/secrets/oidc_client.json'
        mode: '0600'
      no_log: true

    - name: Restart FreshRSS with OIDC enabled
      ansible.builtin.command:
        argv: [python3, '{{ project_dir }}/media/freshrss/manage.py', up]
      register: freshrss_sso_up
      changed_when: >-
        'CHANGED' in freshrss_sso_up.stdout
        or 'Created' in freshrss_sso_up.stderr
        or 'Recreated' in freshrss_sso_up.stderr
        or 'Started' in freshrss_sso_up.stderr
