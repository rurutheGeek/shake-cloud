---
# ドキュメントサイトを LAN に公開する。置き場所は apps-01。
#   sops exec-env platform/sops/netbox-inventory.sops.yaml \
#     '.venv/bin/ansible-playbook -i platform/ansible/inventory.netbox.yml platform/ansible/docs-site.yml'
- name: Publish the documentation site
  hosts: apps
  become: true
  roles:
    - docker
    - docs_site
    - tls_proxy
