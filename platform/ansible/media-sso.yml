---
# media-01 の Nextcloud を core-01（Authentik）へ ネイティブ OIDC で接続する。
#
# Authentik が configure.py で作った OIDC クライアント（正本は core-01 上の
# /opt/identity-stack/secrets/oidc-media.json）を slurp し、media-01 の
# configure-oidc.py へ環境変数として渡す。secret はログへ出さない。
#
# core-01 は slurp の delegate_to のために同じインベントリへ必要。NetBox の
# 動的インベントリ（inventory.netbox.yml）の `media` と `identity_provider` が
# それ。ホスト名はインスタンスIDなので、対象を絞るときはグループ名を使う:
#
#   sops exec-env platform/sops/netbox-inventory.sops.yaml \
#     '.venv/bin/ansible-playbook -i platform/ansible/inventory.netbox.yml \
#       platform/ansible/media-sso.yml --limit media'
#
# core-01 のホスト名が `core-01` でない場合は -e media_sso_identity_host=... で
# 上書きする。ゾーンは platform/terraform/dns.yaml から取る。
- name: Connect media-01 Nextcloud to the identity provider
  hosts: media
  become: true
  vars:
    source_dir: '{{ playbook_dir }}/../../stacks'
    media_sso_zone: "{{ (lookup('ansible.builtin.file', playbook_dir ~ '/../terraform/dns.yaml') | from_yaml).zone }}"
    media_sso_identity_secrets: /opt/identity-stack/secrets/oidc-media.json
  tasks:
    - name: Create the Nextcloud OIDC directory
      ansible.builtin.file:
        path: '{{ project_dir }}/media/nextcloud'
        state: directory
        mode: '0750'
    - name: Copy the Nextcloud OIDC unit script
      ansible.builtin.copy:
        src: '{{ source_dir }}/media/nextcloud/configure-oidc.py'
        dest: '{{ project_dir }}/media/nextcloud/configure-oidc.py'
        mode: '0644'
    # 正本は identity VM 上の1か所。ここへ複製して食い違わせない。
    - name: Read the media OIDC client credentials on the identity VM
      ansible.builtin.slurp:
        src: '{{ media_sso_identity_secrets | default("/opt/identity-stack/secrets/oidc-media.json", true) }}'
      delegate_to: "{{ media_sso_identity_host | default((groups.get('identity_provider') or ['identity'])[0]) }}"
      register: media_sso_credentials
      no_log: true
    - name: Check the media OIDC client credentials
      ansible.builtin.assert:
        that:
          - (media_sso_credentials.content | b64decode | from_json).nextcloud.client_id | length > 0
          - (media_sso_credentials.content | b64decode | from_json).nextcloud.client_secret | length > 0
        quiet: true
      no_log: true
    # secret は environment と no_log だけで渡し、argv には出さない。
    - name: Connect Nextcloud to Authentik
      ansible.builtin.command:
        argv:
          - python3
          - '{{ project_dir }}/media/nextcloud/configure-oidc.py'
        chdir: '{{ project_dir }}/media/nextcloud'
      environment:
        NEXTCLOUD_OIDC_CLIENT_ID: '{{ (media_sso_credentials.content | b64decode | from_json).nextcloud.client_id }}'
        NEXTCLOUD_OIDC_CLIENT_SECRET: '{{ (media_sso_credentials.content | b64decode | from_json).nextcloud.client_secret }}'
        NEXTCLOUD_OIDC_DISCOVERY_URL: 'https://auth.{{ media_sso_zone }}/application/o/nextcloud/.well-known/openid-configuration'
        MEDIA_ZONE: '{{ media_sso_zone }}'
      register: media_sso_configured
      changed_when: "'CHANGED:' in media_sso_configured.stdout"
      no_log: true
