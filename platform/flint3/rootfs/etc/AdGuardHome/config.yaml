---
# AdGuard Home（Flint 3）。GL.iNet の組み込み方式で動かす:
# AdGuard は :3053 で待ち受け、LAN からの :53 は GL のファイアウォールが転送する。
# dnsmasq は :53 のまま DHCP とローカル名（*.lan）を担当する。
#
# 土台は純正ファーム 4.10.1 の初期設定（schema 14。起動時に AdGuard が新しい
# 形式へ移行する）。そこへ次の方針を載せてある:
#   上流は DoH（ISP の DNS は使わない）、*.lan と逆引きは dnsmasq、
# クエリログはメモリのみ（eMMC へ書かない）。統計は 90 日。
# 管理画面（:3000）は認証なし。ファイアウォールで core-01 だけに開ける。
bind_host: 0.0.0.0
bind_port: 3000
beta_bind_port: 0
users: []
auth_attempts: 5
block_auth_min: 15
http_proxy: ''
language: ''
debug_pprof: false
web_session_ttl: 720
dns:
  bind_hosts:
  - 0.0.0.0
  port: 3053
  statistics_interval: 90
  querylog_enabled: true
  querylog_file_enabled: false
  querylog_interval: 2160h
  querylog_size_memory: 1000
  anonymize_client_ip: false
  protection_enabled: true
  blocking_mode: default
  blocking_ipv4: ''
  blocking_ipv6: ''
  blocked_response_ttl: 10
  parental_block_host: family-block.dns.adguard.com
  safebrowsing_block_host: standard-block.dns.adguard.com
  ratelimit: 20
  ratelimit_whitelist: []
  refuse_any: true
  upstream_dns:
  - '[/lan/]127.0.0.1:53'
  - https://dns.cloudflare.com/dns-query
  - https://dns.google/dns-query
  upstream_dns_file: ''
  bootstrap_dns:
  - 1.1.1.1
  - 9.9.9.10
  - 2606:4700:4700::1111
  - 2620:fe::10
  all_servers: false
  fastest_addr: false
  fastest_timeout: 1s
  allowed_clients: []
  disallowed_clients: []
  blocked_hosts: []
  trusted_proxies:
  - 127.0.0.0/8
  - ::1/128
  cache_size: 4194304
  cache_ttl_min: 0
  cache_ttl_max: 0
  cache_optimistic: false
  bogus_nxdomain: []
  aaaa_disabled: false
  enable_dnssec: false
  edns_client_subnet: false
  max_goroutines: 300
  ipset: []
  filtering_enabled: true
  filters_update_interval: 24
  parental_enabled: false
  safesearch_enabled: false
  safebrowsing_enabled: false
  safebrowsing_cache_size: 1048576
  safesearch_cache_size: 1048576
  parental_cache_size: 1048576
  cache_time: 30
  rewrites: []
  blocked_services: []
  upstream_timeout: 10s
  private_networks: []
  use_private_ptr_resolvers: true
  local_ptr_upstreams:
  - 127.0.0.1:53
tls:
  enabled: false
  server_name: ''
  force_https: false
  port_https: 443
  port_dns_over_tls: 853
  port_dns_over_quic: 784
  port_dnscrypt: 0
  dnscrypt_config_file: ''
  allow_unencrypted_doh: false
  strict_sni_check: false
  certificate_chain: ''
  private_key: ''
  certificate_path: ''
  private_key_path: ''
filters:
- enabled: true
  url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt
  name: AdGuard DNS filter
  id: 1
- enabled: true
  url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_48.txt
  name: HaGeZi's Pro Blocklist
  id: 48
whitelist_filters: []
user_rules:
- '@@||v10.events.data.microsoft.com^'
- '@@||v20.events.data.microsoft.com^'
- '@@||win-global-asimov-leafs-events-data.trafficmanager.net^'
- '@@||vortex.data.microsoft.com^'
- '@@||vortex-win.data.microsoft.com^'
- '@@||pipe.aria.microsoft.com^'
- '@@||v10c.events.data.microsoft.com^'
- '@@||au-v10.events.data.microsoft.com^'
- '@@||eu-v10.events.data.microsoft.com^'
- '@@||jp-v10.events.data.microsoft.com^'
- '@@||us-v10.events.data.microsoft.com^'
- '@@||au-v20.events.data.microsoft.com^'
- '@@||eu-v20.events.data.microsoft.com^'
- '@@||in-v20.events.data.microsoft.com^'
- '@@||jp-v20.events.data.microsoft.com^'
- '@@||uk-v20.events.data.microsoft.com^'
- '@@||us-v20.events.data.microsoft.com^'
- '@@||us4-v20.events.data.microsoft.com^'
- '@@||us5-v20.events.data.microsoft.com^'
- '@@||watson.events.data.microsoft.com^'
- '@@||watson.telemetry.microsoft.com^'
dhcp:
  enabled: false
  interface_name: ''
  local_domain_name: lan
  dhcpv4:
    gateway_ip: ''
    subnet_mask: ''
    range_start: ''
    range_end: ''
    lease_duration: 86400
    icmp_timeout_msec: 1000
    options: []
  dhcpv6:
    range_start: ''
    lease_duration: 86400
    ra_slaac_only: false
    ra_allow_slaac: false
clients:
  runtime_sources:
    whois: true
    arp: true
    rdns: true
    dhcp: true
    hosts: true
  persistent: []
log_compress: false
log_localtime: false
log_max_backups: 0
log_max_size: 100
log_max_age: 3
log_file: ''
verbose: false
os:
  group: ''
  user: ''
  rlimit_nofile: 0
schema_version: 14
