# WAN 側（eth0）に届く近隣要請を LAN へ転送し、端末が応えたときだけ代理応答する。
#
# ひかり電話なしの本構成では PD が無く、上流は /64 を 1 つ「オンリンク」で
# 寄越すだけなので、LAN 側の端末は WAN セグメントに居ることになっている。
# 上流はその端末へ届ける前に eth0 で近隣要請を出すが、実体は br-lan の先に
# いるため、誰かが代理で応える必要がある。
#
# **odhcpd の `ndp relay` ではなく ndppd を使う理由。** odhcpd は端末が
# アドレスを作る瞬間（DAD）を捕まえて経路を入れる方式で、**一度取りこぼすと
# 二度と学習の機会が来ない**。ルータを再起動しても端末のアドレスは有効なまま
# ＝作り直さないので、MAC 由来の固定アドレス（サーバ類）は再起動のたびに
# IPv6 を失う（2026-09-20 に実機で再現。[openwrt/odhcpd#37] の形）。
# ndppd は学習せず、問い合わせが来るたびに転送して確かめるので影響されない。
#
# 転送そのものには経路が要る（ndppd 0.2.5 に autowire は無い）。
# /etc/hotplug.d/iface/91-lan-prefix-route が委譲された /64 を br-lan へ向ける。

proxy eth0 {
	# 代理応答にルータフラグを立てる。ここはルータなので yes。
	router yes

	# LAN からの近隣広告を待つ時間（ミリ秒）。
	timeout 500

	# 結果をキャッシュする時間（ミリ秒）。
	ttl 30000

	# **プレフィックスを書かない。** 上流から寄越される /64 は固定ではなく、
	# 本リポジトリはグローバルアドレスを設定ファイルへ書かない方針
	# （docs/development/N06-router.md）。グローバル空間を丸ごと対象にしても、
	# `iface` は **LAN の端末が実際に応えたときだけ**代理応答するため、
	# 自分の LAN に居ないアドレスを名乗ることはない。
	# eth0 に届く近隣要請は、そもそも上流が当方へ配る /64 のぶんだけ。
	rule 2000::/3 {
		iface br-lan
	}
}
