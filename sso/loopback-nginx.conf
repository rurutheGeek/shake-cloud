# curl resolves *.localhost to loopback even when Docker DNS supplies an address.
# Keep the canonical browser issuer and preserve end-to-end TLS verification.
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events {}
stream {
 server {
  listen 127.0.0.1:9443;
  proxy_pass 172.30.80.2:9443;
  proxy_connect_timeout 5s;
  proxy_timeout 60s;
 }
}
