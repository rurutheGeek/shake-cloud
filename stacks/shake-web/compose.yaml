# Shake-Web（公開サイト）の配備。旧 shakeserver（Raspberry Pi 5）から
# web-01 へ 2026-10-05 に移した。
#
# イメージはホストでビルドする（shake-web / pkhack は Next.js、alexa は Python）。
# 元ホストと同じく CI の成果物ではなくソースからのビルドなので、compose.lock.yaml
# は無い。土台のイメージはタグで固定し、更新は明示的に行う。
#
# ソースは STORAGE_ROOT/src/<リポジトリ>（manage.py fetch）に置き、nginx が配る
# 静的物だけ STORAGE_ROOT/{html,pkhack/html,ayahuya/html} へ写す（manage.py sync）。
name: shake-web

services:
  web:
    image: nginx:1.27-alpine
    container_name: shake_web
    restart: unless-stopped
    ports:
      # 公開は negitoroserver → この 80/443（80 は sslh が HTTP として中継）。
      # セキュリティグループが送信元を絞る。8443 は直接確認用で、ホストの
      # 127.0.0.1 にだけ出す（外からは見えない）。
      - '80:80'
      - '443:443'
      - '127.0.0.1:8443:8443'
    logging: &logging
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${STORAGE_ROOT}/html:/usr/share/nginx/html
      - ${STORAGE_ROOT}/pkhack/html:/usr/share/nginx/pkhack:ro   # pkhack サブドメイン（静的ハブ＋assets）
      - ${STORAGE_ROOT}/ayahuya/html:/usr/share/nginx/ayahuya:ro   # ayahuya サブドメイン（純静的）
      - ${STORAGE_ROOT}/log:/var/log/nginx
      - ${STORAGE_ROOT}/certs:/etc/nginx/certs:ro
      - ${STORAGE_ROOT}/templates:/etc/nginx/templates:ro
    depends_on:
      - quiz_app
      - pkhack_app

  quiz_app:
    build:
      context: ${STORAGE_ROOT}/src/shake-web/quiz
    image: shake-web-quiz:local
    container_name: bsquiz
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    ports:
      # デバッグ用。外へは出さない。
      - '127.0.0.1:3000:3000'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      - DB_USER=${DB_USER}
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=${DB_PORT}
      - SHAKE_SECRET=${SHAKE_SECRET}
      - IKURA_SECRET=${IKURA_SECRET}
      - QUIZ_SECRET=${QUIZ_SECRET:?run the playbook}
      - SHAKEWEB_DB_HOST=${SHAKEWEB_DB_HOST}
      - SHAKEWEB_DB_PORT=${SHAKEWEB_DB_PORT}
      - SHAKEWEB_DB_NAME=${SHAKEWEB_DB_NAME}
      - SHAKEWEB_DB_READER_USER=${SHAKEWEB_DB_READER_USER}
      - SHAKEWEB_DB_READER_PASSWORD=${SHAKEWEB_DB_READER_PASSWORD}
      - SHAKEWEB_DB_EDITOR_USER=${SHAKEWEB_DB_EDITOR_USER}
      - SHAKEWEB_DB_EDITOR_PASSWORD=${SHAKEWEB_DB_EDITOR_PASSWORD}
      - PKHACK_DB_HOST=${PKHACK_DB_HOST}
      - PKHACK_DB_PORT=${PKHACK_DB_PORT}
      - PKHACK_DB_NAME=${PKHACK_DB_NAME}
      - PKHACK_DB_READER_USER=${PKHACK_DB_READER_USER}
      - PKHACK_DB_READER_PASSWORD=${PKHACK_DB_READER_PASSWORD}
      - PKHACK_DB_EDITOR_USER=${PKHACK_DB_EDITOR_USER}
      - PKHACK_DB_EDITOR_PASSWORD=${PKHACK_DB_EDITOR_PASSWORD}

  alexa_skill:
    build:
      context: ${STORAGE_ROOT}/src/pokebs_alexaskill
    image: shake-web-alexa:local
    container_name: alexa_skill
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    ports:
      - '127.0.0.1:8010:8000'
    volumes:
      - ${STORAGE_ROOT}/alexa/logs:/app/logs

  # pkhack サブドメイン用 Next.js アプリ（ポケモンクイズ）。
  # nginx から pkhack_app:3000 で参照するためホストポートは公開しない（quiz_app と競合回避）。
  pkhack_app:
    build:
      context: ${STORAGE_ROOT}/src/pkhack/quiz
    image: shake-web-pkhack:local
    container_name: pkhack_app
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      - DB_USER=${DB_USER}
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=${DB_PORT}
      - QUIZ_SECRET=${QUIZ_SECRET:?run the playbook}
      - PKHACK_DB_HOST=${PKHACK_DB_HOST}
      - PKHACK_DB_PORT=${PKHACK_DB_PORT}
      - PKHACK_DB_NAME=${PKHACK_DB_NAME}
      - PKHACK_DB_READER_USER=${PKHACK_DB_READER_USER}
      - PKHACK_DB_READER_PASSWORD=${PKHACK_DB_READER_PASSWORD}
      - PKHACK_DB_EDITOR_USER=${PKHACK_DB_EDITOR_USER}
      - PKHACK_DB_EDITOR_PASSWORD=${PKHACK_DB_EDITOR_PASSWORD}
