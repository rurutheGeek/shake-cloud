# Shake-Web（公開サイト）の配備。DMZ の shakeserver（Raspberry Pi 5）で動かす
# （2026-10-05〜16 は web-01。消した）。
#
# アプリと静的物（quiz_app・pkhack_app・alexa_skill・ayahuya・shake_static・
# pkhack_static）は、各リポジトリの CI がビルドしたイメージ（GHCR）を使う。ホストでは
# ソースを取らず、ビルドもしない。タグ main を追い、manage.py pull が新しいイメージを
# 取ってくる。自作のイメージなので digest 固定はしない（nginx は compose.lock.yaml で
# 固定する）。入口の nginx（web）は TLS とドメインごとの振り分けだけを受け持つ。
name: shake-web

services:
  web:
    image: nginx:1.27-alpine
    container_name: shake_web
    restart: unless-stopped
    ports:
      # 公開は negitoroserver → この 80/443（80 は sslh が HTTP として中継）。
      # Flint 3 の DMZ と Tailscale の ACL（tag:relay → tag:dmz:80,443）が送信元を絞る。8443 は直接確認用で、ホストの
      # 127.0.0.1 にだけ出す（外からは見えない）。
      - '80:80'
      - '443:443'
      - '127.0.0.1:8443:8443'
    logging: &logging
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${STORAGE_ROOT}/log:/var/log/nginx
      - ${STORAGE_ROOT}/certs:/etc/nginx/certs:ro
      - ${STORAGE_ROOT}/templates:/etc/nginx/templates:ro
    depends_on:
      - quiz_app
      - pkhack_app
      - ayahuya
      - shake_static
      - pkhack_static

  # shake-web の html/（shake サブドメインの静的フロントと apex のランディング）。
  # nginx から shake_static:8080 で参照する。root 以外で動く nginx。
  shake_static:
    image: ${SHAKE_STATIC_IMAGE:-ghcr.io/ruruthegeek/shake-web-static:main}
    container_name: shake_static
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true

  # pkhack の html/（クイズハブの静的ランディングと assets）。
  # nginx から pkhack_static:8080 で参照する。root 以外で動く nginx。
  pkhack_static:
    image: ${PKHACK_STATIC_IMAGE:-ghcr.io/ruruthegeek/pkhack-static:main}
    container_name: pkhack_static
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true

  # ayahuya サブドメイン（純静的）。nginx から ayahuya:8080 で参照する。
  # イメージは root 以外で動く nginx（nginx-unprivileged）。
  ayahuya:
    image: ${AYAHUYA_IMAGE:-ghcr.io/ruruthegeek/ayahuya:main}
    container_name: ayahuya
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true

  quiz_app:
    image: ${SHAKE_WEB_IMAGE:-ghcr.io/ruruthegeek/shake-web:main}
    container_name: bsquiz
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    ports:
      # デバッグ用。外へは出さない。
      - '127.0.0.1:3000:3000'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      - DB_USER=${DB_USER}
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=${DB_PORT}
      - SHAKE_SECRET=${SHAKE_SECRET}
      - IKURA_SECRET=${IKURA_SECRET}
      - QUIZ_SECRET=${QUIZ_SECRET:?run the playbook}
      - SHAKEWEB_DB_HOST=${SHAKEWEB_DB_HOST}
      - SHAKEWEB_DB_PORT=${SHAKEWEB_DB_PORT}
      - SHAKEWEB_DB_NAME=${SHAKEWEB_DB_NAME}
      - SHAKEWEB_DB_READER_USER=${SHAKEWEB_DB_READER_USER}
      - SHAKEWEB_DB_READER_PASSWORD=${SHAKEWEB_DB_READER_PASSWORD}
      - SHAKEWEB_DB_EDITOR_USER=${SHAKEWEB_DB_EDITOR_USER}
      - SHAKEWEB_DB_EDITOR_PASSWORD=${SHAKEWEB_DB_EDITOR_PASSWORD}
      - PKHACK_DB_HOST=${PKHACK_DB_HOST}
      - PKHACK_DB_PORT=${PKHACK_DB_PORT}
      - PKHACK_DB_NAME=${PKHACK_DB_NAME}
      - PKHACK_DB_READER_USER=${PKHACK_DB_READER_USER}
      - PKHACK_DB_READER_PASSWORD=${PKHACK_DB_READER_PASSWORD}
      - PKHACK_DB_EDITOR_USER=${PKHACK_DB_EDITOR_USER}
      - PKHACK_DB_EDITOR_PASSWORD=${PKHACK_DB_EDITOR_PASSWORD}

  alexa_skill:
    image: ${ALEXA_IMAGE:-ghcr.io/ruruthegeek/pokebs-alexaskill:main}
    container_name: alexa_skill
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    ports:
      - '127.0.0.1:8010:8000'
    volumes:
      - ${STORAGE_ROOT}/alexa/logs:/app/logs

  # pkhack サブドメイン用 Next.js アプリ（ポケモンクイズ）。
  # nginx から pkhack_app:3000 で参照するためホストポートは公開しない（quiz_app と競合回避）。
  pkhack_app:
    image: ${PKHACK_IMAGE:-ghcr.io/ruruthegeek/pkhack:main}
    container_name: pkhack_app
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      - DB_USER=${DB_USER}
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=${DB_PORT}
      - QUIZ_SECRET=${QUIZ_SECRET:?run the playbook}
      - PKHACK_DB_HOST=${PKHACK_DB_HOST}
      - PKHACK_DB_PORT=${PKHACK_DB_PORT}
      - PKHACK_DB_NAME=${PKHACK_DB_NAME}
      - PKHACK_DB_READER_USER=${PKHACK_DB_READER_USER}
      - PKHACK_DB_READER_PASSWORD=${PKHACK_DB_READER_PASSWORD}
      - PKHACK_DB_EDITOR_USER=${PKHACK_DB_EDITOR_USER}
      - PKHACK_DB_EDITOR_PASSWORD=${PKHACK_DB_EDITOR_PASSWORD}
