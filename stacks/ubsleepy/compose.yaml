# Discord Bot「UBSLEEPY」を apps-01 に単独で置く。
#
# 本体は公開リポジトリ rurutheGeek/UBSLEEPY。manage.py update が main を
# SOURCE_ROOT へ取得し、そのままコンテナへ渡す（旧ホストと同じ動かし方）。
# Bot が書き換えるファイルは Git の外の STORAGE_ROOT/state に置き、コードの更新で
# 触れないよう上から重ねる。対象は manage.py の STATE と揃える。
# イメージは compose.lock.yaml でダイジェスト固定する。
name: ubsleepy

services:
  bot:
    image: python:3.13
    restart: unless-stopped
    working_dir: /app
    environment:
      # トークンは secrets/discord_token から manage.py が環境変数で渡す。
      DISCORD_TOKEN: ${DISCORD_TOKEN:?run manage.py up}
    volumes:
      - ${STORAGE_ROOT:-/srv/ubsleepy}/source:/app
      - ${STORAGE_ROOT:-/srv/ubsleepy}/state/save:/app/save
      - ${STORAGE_ROOT:-/srv/ubsleepy}/state/log:/app/log
      - ${STORAGE_ROOT:-/srv/ubsleepy}/state/config.json:/app/config.json
      - ${STORAGE_ROOT:-/srv/ubsleepy}/state/resource/pokemon_senryu.csv:/app/resource/pokemon_senryu.csv
      - ${STORAGE_ROOT:-/srv/ubsleepy}/state/resource/image:/app/resource/image
    command:
      - bash
      - -c
      - pip install --no-cache-dir -r setup/requirements.txt && python main.py
