# Discord Bot「UBSLEEPY」(-next) の配備。
#
# イメージは GitHub Actions が main のマージ時に GHCR へ出す
# ghcr.io/ruruthegeek/ubsleepy-next:<コミットID> を、compose.lock.yaml の
# digest で固定して使う（どの digest かはGitでレビューする）。
# apps-01 ではビルドしない（setup/Dockerfile は CI 用）。
# セーブデータは STORAGE_ROOT/state から重ねる。
name: ubsleepy

services:
  bot:
    image: ${UBSLEEPY_NEXT_IMAGE:-ghcr.io/ruruthegeek/ubsleepy-next}
    restart: unless-stopped
    working_dir: /app
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:?run the playbook}
      PKDB_PASSWORD: ${PKDB_PASSWORD:?run the playbook}
      UBSLEEPY_DB_PASSWORD: ${UBSLEEPY_DB_PASSWORD:?run the playbook}
      UBSLEEPY_DB_NAME: ${UBSLEEPY_DB_NAME:-ubsleepy}
    volumes:
      - ${STORAGE_ROOT:-/srv/ubsleepy-next}/state/save:/app/save
      - ${STORAGE_ROOT:-/srv/ubsleepy-next}/state/log:/app/log
      - ${STORAGE_ROOT:-/srv/ubsleepy-next}/state/config.json:/app/config.json
      - ${STORAGE_ROOT:-/srv/ubsleepy-next}/state/resource/pokemon_senryu.csv:/app/resource/pokemon_senryu.csv
      - ${STORAGE_ROOT:-/srv/ubsleepy-next}/state/resource/image:/app/resource/image
    command:
      - python
      - main.py
