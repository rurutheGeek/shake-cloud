<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Botポータル{% endblock %}</title>
<style>
  :root {
    color-scheme: light;
    --ink: #1c1e21; --muted: #5b6472; --line: #d9dee7;
    --bg: #f4f6f9; --card: #ffffff;
    --primary: #2563eb; --primary-dark: #1d4ed8;
    --danger: #dc2626; --danger-dark: #b91c1c;
    --ok: #15803d; --warn: #b45309; --ng: #b42318;
  }
  * { box-sizing: border-box; }
  body { font-family: system-ui, "Segoe UI", sans-serif; margin: 0; background: var(--bg); color: var(--ink); }
  header { background: #16213c; color: #fff; padding: 0.75rem 1.25rem; display: flex; gap: 1.25rem; align-items: center; }
  header .brand { font-size: 1.1rem; font-weight: 700; color: #fff; text-decoration: none; }
  header nav a { color: #c7d2fe; text-decoration: none; margin-right: 1rem; font-size: 0.95rem; }
  header nav a:hover { color: #fff; text-decoration: underline; }
  header .user { margin-left: auto; font-size: 0.9rem; opacity: 0.9; }
  main { padding: 1.5rem; max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 0.3rem; }
  h2 { font-size: 1.15rem; margin: 0 0 0.6rem; }
  p { line-height: 1.6; }
  a { color: var(--primary); }
  .lead { color: var(--muted); margin-bottom: 1.2rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 1.1rem 1.2rem; margin-bottom: 1.1rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1rem; }
  .service-card { display: flex; flex-direction: column; gap: 0.5rem; }
  .service-card h2 { margin: 0; font-size: 1.1rem; }
  .service-card h2 a { text-decoration: none; }
  .service-card h2 a:hover { text-decoration: underline; }
  .service-card .desc { color: var(--muted); font-size: 0.92rem; min-height: 2.6em; }
  .pill { display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.15rem 0.6rem; border-radius: 999px; font-size: 0.8rem; font-weight: 700; color: #fff; }
  .pill.running { background: var(--ok); }
  .pill.exited, .pill.missing, .pill.unknown, .pill.dead { background: var(--ng); }
  .pill.created, .pill.restarting, .pill.paused { background: var(--warn); }
  .meta { color: var(--muted); font-size: 0.85rem; }
  .meta code { background: #eef2f7; padding: 0.05rem 0.3rem; border-radius: 4px; }
  .actions { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: flex-start; }
  .action { display: flex; flex-direction: column; gap: 0.2rem; max-width: 220px; }
  .action .hint { font-size: 0.75rem; color: var(--muted); }
  button { font: inherit; border: 0; border-radius: 6px; padding: 0.55rem 0.95rem; cursor: pointer; font-weight: 700; }
  button.primary { background: var(--primary); color: #fff; }
  button.primary:hover { background: var(--primary-dark); }
  button.danger { background: var(--danger); color: #fff; }
  button.danger:hover { background: var(--danger-dark); }
  button.neutral { background: #475569; color: #fff; }
  button.neutral:hover { background: #334155; }
  label.confirm { display: flex; gap: 0.35rem; align-items: center; font-size: 0.8rem; color: var(--danger); font-weight: 700; }
  pre { background: #0f172a; color: #e2e8f0; padding: 0.9rem; border-radius: 6px; overflow: auto; max-height: 60vh; font-size: 0.82rem; line-height: 1.45; white-space: pre-wrap; word-break: break-all; }
  .result { border-left: 5px solid var(--ok); background: #f0fdf4; padding: 0.7rem 0.9rem; border-radius: 0 6px 6px 0; margin-bottom: 1rem; white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 0.85rem; }
  .result.fail { border-color: var(--danger); background: #fef2f2; }
  .checks { margin: 0; padding-left: 1.2rem; }
  .checks li { margin-bottom: 0.45rem; line-height: 1.5; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 0.5rem 0.6rem; border-bottom: 1px solid var(--line); font-size: 0.9rem; }
  th { color: var(--muted); font-weight: 600; }
  form.inline { display: inline; }
  .toolbar { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; margin-bottom: 0.7rem; }
  .toolbar input[type=number] { width: 6rem; padding: 0.35rem; border: 1px solid var(--line); border-radius: 5px; }
  .legend { display: flex; gap: 1rem; flex-wrap: wrap; color: var(--muted); font-size: 0.85rem; }
</style>
</head>
<body>
<header>
  <a class="brand" href="/">Botポータル</a>
  <nav>
    <a href="/">サービス一覧</a>
    <a href="/audit">操作履歴</a>
  </nav>
  <span class="user">{{ user }} でログイン中</span>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
