# Botポータルに表示するサービス。ここを増やすと画面が増える。
# actions は manage.py の定型操作（status/update/up/down/backup）と restart だけ許可される。
# help / checks は画面にそのまま出る（何をするBotか・どう確認するか）。
services:
  - name: ubsleepy
    title: UBSLEEPY（本番・おねむなbot【研修中】）
    description: 公開Discord Bot。図鑑・クイズ・日替わり投稿・おこづかい・IDくじ。イメージ固定で配備。
    container: ubsleepy-bot-1
    project_dir: /opt/ubsleepy
    source_dir: ''
    actions: [restart, status, up, down, backup]
    db:
      kind: postgres
      container: pkdb-db-1
      database: ubsleepy
      user: ubsleepy_reader
      quiz_log: true
    links:
      - label: Discordで見る（おねむなbot【研修中】）
        url: https://discord.com/users/1140784885557112873
      - label: 招待URL（サーバーに追加）
        url: https://discord.com/oauth2/authorize?client_id=1140784885557112873&scope=bot+applications.commands&permissions=268553280
      - label: GitHub（UBSLEEPY-next）
        url: https://github.com/rurutheGeek/UBSLEEPY-next
      - label: プライバシーポリシー
        url: https://ruruthegeek.github.io/UBSLEEPY-next/privacy.html
      - label: 利用規約
        url: https://ruruthegeek.github.io/UBSLEEPY-next/terms.html
    help: |
      本番サーバー向けのBotです。イメージはGHCRの固定digest（compose.lock.yaml）で、apps-01ではビルドしません。
      セーブデータ（おこづかい・クジびきけん・クイズ戦績）はPostgreSQL（ubsleepy DB）で、全サーバー共通です。
      設定（チャンネル・ロール）はDiscordの /channel /role からDBへ保存されます（config.jsonは既定値）。
      「起動」はイメージをpullしてから起動します。digestの更新はGit（shake-cloud）で行います。
    checks:
      - "本番サーバーで `/help` `/dex ピカチュウ` `/search みず 合計<400` が動くか。"
      - "`/q` でクイズを出題し、ポケモン名をリプライして正誤判定・ヒント・ギブが動くか。"
      - "`/quizrecord` で戦績と苦手な問題、`/pocketmoney` で残高・ランキングが出るか。"
      - "`/channel`（引数なし）で投稿先が見えるか。日替わり投稿・IDくじが動くか。"
      - この画面のログに警告以上が出ていないか（通常ログはdocker logsにだけ出ます）。

  - name: circleauth
    title: CIRCLEAUTH（本番・サークル認証）
    description: 学籍番号の照合・ロール付与・入室案内・通話通知。
    container: circleauth-bot-1
    project_dir: /opt/circleauth
    source_dir: /srv/circleauth/source
    actions: [restart, status, update, up, down, backup]
    db:
      kind: sqlite
      path: /srv/circleauth/state/save/auth.sqlite3
    links:
      - label: Discordで見る（CIRCLEAUTH）
        url: https://discord.com/users/1556306139849957616
      - label: 招待URL（サーバーに追加）
        url: https://discord.com/oauth2/authorize?client_id=1556306139849957616&scope=bot+applications.commands&permissions=268561408
      - label: GitHub（CIRCLEAUTH・非公開）
        url: https://github.com/rurutheGeek/CIRCLEAUTH
    help: |
      サークル向けの認証Botです。名簿・認証ログ・通話ログはSQLite
      （/srv/circleauth/state/save/auth.sqlite3）にあります。
      図鑑・クイズはUBSLEEPY側です。
    checks:
      - テストサーバーで新しいアカウントを参加させ、ロール（UNKNOWN_ROLE_ID）が付いて案内メッセージが出るか。
      - 案内の「メンバー認証」ボタン→学籍番号7桁（例 J111111）を送信→「照合に成功しました」と表示され、ロールが外れるか。
      - ポータルのDBタブ（account）で、該当のDiscordユーザーに学籍番号・好きなポケモンが入るか。
      - ポータルのDBタブ（auth_log）に1行増えるか。
      - "ボイスチャンネルに入って通話通知が出るか。`/calltitle` でタイトル変更、`/invite` で招待DM。"
      - "メンバー管理者がBotへDMで名簿を添付すると、取り込み結果がDMで返るか。"
      - "名簿から外れた人にOBOGロールが付き、在籍に戻ると外れるか（OBOG_ROLE_IDの設定が必要）。"
      - "OBOGに変わった本人へDM通知が届くか（すでにOBOGの人には再送されない）。"

  - name: ubsleepy-next
    title: UBSLEEPY（テスト・ねてばかりだったBot）
    description: 本番と同じコードをdebugで動かす開発用。セーブはubsleepy_test。使うときだけ起動。
    container: ubsleepy-next-bot-1
    project_dir: /opt/ubsleepy-next
    source_dir: ''
    actions: [restart, status, up, down]
    debug: true
    db:
      kind: postgres
      container: pkdb-db-1
      database: ubsleepy_test
      user: ubsleepy_reader
      quiz_log: true
    links:
      - label: Discordで見る（ねてばかりだったBot）
        url: https://discord.com/users/1076387439410675773
      - label: 招待URL（サーバーに追加）
        url: https://discord.com/oauth2/authorize?client_id=1076387439410675773&scope=bot+applications.commands&permissions=268553280
      - label: GitHub（UBSLEEPY-next）
        url: https://github.com/rurutheGeek/UBSLEEPY-next
    help: |
      開発・テスト用です。本番と同じイメージ（固定digest）を、テストトークン・debugモード・
      ubsleepy_test で動かします。ふだんは停止しておき、開発するときだけ「起動」します。
      デバッグ欄からDiscordなしでコマンドを試せます（q → hint → give のように複数行で）。
    checks:
      - "テストサーバー（エーテルル財団）で `/help` `/dex` `/search` が動くか。"
      - デバッグ欄で `sources` を実行し、図鑑pkdb・セーブDB(ubsleepy_test)と出るか。
      - "`q bq` → `hint ヒント` → `give` で出題・ヒント・答えが出るか。"
