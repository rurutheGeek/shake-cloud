# pkdb の認証。イメージ既定との違いは、外から来る postgres（スーパーユーザ）を
# 拒否する1点だけ。管理はコンテナ内の psql（local、trust）と、Docker ネットワークの
# Adminer（172.16.0.0/12）から行う。docker compose は `hba_file=` でこのファイルを読む。
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
local   replication     all                                     trust
host    replication     all             127.0.0.1/32            trust
host    replication     all             ::1/128                 trust
# Docker ネットワーク（Adminer・登録画面）の postgres は許可する
host    all             postgres        172.16.0.0/12           scram-sha-256
# LAN・tailnet から来る postgres は拒否する
host    all             postgres        0.0.0.0/0               reject
host    all             postgres        ::/0                    reject
host    all             all             0.0.0.0/0               scram-sha-256
host    all             all             ::/0                    scram-sha-256
