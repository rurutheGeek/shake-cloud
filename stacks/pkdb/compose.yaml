# ポケモン系のPostgreSQL（sleepy_pkdb・shakeweb・pkhack）を apps-01 に単独で置く。
#
# 旧ホスト（aarch64）の PostgreSQL 15 から論理ダンプで移した。版は旧ホストと同じ
# 15 系・Alpine に揃え、版上げを移行と同時に行わない。照合順序（en_US.utf8）の
# 並びも旧ホストと同じ musl のものになる。
# イメージは compose.lock.yaml でダイジェスト固定する。
name: pkdb

services:
  db:
    image: postgres:15.15-alpine
    restart: unless-stopped
    environment:
      # 旧ホストと同じ UTC のままにする（initdb が TZ から timezone を決める）。
      TZ: UTC
      # 空のサーバを初期化するときの管理者パスワード。secrets/ から Compose secret で
      # 渡す。manage.py restore が、全ロール（postgres を含む）をダンプのハッシュへ揃える。
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - ${STORAGE_ROOT:-/srv/pkdb}/data:/var/lib/postgresql/data
    ports:
      # 既定は 127.0.0.1。LAN の別ホストから使うときだけ配備側で広げ、
      # 送信元はセキュリティグループで絞る。
      - '${PKDB_BIND_ADDRESS:-127.0.0.1}:${PKDB_PORT:-5432}:5432'
    secrets:
      - postgres_password
    healthcheck:
      # 初期化中の一時サーバ（ソケットのみ）を健全と見なさないよう TCP で確かめる。
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, postgres]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  # 管理画面。LAN へ出すのは HTTPS 入口（Caddy）だけにし、Authentik の
  # Forward Auth（admins のみ）を前に置く。DBのログインはその後に別途要る。
  adminer:
    image: adminer:6.1.1
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - '127.0.0.1:${PKDB_ADMINER_PORT:-8330}:8080'
    depends_on:
      db:
        condition: service_healthy

  # ポケモンの登録画面（1ページ）。Adminer と同じイメージの PHP で entry/index.php を
  # 配るだけで、登録の中身は sql/entry.sql の関数が持つ。LAN へ出すのは HTTPS 入口
  # （Caddy）だけにし、Authentik の Forward Auth を前に置く。
  entry:
    image: adminer:6.1.1
    restart: unless-stopped
    entrypoint: [php]
    command: ['-S', '0.0.0.0:8080', '-t', /app]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    environment:
      PKDB_ENTRY_HOST: db
      PKDB_ENTRY_DATABASE: sleepy_pkdb
      PKDB_ENTRY_USER: pkdb_entry
      # manage.py が secrets/entry_password から環境変数で渡す。
      PKDB_ENTRY_PASSWORD: ${PKDB_ENTRY_PASSWORD:?run manage.py up}
    volumes:
      - ./entry:/app:ro
    ports:
      - '127.0.0.1:${PKDB_ENTRY_PORT:-8331}:8080'
    depends_on:
      db:
        condition: service_healthy

secrets:
  postgres_password:
    file: ./secrets/postgres_password
