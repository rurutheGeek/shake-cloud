name: media-nextcloud

x-nextcloud-env: &nextcloud-env
  TZ: ${TZ:-Asia/Tokyo}
  POSTGRES_HOST: postgres
  POSTGRES_DB: nextcloud
  POSTGRES_USER: nextcloud
  POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
  REDIS_HOST: redis
  NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-admin}
  NEXTCLOUD_ADMIN_PASSWORD_FILE: /run/secrets/nextcloud_admin_password
  NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_TRUSTED_DOMAINS:-localhost 127.0.0.1}
  NEXTCLOUD_DATA_DIR: /var/www/data

x-nextcloud-volumes: &nextcloud-volumes
  - ${STORAGE_ROOT:-/srv/media-stack/storage}/nextcloud/html:/var/www/html
  - ${STORAGE_ROOT:-/srv/media-stack/storage}/nextcloud/config:/var/www/html/config
  - ${STORAGE_ROOT:-/srv/media-stack/storage}/nextcloud/data:/var/www/data
  - ${LIBRARY_ROOT:-/srv/media-stack/library}/books:/library/books
  - ${LIBRARY_ROOT:-/srv/media-stack/library}/music:/library/music
  - ${LIBRARY_ROOT:-/srv/media-stack/library}/docs:/docs
  - ${LIBRARY_ROOT:-/srv/media-stack/library}/inbox:/library/inbox

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - ${STORAGE_ROOT:-/srv/media-stack/storage}/postgres:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U nextcloud -d nextcloud']
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    command: [redis-server, --save, '', --appendonly, 'no']
    networks: [backend]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 12

  nextcloud:
    image: ${NEXTCLOUD_IMAGE:-nextcloud:33-apache}
    restart: unless-stopped
    environment: *nextcloud-env
    secrets: [postgres_password, nextcloud_admin_password]
    volumes: *nextcloud-volumes
    ports: ['${BIND_ADDRESS:-127.0.0.1}:${NEXTCLOUD_PORT:-8080}:80']
    networks: [backend, nextcloud]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, php, -r, "exit(strpos(file_get_contents('http://127.0.0.1/status.php'), '\"installed\":true') === false ? 1 : 0);"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 60s

  cron:
    image: ${NEXTCLOUD_IMAGE:-nextcloud:33-apache}
    restart: unless-stopped
    entrypoint: /cron.sh
    environment: *nextcloud-env
    secrets: [postgres_password, nextcloud_admin_password]
    volumes: *nextcloud-volumes
    networks: [backend, nextcloud]
    depends_on:
      nextcloud: {condition: service_healthy}

networks:
  backend: {internal: true}
  nextcloud: {}

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  nextcloud_admin_password:
    file: ./secrets/nextcloud_admin_password
