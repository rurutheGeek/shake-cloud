# FreshRSS（共通RSSタイムライン）を media-01 に単独で置く。
#
# 認証は identity（Authentik）へのネイティブ OIDC。購読リストは同梱の
# SharedFeeds 拡張が全ユーザーで共有する（追加・削除をその場で同報）。
# 秘密値は .env ではなく secrets/ から manage.py が環境変数で渡す。
# イメージは compose.lock.yaml でダイジェスト固定する。
name: media-freshrss

services:
  freshrss:
    image: ${FRESHRSS_IMAGE:-freshrss/freshrss:latest}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Tokyo}
      CRON_MIN: ${FRESHRSS_CRON_MIN:-2,17,32,47}
      BASE_URL: ${FRESHRSS_BASE_URL:?run manage.py up}
      # 初回起動時だけ使う自動インストール。data/config.php があれば再実行されない。
      FRESHRSS_INSTALL: |-
        --default-user ${FRESHRSS_DEFAULT_USER:-akadmin}
        --auth-type http_auth
        --base-url ${FRESHRSS_BASE_URL}
        --language ja
        --api-enabled
      FRESHRSS_USER: |-
        --user ${FRESHRSS_DEFAULT_USER:-akadmin}
        --password ${FRESHRSS_DEFAULT_PASSWORD:?run manage.py up}
        --api-password ${FRESHRSS_DEFAULT_API_PASSWORD:?run manage.py up}
        --language ja
        --no-default-feeds
      # ネイティブ OIDC。コールバックは https://<name>/i/oidc/。
      # 対応するのは Debian 版イメージ（Alpine 版は非対応）。
      # 秘密値がまだ無い初回配備では 0 のまま起動し、media-freshrss-sso.yml が
      # secrets/oidc_client.json を置いて manage.py up を再実行すると有効になる。
      OIDC_ENABLED: ${FRESHRSS_OIDC_ENABLED:-0}
      OIDC_PROVIDER_METADATA_URL: ${FRESHRSS_OIDC_PROVIDER_METADATA_URL:-}
      OIDC_CLIENT_ID: ${FRESHRSS_OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${FRESHRSS_OIDC_CLIENT_SECRET:-}
      OIDC_CLIENT_CRYPTO_KEY: ${FRESHRSS_OIDC_CRYPTO_KEY:-}
      OIDC_REMOTE_USER_CLAIM: preferred_username
      # Caddy が付ける転送ヘッダーから戻り URL を作る。
      OIDC_X_FORWARDED_HEADERS: X-Forwarded-Proto X-Forwarded-Host X-Forwarded-Port
      OIDC_SCOPES: openid profile email
      # Caddy は media-01 のホスト（host ネットワーク）から 127.0.0.1 経由で、
      # コンテナ間は docker bridge で届く。それ以外の送信元は信頼しない。
      TRUSTED_PROXY: 127.0.0.0/8 172.16.0.0/12
    volumes:
      - ${STORAGE_ROOT:-/srv/media-stack/storage}/freshrss/data:/var/www/FreshRSS/data
      # SharedFeeds 拡張。本体の更新と混ざらないよう、リポジトリ側で版管理する。
      - ./extensions:/var/www/FreshRSS/extensions:ro
    ports:
      # サービス自身のポートは 127.0.0.1 のまま。LAN へ出すのは Caddy だけ。
      - '127.0.0.1:${FRESHRSS_PORT:-8082}:80'
    healthcheck:
      # /api/ は OIDC 保護の外。API を有効にしているのでこの検査が使える。
      test: [CMD, cli/health.php]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
