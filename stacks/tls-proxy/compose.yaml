# 各ホストの HTTPS の入口（Caddy）。証明書は Let's Encrypt から DNS-01 で取り、
# 同じホストの 127.0.0.1 で待つサービスへ中継する。インターネットには公開しない。
# 受ける名前は platform/terraform/dns.yaml から tls_proxy ロールが conf/Caddyfile に書く。
name: tls-proxy
services:
  caddy:
    build: .
    image: shakecloud-tls-proxy:local
    restart: unless-stopped
    # 中継先は 127.0.0.1 に閉じたポートなので、ホストのネットワークへ直接つなぐ。
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ['no-new-privileges:true']
    tmpfs: [/tmp]
    secrets: [cloudflare_dns_api_token]
    volumes:
      - ./conf:/etc/caddy:ro
      # 証明書と ACME のアカウント。消すと取り直しになる（Let's Encrypt には回数制限がある）。
      - ${STORAGE_ROOT:-./storage}/data:/data
      - ${STORAGE_ROOT:-./storage}/config:/config
secrets:
  cloudflare_dns_api_token: {file: ./secrets/cloudflare_dns_api_token}
