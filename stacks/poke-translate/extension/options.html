<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ポケモン翻訳の設定</title>
<style>
body { font: 14px/1.6 system-ui, sans-serif; margin: 16px; min-width: 320px; }
label { display: block; margin: 0 0 12px; }
input, select { display: block; width: 100%; margin-top: 4px; padding: 4px 6px; font: inherit; }
#result { min-height: 1.5em; }
</style>
</head>
<body>
<label>訳先の言語
  <select id="target">
    <option value="ja">日本語</option><option value="en">English</option>
    <option value="ko">한국어</option><option value="zh-TW">繁體中文</option>
    <option value="zh-CN">简体中文</option><option value="fr">Français</option>
    <option value="de">Deutsch</option><option value="es">Español</option>
    <option value="it">Italiano</option>
  </select>
</label>
<button id="save" type="button">保存</button>
<p id="result"></p>
<script src="options.js"></script>
</body>
</html>
