# blackbox_exporter の probe 定義。
modules:
  # 到達性の確認。ログインリダイレクト（302）や認証要求（401/403）も
  # 「サービスは生きている」とみなす。5xxは失敗のまま。
  https_reachable:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      valid_http_versions: [HTTP/1.1, HTTP/2.0]
      fail_if_not_ssl: true
      valid_status_codes: [200, 201, 202, 204, 301, 302, 303, 307, 308, 401, 403]
  http_2xx:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
