# アラート規則。通知は Alertmanager（SMTP）が行う。
groups:
  - name: availability
    rules:
      - alert: ServiceProbeFailed
        expr: probe_success == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} が応答しない"
          description: "blackbox probe が5分間失敗しています。"

      - alert: CertificateExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 14
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} の証明書が14日以内に期限切れ"
          description: "Let's Encrypt の更新経路（Caddy）を確認してください。"

  - name: nodes
    rules:
      # VM が落ちたか node_exporter が死ぬと node_* が静かに消える。それを防ぐ。
      - alert: NodeExporterDown
        expr: up{job="node"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} の node_exporter が応答しない"
          description: "VM の停止か node_exporter の異常です。pve_up と合わせて確認してください。"

      # /srv/bulk（6TB HDD）は下の storage グループで専用に鳴らす。
      - alert: NodeFilesystemAlmostFull
        expr: >-
          (node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs|iso9660",mountpoint!="/srv/bulk"}
          / node_filesystem_size_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs|iso9660",mountpoint!="/srv/bulk"})
          < 0.15
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} の {{ $labels.mountpoint }} の空きが15%未満"
          description: "イメージ・ログ・世代を確認してください（読み取り専用マウントは除外）。"

      - alert: NodeMemoryLow
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) < 0.10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} の空きメモリが10%未満"
          description: "プロセスを絞るか、配分（flavor・memory_mib）を見直してください。"

      - alert: NodeOOMKill
        expr: increase(node_vmstat_oom_kill[30m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} でOOM killが発生"
          description: "30分以内にカーネルがプロセスを強制終了しました。dmesg を確認してください。"

      - alert: NodeSystemdUnitFailed
        expr: node_systemd_unit_state{state="failed"} == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} の {{ $labels.name }} が failed"
          description: "systemctl status {{ $labels.name }} で原因を確認してください。"

      # 計画外の再起動は uptime の途切れではなく起動時刻の変化で見る。
      - alert: NodeRebooted
        expr: changes(node_boot_time_seconds[1h]) > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} が再起動した"
          description: "1時間以内にカーネルの起動時刻が変わりました。計画外なら原因を確認してください。"

  - name: backup
    rules:
      # 収集が止まると式が空になるので、欠測そのものを鳴らす。
      - alert: CloudBackupMetricMissing
        expr: absent(backup_last_success_timestamp_seconds)
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "管理DBバックアップのメトリクスが無い"
          description: "cloud-01 の textfile collector に cloud_backup.prom がありません。"

      - alert: CloudBackupStale
        expr: time() - backup_last_success_timestamp_seconds > 36 * 3600
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "管理DBバックアップが36時間以上成功していない"
          description: "cloud-backup.timer の失敗・停止を確認してください（世代は残っています）。"

  - name: storage
    rules:
      # 6TB HDD（/srv/bulk）はUSB接続。落ちると node_* のfsが消える。
      - alert: BulkDiskUnmounted
        expr: >-
          absent(node_filesystem_avail_bytes{instance="192.168.10.10:9100",mountpoint="/srv/bulk"})
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "6TB HDD（/srv/bulk）が見えない"
          description: "USBの切断かマウント失敗です。dmesg・lsblk・findmntを確認し、mount /srv/bulk と exportfs -ra で戻してください（docs/operations/bulk-storage.md）。"

      - alert: BulkDiskAlmostFull
        expr: >-
          (node_filesystem_avail_bytes{instance="192.168.10.10:9100",mountpoint="/srv/bulk"}
          / node_filesystem_size_bytes{instance="192.168.10.10:9100",mountpoint="/srv/bulk"})
          < 0.10
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "6TB HDDの空きが10%未満"
          description: "vzdumpの世代（keep-last=4）とライブラリの増加を確認してください。"

      - alert: SmartDeviceUnhealthy
        expr: smartmon_device_smart_healthy == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.disk }} のSMART自己診断がFAILED"
          description: "ディスク交換を検討してください。先にバックアップの状態を確認してください。"

      # USBの切断・スピンダウン・ブリッジ不調でSMARTが読めなくなる。
      - alert: SmartDeviceInactive
        expr: smartmon_device_active == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.disk }} のSMARTが読めない"
          description: "dmesg と smartctl -a -d sat を確認してください。USBの挿し直しで戻ることがあります。"

      - alert: SmartSectorErrors
        expr: >-
          smartmon_current_pending_sector_raw_value > 0
          or smartmon_offline_uncorrectable_raw_value > 0
          or increase(smartmon_reallocated_sector_ct_raw_value[24h]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.disk }} に不良・代替処理待ちセクター"
          description: "増加が続くなら交換時期です。バックアップを確認してください。"

      # CRCはケーブル・ポート・enclosure側で増える。USBで起きやすい。
      - alert: SmartCableErrors
        expr: increase(smartmon_udma_crc_error_count_raw_value[24h]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.disk }} のCRCエラーが増加"
          description: "USBケーブル・ポート・enclosureを確認してください（UAS無効化の判断材料）。"

      - alert: SmartTemperatureHigh
        expr: smartmon_temperature_celsius_raw_value > 50
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.disk }} が50℃超"
          description: "風通しと連続アクセスを確認してください。"

      # 収集が止まると式が空になるので、欠測そのものを鳴らす。
      - alert: SmartCollectorStale
        expr: absent(smartmon_smartctl_run) or time() - smartmon_smartctl_run > 3600
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "SMART収集が1時間以上止まっている"
          description: "prometheus-node-exporter-smartmon.timer を確認してください。"

      - alert: NvmeWearHigh
        expr: nvme_percentage_used_ratio > 0.80
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "NVMeの寿命消費が80%超"
          description: "書き込みの多い処理とバックアップ世代数を見直してください。"

  - name: deadman
    rules:
      # 常時 firing。Alertmanager から外部のdead man's switchへ送り続け、
      # 「12時間届かなければ監視系が死んでいる」と外部で判定する。
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: "監視経路は生きている"
          description: "この通知が外部で途切れたら、Prometheus か Alertmanager を疑ってください。"

  - name: resources
    rules:
      - alert: ProxmoxGuestDown
        expr: pve_up == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.id }} が停止または応答なし"
          description: "Proxmox API から見てゲストが up ではありません。"

      # ホストの空きが乏しくなると、VM の作成・起動が capacity で断られる。
      - alert: ProxmoxNodeMemoryHigh
        expr: >-
          (
            pve_memory_usage_bytes{id=~"node/.+"}
            / pve_memory_size_bytes{id=~"node/.+"}
          ) > 0.90
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Proxmox ノード {{ $labels.id }} のメモリ使用率が90%超"
          description: "ゲストの配分か常駐プロセスを見直してください。Grafanaの「Shake Lab VM memory」で内訳を確認できます。"

      - alert: UpsOnBattery
        expr: network_ups_tools_ups_status{value="OB"} == 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "UPSがバッテリー動作中"
          description: "停電か入力異常です。残り時間を確認してください。"

      - alert: ProxmoxNodeDiskAlmostFull
        expr: pve_disk_usage_bytes / pve_disk_size_bytes > 0.85
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.id }} のディスク使用率が85%超"
          description: "不要なイメージ・バックアップ・キャッシュを確認してください。"
