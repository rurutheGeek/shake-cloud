# node_exporter を入れたホスト。media-01 と game1 は SG/OS の都合で入れず、
# Proxmox 側（pve-exporter）の資源で見る。
# 192.168.10.10 は Proxmox ホスト。pve-exporter の資源に加えて、デバイス別の
# I/O・ファイルシステム・SMART（smartmon_*）を読む（platform/ansible/pve-node-exporter.yml）。
- targets:
    - 192.168.10.10:9100
    - 192.168.10.200:9100
    - 192.168.10.204:9100
    - 192.168.10.205:9100
    - 192.168.10.206:9100
    - 192.168.10.102:9100
  labels:
    group: platform
