name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    # The cloud API's integration tests create and drop one database per test.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Install documentation and lint dependencies
        run: python3 -m pip install -r stacks/hub/requirements.txt -r tools/requirements.txt
      # The suite skips the ansible-playbook --syntax-check tests when the
      # binary is missing, so CI has to install it to keep those guards alive.
      - name: Install Ansible for the playbook syntax checks
        run: python3 -m pip install -r platform/ansible/requirements.txt
      - name: Run unit tests
        run: python3 -m unittest discover -s tests
      - name: Compile tracked Python and parse YAML
        run: |
          python3 - <<'PY'
          import pathlib,py_compile,subprocess,yaml
          for name in subprocess.check_output(['git','ls-files','-z'],text=True).split('\0'):
              if name.endswith('.py'):
                  py_compile.compile(name,doraise=True)
              if name.endswith(('.yaml','.yml')):
                  # Flux のマニフェストは `---` 区切りの複数ドキュメント。safe_load は
                  # 単一ドキュメントしか受け付けないので safe_load_all を使い、
                  # ジェネレータを list() で消費して全ドキュメントを実際に解析する。
                  list(yaml.safe_load_all(pathlib.Path(name).read_text()))
          PY
      - name: Read the pinned Terraform version
        id: terraform
        run: echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.terraform.outputs.version }}
          terraform_wrapper: false
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive platform/terraform
      - name: Validate Terraform root modules
        run: |
          set -e
          for file in $(find platform/terraform -name providers.tf | sort); do
            dir=$(dirname "$file")
            echo "== $dir"
            terraform -chdir="$dir" init -backend=false -input=false > /dev/null
            terraform -chdir="$dir" validate
          done
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cloud/api/go.mod
          cache-dependency-path: |
            cloud/api/go.sum
            cloud/provider/go.sum
            cloud/mcp/go.sum
      - name: Check Go formatting
        run: |
          unformatted=$(gofmt -l cloud)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: Vet and test the cloud API
        working-directory: cloud/api
        env:
          SHAKECLOUD_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: |
          go vet ./...
          go test ./...
      - name: Vet and test the cloud client, CLI and MCP server
        run: |
          for dir in cloud/client cloud/cli cloud/mcp; do
            echo "== $dir"
            (cd "$dir" && go vet ./... && go test ./...)
          done
      - name: Vet and test the Terraform provider
        working-directory: cloud/provider
        run: |
          go vet ./...
          go test ./...
      - name: Lint YAML
        run: python3 -m yamllint -c .yamllint .
      - name: Check publication contents
        run: python3 tools/check-publication.py
      - name: Build Japanese documentation
        run: python3 -m mkdocs build --strict
