name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install documentation and lint dependencies
        run: python3 -m pip install -r stacks/hub/requirements.txt -r tools/requirements.txt
      - name: Run unit tests
        run: python3 -m unittest discover -s tests
      - name: Compile tracked Python and parse YAML
        run: |
          python3 - <<'PY'
          import pathlib,py_compile,subprocess,yaml
          for name in subprocess.check_output(['git','ls-files','-z'],text=True).split('\0'):
              if name.endswith('.py'):
                  py_compile.compile(name,doraise=True)
              if name.endswith(('.yaml','.yml')):
                  yaml.safe_load(pathlib.Path(name).read_text())
          PY
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive platform/terraform
      - name: Validate Terraform root modules
        run: |
          set -e
          for file in $(find platform/terraform -name versions.tf | sort); do
            dir=$(dirname "$file")
            echo "== $dir"
            terraform -chdir="$dir" init -backend=false -input=false > /dev/null
            terraform -chdir="$dir" validate
          done
      - name: Lint YAML
        run: python3 -m yamllint -c .yamllint .
      - name: Check publication contents
        run: python3 tools/check-publication.py
      - name: Build Japanese documentation
        run: python3 -m mkdocs build --strict
