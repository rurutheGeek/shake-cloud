---
- name: Deploy shared authentication after the base, hub and music stacks
  hosts: media
  become: true
  vars:
    source_dir: '{{ playbook_dir }}/..'
  tasks:
    - name: Create SSO directory
      ansible.builtin.file:
        path: '{{ project_dir }}/sso'
        state: directory
        mode: '0750'
    - name: Copy SSO code
      ansible.builtin.copy:
        src: '{{ source_dir }}/sso/{{ item }}'
        dest: '{{ project_dir }}/sso/{{ item }}'
        mode: '0644'
      loop: [compose.yaml, Caddyfile, loopback-nginx.conf, manage.py, configure-nextcloud.py, configure-kavita.py, configure-identity-tls.py, configure-netbox.py]
    - name: Copy pinned gateway image
      ansible.builtin.copy:
        src: '{{ item }}'
        dest: '{{ project_dir }}/sso/compose.lock.yaml'
        mode: '0644'
      with_fileglob: ['{{ source_dir }}/sso/compose.lock.yaml']
    - name: Copy identity reconciliation code
      ansible.builtin.copy:
        src: '{{ source_dir }}/hub/{{ item }}'
        dest: '{{ project_dir }}/hub/{{ item }}'
        mode: '0644'
      loop: [configure-oidc.py, configure-proxy.py, configure-services.py, configure-homarr.py, users.py, users.example.json, manage.py, apps.json]
    - name: Check for a local NetBox deployment
      ansible.builtin.stat:
        path: '{{ project_dir }}/netbox/.env'
      register: local_netbox
    - name: Copy NetBox OIDC and lifecycle code
      ansible.builtin.copy:
        src: '{{ source_dir }}/netbox/{{ item }}'
        dest: '{{ project_dir }}/netbox/{{ item }}'
        mode: '0644'
      loop: [compose.yaml, manage.py, configuration/configuration.py]
      when: local_netbox.stat.exists
    - name: Deploy and reconcile SSO
      ansible.builtin.command:
        argv: ['{{ project_dir }}/.hub-venv/bin/python', '{{ project_dir }}/sso/manage.py']
      changed_when: true
