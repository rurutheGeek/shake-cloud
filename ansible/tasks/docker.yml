---
- name: Install repository prerequisites
  ansible.builtin.apt:
    name: [ca-certificates, curl, python3]
    state: present
    update_cache: true
- name: Create apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
- name: Fetch Docker repository signing key
  ansible.builtin.get_url:
    url: 'https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg'
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
- name: Configure signed Docker repository
  ansible.builtin.apt_repository:
    repo: 'deb [signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable'
    filename: docker
    state: present
- name: Install container runtime
  ansible.builtin.apt:
    name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
    state: present
    update_cache: true
- name: Enable Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
